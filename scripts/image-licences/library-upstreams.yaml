# Upstream project and licence of each shared library in a published image that no
# package manager owns: libraries bundled inside Python wheels, and libraries the
# image build adds. scripts/image-library-inventory.py reads this file. A library the
# file does not name renders as UNMAPPED in docs/licensing/image-shared-libraries.md,
# so a new bundled library cannot enter an image unrecorded.
#
# `class` is one of the closed set that the script declares:
#   permissive, public-domain, weak-copyleft (LGPL, CDDL: a separate, replaceable
#   shared object may ship), linking-exception (GPL with the GCC runtime exception),
#   strong-copyleft (GPL, AGPL), proprietary.
# A licence offered as a choice names the licence elected in `elected`.
#
# `evidence` is a licence file that the wheel ships (its name under `licenses/` or in
# the `.dist-info` directory) and that states the library's licence. `none` means the
# wheel ships no licence text for the library, and the licence is the upstream
# project's published licence, read on 2026-11-23 and not checked against the binary.
# A library named `"*"` covers every shared object of that wheel that no other entry
# names. `licence: declared` takes the licence that the wheel's own metadata declares.

wheels:
  numpy:
    evidence: LICENSE.txt
    libraries:
      libscipy_openblas64_: {upstream: OpenBLAS with LAPACK, licence: BSD-3-Clause AND BSD-3-Clause-Open-MPI, class: permissive}
      libgfortran: {upstream: GCC runtime library (libgfortran), licence: GPL-3.0-or-later WITH GCC-exception-3.1, class: linking-exception}
      libquadmath: {upstream: GCC runtime library (libquadmath), licence: LGPL-2.1-or-later, class: weak-copyleft}
  scipy:
    evidence: LICENSE.txt
    libraries:
      libscipy_openblas: {upstream: OpenBLAS with LAPACK, licence: BSD-3-Clause AND BSD-3-Clause-Open-MPI, class: permissive}
      libgfortran: {upstream: GCC runtime library (libgfortran), licence: GPL-3.0-or-later WITH GCC-exception-3.1, class: linking-exception}
      libquadmath: {upstream: GCC runtime library (libquadmath), licence: LGPL-2.1-or-later, class: weak-copyleft}
  scikit-learn:
    evidence: COPYING
    libraries:
      libgomp: {upstream: GCC runtime library (libgomp), licence: GPL-3.0-or-later WITH GCC-exception-3.1, class: linking-exception}
  ijson:
    evidence: LICENSE.txt
    libraries:
      libyajl: {upstream: YAJL, licence: ISC, class: permissive}
  onnxruntime:
    evidence: none
    libraries:
      libonnxruntime: {upstream: ONNX Runtime, licence: MIT, class: permissive}
      libonnxruntime_providers_shared: {upstream: ONNX Runtime, licence: MIT, class: permissive}
  sqlite-vec:
    evidence: none
    libraries:
      vec0: {upstream: sqlite-vec (a SQLite loadable extension), licence: MIT OR Apache-2.0, elected: either, class: permissive}
  pillow:
    evidence: LICENSE
    libraries:
      libavif: {upstream: libavif (with AOM), licence: BSD-2-Clause, class: permissive}
      libbrotlicommon: {upstream: Brotli, licence: MIT, class: permissive}
      libbrotlidec: {upstream: Brotli, licence: MIT, class: permissive}
      libfreetype: {upstream: FreeType, licence: FTL OR GPL-2.0-or-later, elected: FTL, class: permissive}
      libharfbuzz: {upstream: HarfBuzz, licence: MIT, class: permissive}
      libjpeg: {upstream: libjpeg-turbo, licence: IJG AND BSD-3-Clause AND Zlib, class: permissive}
      liblcms2: {upstream: Little CMS 2, licence: MIT, class: permissive}
      liblzma: {upstream: XZ Utils (liblzma), licence: 0BSD, class: permissive}
      libopenjp2: {upstream: OpenJPEG, licence: BSD-2-Clause, class: permissive}
      libpng16: {upstream: libpng, licence: libpng-2.0, class: permissive}
      libsharpyuv: {upstream: libwebp (libsharpyuv), licence: BSD-3-Clause, class: permissive}
      libtiff: {upstream: libtiff, licence: libtiff, class: permissive}
      libwebp: {upstream: libwebp, licence: BSD-3-Clause, class: permissive}
      libwebpdemux: {upstream: libwebp, licence: BSD-3-Clause, class: permissive}
      libwebpmux: {upstream: libwebp, licence: BSD-3-Clause, class: permissive}
      libzstd: {upstream: Zstandard, licence: BSD-3-Clause OR GPL-2.0-only, elected: BSD-3-Clause, class: permissive}
      libxcb: {upstream: libxcb (X.Org), licence: MIT, evidence: none, class: permissive}
      libXau: {upstream: libXau (X.Org), licence: MIT, evidence: none, class: permissive}
  rawpy:
    evidence: LICENSE.LibRaw
    libraries:
      libraw_r: {upstream: LibRaw, licence: LGPL-2.1-only OR CDDL-1.0, elected: LGPL-2.1-only, class: weak-copyleft}
      libgomp: {upstream: GCC runtime library (libgomp), licence: GPL-3.0-or-later WITH GCC-exception-3.1, evidence: none, class: linking-exception}
      libjasper: {upstream: JasPer, licence: JasPer-2.0, evidence: none, class: permissive}
      libjpeg: {upstream: libjpeg-turbo, licence: IJG AND BSD-3-Clause AND Zlib, evidence: none, class: permissive}
      liblcms2: {upstream: Little CMS 2, licence: MIT, evidence: none, class: permissive}
  pypdfium2:
    evidence: pdfium.txt
    libraries:
      libpdfium: {upstream: PDFium (binary build by pdfium-binaries), licence: BSD-3-Clause AND Apache-2.0 with the dependency licences that the wheel lists in BUILD_LICENSES, class: permissive}
  pi-heif:
    evidence: LICENSES_bundled.txt
    libraries:
      libheif: {upstream: libheif, licence: LGPL-3.0-or-later, class: weak-copyleft}
      libde265: {upstream: libde265, licence: LGPL-3.0-or-later, class: weak-copyleft}
  torch:
    evidence: LICENSE
    libraries:
      "*": {upstream: PyTorch, licence: declared, class: permissive}
      libgomp: {upstream: GCC runtime library (libgomp), licence: GPL-3.0-or-later WITH GCC-exception-3.1, evidence: none, class: linking-exception}
      libgfortran: {upstream: GCC runtime library (libgfortran), licence: GPL-3.0-or-later WITH GCC-exception-3.1, evidence: none, class: linking-exception}
      libopenblas: {upstream: OpenBLAS, licence: BSD-3-Clause, evidence: none, class: permissive}
      libarm_compute: {upstream: Arm Compute Library, licence: MIT, evidence: none, class: permissive}
      libarm_compute_graph: {upstream: Arm Compute Library, licence: MIT, evidence: none, class: permissive}
  triton:
    evidence: LICENSE
    libraries:
      "*": {upstream: Triton, licence: declared, class: permissive}
      libcupti: {upstream: NVIDIA CUPTI, licence: LicenseRef-NVIDIA-Proprietary, evidence: none, class: proprietary}
      libcheckpoint: {upstream: NVIDIA CUPTI, licence: LicenseRef-NVIDIA-Proprietary, evidence: none, class: proprietary}
      libnvperf_host: {upstream: NVIDIA CUPTI, licence: LicenseRef-NVIDIA-Proprietary, evidence: none, class: proprietary}
      libnvperf_target: {upstream: NVIDIA CUPTI, licence: LicenseRef-NVIDIA-Proprietary, evidence: none, class: proprietary}
      libpcsamplingutil: {upstream: NVIDIA CUPTI, licence: LicenseRef-NVIDIA-Proprietary, evidence: none, class: proprietary}
  # NVIDIA CUDA runtime wheels, installed for torch in the cuda image. Each declares
  # LicenseRef-NVIDIA-Proprietary and ships the NVIDIA End User License Agreement.
  nvidia-cublas: {evidence: License.txt, libraries: {"*": {upstream: NVIDIA cuBLAS, licence: declared, class: proprietary}}}
  nvidia-cuda-cupti: {evidence: License.txt, libraries: {"*": {upstream: NVIDIA CUPTI, licence: declared, class: proprietary}}}
  nvidia-cuda-nvrtc: {evidence: License.txt, libraries: {"*": {upstream: NVIDIA NVRTC, licence: declared, class: proprietary}}}
  nvidia-cuda-runtime: {evidence: License.txt, libraries: {"*": {upstream: NVIDIA CUDA runtime, licence: declared, class: proprietary}}}
  nvidia-cudnn-cu13: {evidence: License.txt, libraries: {"*": {upstream: NVIDIA cuDNN, licence: declared, class: proprietary}}}
  nvidia-cufft: {evidence: License.txt, libraries: {"*": {upstream: NVIDIA cuFFT, licence: declared, class: proprietary}}}
  nvidia-cufile: {evidence: License.txt, libraries: {"*": {upstream: NVIDIA cuFile, licence: declared, class: proprietary}}}
