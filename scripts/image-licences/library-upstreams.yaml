# Libraries outside both a package manager and a wheel. The key is the library's stem.
# `evidence` is the file in the image that states the licence.
other_libraries:
  - {stem: libpython3.12, upstream: CPython, licence: PSF-2.0, class: permissive, evidence: /usr/local/lib/python3.12/LICENSE.txt}
  - {stem: libpython3, upstream: CPython, licence: PSF-2.0, class: permissive, evidence: /usr/local/lib/python3.12/LICENSE.txt}
  - {stem: libavcodec, upstream: FFmpeg (built by this image in its LGPL configuration), licence: LGPL-2.1-or-later, class: weak-copyleft, evidence: /usr/share/doc/ffmpeg-lgpl/COPYING.LGPLv2.1}
  - {stem: libavdevice, upstream: FFmpeg (built by this image in its LGPL configuration), licence: LGPL-2.1-or-later, class: weak-copyleft, evidence: /usr/share/doc/ffmpeg-lgpl/COPYING.LGPLv2.1}
  - {stem: libavfilter, upstream: FFmpeg (built by this image in its LGPL configuration), licence: LGPL-2.1-or-later, class: weak-copyleft, evidence: /usr/share/doc/ffmpeg-lgpl/COPYING.LGPLv2.1}
  - {stem: libavformat, upstream: FFmpeg (built by this image in its LGPL configuration), licence: LGPL-2.1-or-later, class: weak-copyleft, evidence: /usr/share/doc/ffmpeg-lgpl/COPYING.LGPLv2.1}
  - {stem: libavutil, upstream: FFmpeg (built by this image in its LGPL configuration), licence: LGPL-2.1-or-later, class: weak-copyleft, evidence: /usr/share/doc/ffmpeg-lgpl/COPYING.LGPLv2.1}
  - {stem: libswresample, upstream: FFmpeg (built by this image in its LGPL configuration), licence: LGPL-2.1-or-later, class: weak-copyleft, evidence: /usr/share/doc/ffmpeg-lgpl/COPYING.LGPLv2.1}
  - {stem: libswscale, upstream: FFmpeg (built by this image in its LGPL configuration), licence: LGPL-2.1-or-later, class: weak-copyleft, evidence: /usr/share/doc/ffmpeg-lgpl/COPYING.LGPLv2.1}

# Operating-system packages for which trivy reads no licence, because the Debian
# copyright file states it as free text instead of `License:` fields. `evidence` is the
# copyright file in the image that states the licence. A package that this list omits
# renders as `none read`; none of those copyright files names a GPL or LGPL licence.
operating_system:
  - {package: libgcc-s1, licence: GPL-3.0-or-later WITH GCC-exception-3.1, class: linking-exception, evidence: /usr/share/doc/gcc-14-base/copyright}
  - {package: libstdc++6, licence: GPL-3.0-or-later WITH GCC-exception-3.1, class: linking-exception, evidence: /usr/share/doc/gcc-14-base/copyright}
  - {package: libgomp1, licence: GPL-3.0-or-later WITH GCC-exception-3.1, class: linking-exception, evidence: /usr/share/doc/gcc-14-base/copyright}
  - {package: libatomic1, licence: GPL-3.0-or-later WITH GCC-exception-3.1, class: linking-exception, evidence: /usr/share/doc/gcc-14-base/copyright}
  - {package: libcrypt1, licence: LGPL-2.1-or-later, class: weak-copyleft, evidence: /usr/share/doc/libcrypt1/copyright}
  - {package: libncursesw6, licence: X11 (MIT-style permission notice), class: permissive, evidence: /usr/share/doc/libtinfo6/copyright}
  - {package: libleptonica6, licence: BSD-style redistribution notice, class: permissive, evidence: /usr/share/doc/libleptonica6/copyright}
  - {package: libpixman-1-0, licence: MIT-style permission notice, class: permissive, evidence: /usr/share/doc/libpixman-1-0/copyright}
  - {package: libx11-6, licence: MIT-style permission notice, class: permissive, evidence: /usr/share/doc/libx11-6/copyright}
  - {package: libx11-data, licence: MIT-style permission notice, class: permissive, evidence: /usr/share/doc/libx11-data/copyright}
  - {package: libxcb1, licence: MIT-style permission notice, class: permissive, evidence: /usr/share/doc/libxcb1/copyright}
  - {package: libxcb-render0, licence: MIT-style permission notice, class: permissive, evidence: /usr/share/doc/libxcb-render0/copyright}
  - {package: libxcb-shm0, licence: MIT-style permission notice, class: permissive, evidence: /usr/share/doc/libxcb-shm0/copyright}
  - {package: libxext6, licence: MIT-style permission notice, class: permissive, evidence: /usr/share/doc/libxext6/copyright}
