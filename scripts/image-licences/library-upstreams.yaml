  nvidia-nccl-cu13: {evidence: License.txt, libraries: {"*": {upstream: NVIDIA NCCL, licence: declared, class: proprietary}}}
  nvidia-nvjitlink: {evidence: License.txt, libraries: {"*": {upstream: NVIDIA nvJitLink, licence: declared, class: proprietary}}}
  nvidia-nvshmem-cu13: {evidence: License.txt, libraries: {"*": {upstream: NVIDIA NVSHMEM, licence: declared, class: proprietary}}}
  nvidia-nvtx: {evidence: License.txt, libraries: {"*": {upstream: NVIDIA NVTX, licence: declared, class: proprietary}}}

  # Removed from the images by the licence work. They stay here so a scan of an older
  # release still renders: the released v0.200.0 images carry them.
  pymupdf:
    evidence: COPYING
    libraries:
      "*": {upstream: PyMuPDF with MuPDF, licence: AGPL-3.0-only OR Artifex Commercial License, class: strong-copyleft}
  pillow-heif:
    evidence: LICENSES_bundled.txt
    libraries:
      libheif: {upstream: libheif, licence: LGPL-3.0-or-later, class: weak-copyleft}
      libde265: {upstream: libde265, licence: LGPL-3.0-or-later, class: weak-copyleft}
      libx265: {upstream: x265, licence: GPL-2.0 (the wheel states GPLv2), class: strong-copyleft}
  av:
    evidence: none
    libraries:
      libavcodec: {upstream: FFmpeg, licence: GPL-2.0-or-later (built with --enable-gpl), class: strong-copyleft}
      libavdevice: {upstream: FFmpeg, licence: GPL-2.0-or-later (built with --enable-gpl), class: strong-copyleft}
      libavfilter: {upstream: FFmpeg, licence: GPL-2.0-or-later (built with --enable-gpl), class: strong-copyleft}
      libavformat: {upstream: FFmpeg, licence: GPL-2.0-or-later (built with --enable-gpl), class: strong-copyleft}
      libavutil: {upstream: FFmpeg, licence: GPL-2.0-or-later (built with --enable-gpl), class: strong-copyleft}
      libswresample: {upstream: FFmpeg, licence: GPL-2.0-or-later (built with --enable-gpl), class: strong-copyleft}
