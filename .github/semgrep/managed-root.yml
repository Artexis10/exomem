rules:
  - id: managed-root-bare-name
    languages: [python]
    severity: ERROR
    message: >-
      Reach the managed root through the managed_* helpers in src/exomem/kbdir.py (managed_join,
      managed_split, managed_split_parts, managed_root, managed_root_rel, and the others), never through
      kb_dirname() or kb_prefix(). A site that builds or compares the wrapper folder name itself
      breaks when the managed root layout changes. If no helper fits, extend kbdir.py.
    pattern-either:
      - pattern: kb_dirname()
      - pattern: kb_prefix()
      - pattern: $MODULE.kb_dirname()
      - pattern: $MODULE.kb_prefix()
    paths:
      include:
        - src/exomem
      exclude:
        - src/exomem/kbdir.py

  - id: managed-root-default-name-literal
    languages: [python]
    severity: ERROR
    message: >-
      Do not spell the default managed-root folder name in code. Build a managed-root path with
      managed_join, and compare a path with managed_split, managed_split_parts, is_managed_root_name or
      is_in_managed_root (src/exomem/kbdir.py). A literal breaks when the managed root layout changes.
      A string that only describes the folder to a person, never joins or compares a path, keeps
      `# nosemgrep: managed-root-default-name-literal -- <reason>`.
    # A line that only uses a constant spelled elsewhere in the file is not a new spelling.
    options:
      constant_propagation: false
    patterns:
      - pattern: '"$STR"'
      # Matches the folder as a path component anywhere in the string, so prose that says "the Knowledge
      # Base" stays clear. The regex is anchored at the start of the string, hence the leading `.*/`. The
      # name is kbdir._DEFAULT: change both together.
      - metavariable-regex:
          metavariable: $STR
          regex: '^(.*/)?Knowledge Base(/|$)'
    paths:
      include:
        - src/exomem
      exclude:
        - src/exomem/kbdir.py
