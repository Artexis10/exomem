name: Heavy media E2E

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  media-e2e:
    name: real OCR, PDF, ASR, CLIP, and video
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install system media engines
        # Same exposure as the isolation runtime in ci.yml, and the same fix.
        # This lane is not a required check, so a stall here costs an hour of
        # runner time rather than a release -- still worth bounding. The larger
        # allowance covers the media engines actually being sizeable.
        timeout-minutes: 8
        run: scripts/ci-apt-install.sh tesseract-ocr espeak ffmpeg
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Cache model downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: heavy-media-tiny-whisper-clip-v1
      - name: Run real media product smoke
        run: >-
          uv run --frozen --extra embeddings --extra media
          python scripts/smoke-media-pipeline.py --require-all
