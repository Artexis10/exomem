name: Heavy media E2E

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  media-e2e:
    name: real OCR, PDF, ASR, CLIP, and video
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install system media engines
        # Cover the shared helper's complete download and installation budget.
        timeout-minutes: 9
        run: scripts/ci-apt-install.sh tesseract-ocr espeak ffmpeg
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Cache model downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: heavy-media-tiny-whisper-clip-v1
      - name: Run real media product smoke
        env:
          # The smoke proves the media lanes; recall's text model stays the one
          # its model cache holds.
          EXOMEM_RECALL_MODEL: BAAI/bge-base-en-v1.5
        run: >-
          uv run --frozen --extra embeddings --extra media
          python scripts/smoke-media-pipeline.py --require-all
