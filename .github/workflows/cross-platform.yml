name: cross-platform

# Deliberately its own workflow rather than a job in ci.yml.
#
# `ci.yml` holds an invariant worth keeping: one required gate needs *every* job
# in that file, enforced by `test_ci_reliability_contract.py`, so no job can be
# silently un-gated. A lane nobody has triaged yet does not belong inside that
# invariant, and weakening the gate to carve out an exception would trade a
# clear rule for a flag. A separate workflow is structurally advisory instead of
# advisory by annotation -- it is visibly not the required gate.
#
# Why it exists: every job in ci.yml runs on ubuntu-latest, which leaves a whole
# class of defect to be caught by hand. On Windows CPython opens files without
# FILE_SHARE_DELETE, so any handle left open refuses `os.replace` and `unlink`
# with WinError 32 -- a failure mode Linux does not have. Four such defects were
# found manually against this suite before this lane existed.
#
# Promote to a required gate once it is green across a few merges. An advisory
# lane that stays advisory forever is just noise.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: cross-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  suite:
    name: tests (${{ matrix.os }}, py3.13, shard ${{ matrix.shard }}/4)
    # Not for the release bot's version-bump PR. Its diff is a version string
    # and a changelog; it carries no code this lane could say anything about,
    # and `main` runs the lane on push immediately after it merges. The bot
    # force-pushes that branch on every merge to main -- twenty times in one
    # release cycle here -- and each force-push relaunched the whole matrix
    # into a queue that real PRs were waiting in. macOS runners cap at five
    # concurrent jobs for a public repo on the free tier, so those launches
    # were not free capacity; they were the queue.
    if: >-
      github.event_name != 'pull_request'
      || !startsWith(github.head_ref, 'release-please--branches--')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # macOS on merge; Windows on everything.
        #
        # These two runners are not equally scarce and do not buy equally much.
        # A public repo on the free tier may run 20 jobs at once but only FIVE
        # on macOS, so a four-shard macOS matrix cannot fit twice: two open PRs
        # want eight macOS jobs, the second run's shards sit queued, and because
        # a run's jobs are scheduled together the whole second run stalls behind
        # the first. Going to four shards halved one run's wall clock and
        # serialised the runs against each other -- with three PRs in flight the
        # queue got longer, not shorter. Measured here: 16 runs queued behind 2
        # in progress, both of them this lane.
        #
        # What macOS buys before a merge is also the smaller half. Everything
        # this lane's header describes -- CPython opening files without
        # FILE_SHARE_DELETE, WinError 32 refusing os.replace, backslash
        # separators reaching a dict key -- is Windows behaviour, and Windows is
        # where every defect this lane has actually caught has been. macOS
        # shares POSIX file semantics and path separators with the ubuntu lane
        # in ci.yml that already runs on every PR, so its marginal coverage
        # pre-merge is thin. Paying the scarcest runner for the thinnest
        # coverage is backwards.
        #
        # So PRs get Windows, where the defects are and where the cap is not,
        # and pushes to main get both. No commit stops reaching macOS; it
        # reaches it one merge later, on a lane that is advisory by design.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["windows-latest"]') || fromJSON('["windows-latest", "macos-latest"]') }}
        # Four shards, matching the Linux lane. This lane still exists to
        # expose platform behaviour rather than to be the fastest path to a
        # result -- but two shards made it the SLOWEST path by a wide margin: a
        # macOS shard measured 17m53s of execution and Windows shards ran past
        # 20 minutes, against a Linux lane finishing in a few. That is not a
        # neutral cost. It is the feedback delay on every change to this repo,
        # and it is paid on platforms whose defects are the hardest to
        # reproduce locally, which is exactly where a slow loop hurts most.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # No bubblewrap step: process isolation is Linux-only and the suite skips
      # what it cannot run. No Bun step either -- if a test turns out to need it,
      # that dependency is itself a finding this lane exists to surface.
      - name: Verify lockfile is current
        run: uv lock --check
      # The latency gate is dropped here for two reasons. It asserts *scaling*,
      # which a shared runner cannot measure meaningfully, and this lane exists
      # to expose platform behaviour rather than performance -- it already has
      # its own dedicated job. More importantly it was destructive: building a
      # dense vault takes longer than the 60s per-test timeout on a Windows
      # runner, and `timeout_method = "thread"` kills the whole process, so the
      # shard wrote no junit at all. One slow perf test cost the entire shard's
      # evidence, which is how a Windows lane came back with half its results
      # missing and no indication that anything was absent.
      # Two changes here, both about the lane being able to report at all.
      #
      # `--timeout=300` overrides the 60s in pyproject for this lane only. 60s
      # is calibrated for Linux and a Windows runner is materially slower, and
      # the cost of crossing it is not one failed test: `timeout_method =
      # "thread"` kills the process, so the shard writes no junit and its whole
      # half of the lane goes unreported, exactly as the latency gate did above.
      #
      # The deselected test is a measured outlier rather than a slow one. On
      # Windows it costs ~640s, and the shape says why: seeding the 1000 items
      # takes 3.1s and `bm25.search` 3.8s, but one `planning.query` page (50 of
      # 1000) takes 31.6s, and the test walks 20 pages. That is ~31ms per item
      # against a 1.42ms guarded read, so it is a performance gap in
      # `planning.query` on Windows, not the platform behaviour this lane exists
      # to expose. It is deselected here so it cannot destroy the shard's
      # evidence, not to hide it -- the gap is real and wants its own change.
      # The two governance microgates are deselected for the reason the
      # latency gate is ignored above: they assert timing ceilings, and a
      # shared runner executing four shards at once cannot measure one.
      # `test_governed_receipt_append_overhead_under_budget` re-runs itself in
      # a fresh child process to escape accumulated interpreter state, so on
      # Windows it costs a nested pytest session and hit its own 180s
      # subprocess timeout; on macOS the child reported the 3ms median / 8ms
      # p95 receipt ceiling exceeded. `test_scrubber_throughput_under_budget`
      # asserts a 3.0x ratio against its own prescan-only cost and measured
      # 4.91x. Both stay gating on the Linux lane they are calibrated for;
      # neither is the platform behaviour this lane exists to expose.
      # The required native-NTFS job in ci.yml owns the held-filesystem,
      # reserved-path, mutation-race, and Windows-alias modules. Running those
      # same modules again in this Windows matrix pushed a shard past its 45m
      # session cap; macOS still gets them here, and Linux keeps its ordinary
      # CI coverage.
      # `--session-timeout` is 55 min inside a 60 min job -- the same five-minute
      # margin ci.yml leaves (1500s session in a 30 min job). At 2700s the cap sat
      # below normal Windows runtime rather than above it: shards on main measured
      # 38:40, 38:57, 42:58 and 45:44 against a 45:00 cap, so whichever crossed it
      # reported `2929 passed, 226 skipped, 0 failed in 45:02` and then exit 1.
      # Those were a clock, not a defect, and they read as a red main for two days.
      # The cap stays below the job budget on purpose: it still catches a genuine
      # hang, and pytest prints a summary where a killed job prints nothing.
      # Every flag below lives inside a folded `>-` scalar, so a `#` there is part
      # of the command and comments out the rest of it. Explanations go here.
      - name: Run tests (lean — BM25/keyword, server media extraction off)
        env:
          KB_MCP_DISABLE_EMBEDDINGS: "1"
          KB_MCP_DISABLE_MEDIA_EXTRACTION: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          uv run --frozen --python 3.13 python -m pytest -q
          --ignore=tests/test_latency_gate.py
          --timeout=300
          --deselect
          tests/test_planning_recall.py::test_thousand_planning_items_stay_out_of_recall_but_queries_remain_complete
          --deselect
          tests/test_governance_overhead.py::test_governed_receipt_append_overhead_under_budget
          --deselect
          tests/test_governance_overhead.py::test_scrubber_throughput_under_budget
          ${{ startsWith(matrix.os, 'windows') && '--ignore=tests/test_held_fs_contract.py --ignore=tests/test_held_fs_windows.py --ignore=tests/test_reserved_admin_paths.py --ignore=tests/test_mutation_concurrency.py --ignore=tests/test_windows_path_alias_guard.py' || '' }}
          --splits=4
          --group=${{ matrix.shard }}
          --splitting-algorithm=least_duration
          --durations-path=.test_durations.json
          --session-timeout=3300
          --durations=50
          --durations-min=1
          --junitxml=test-results/junit-${{ matrix.os }}-shard-${{ matrix.shard }}.xml
      - name: Upload cross-platform test timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crossplat-${{ matrix.os }}-shard-${{ matrix.shard }}-junit
          path: test-results/junit-${{ matrix.os }}-shard-${{ matrix.shard }}.xml
          if-no-files-found: warn
