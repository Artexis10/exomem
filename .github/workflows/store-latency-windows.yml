name: Store latency (native Windows)

# The store's phase gate needs guarded append, full inspect, bulk and query
# timings on native NTFS, and file-mode query timings at the same sizes to
# compare against. It also needs the store-mode suites to pass where the held
# filesystem, the renames and the durability flushes are the native Windows
# ones; the per-PR tier runs those suites on Linux only. Dispatch this lane by
# hand against a ref; it gates nothing and uploads its reports.
on:
  workflow_dispatch:
    inputs:
      run:
        description: Which part to run
        type: choice
        options: [both, latency, suites]
        default: both
      pytest_args:
        description: >-
          Pytest arguments for the suites part, one path or node id per word (globs
          expand; a word cannot hold a space, so no -k expression). One suite or one
          test makes a run of minutes.
        type: string
        default: tests/test_vault_store_*.py

permissions:
  contents: read

jobs:
  store-latency:
    name: store append and inspect latency (native NTFS)
    if: inputs.run != 'suites'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Measure store-mode latency at 1,000 and 10,000 rows
        env:
          EXOMEM_DISABLE_CLIP: "1"
          EXOMEM_DISABLE_EMBEDDINGS: "1"
          EXOMEM_DISABLE_WARMUP: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          uv run --frozen --python 3.13 python scripts/measure-records-append-latency.py
          --sizes 1000,10000 --appends 30 --storage store --phase-probes
          --out store-latency-windows.json
      # The file path refuses collections over 2,000 items; --lift-caps measures it past that.
      - name: Measure file-mode latency at the same sizes
        if: success() || failure()
        timeout-minutes: 40
        env:
          EXOMEM_DISABLE_CLIP: "1"
          EXOMEM_DISABLE_EMBEDDINGS: "1"
          EXOMEM_DISABLE_WARMUP: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          uv run --frozen --python 3.13 python scripts/measure-records-append-latency.py
          --sizes 1000,10000 --appends 10 --storage files --lift-caps
          --out file-latency-windows.json
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-latency-windows
          path: |
            store-latency-windows.json
            file-latency-windows.json
          if-no-files-found: warn

  store-suites:
    name: store-mode suites (native NTFS)
    if: inputs.run != 'latency'
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          # A suite compares against the schema that a tagged release created.
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          prune-cache: true
      # The protected-media tests skip without the real age and age-keygen. The archive is
      # pinned by version and SHA-256, as scripts/ci-install-age.sh pins the Linux one.
      - name: Install age
        shell: pwsh
        env:
          AGE_VERSION: v1.2.1
          AGE_SHA256: 46db0db71f146061f7c8fffa912cb806aef1bc8450e27a3abc1744f0591b89fb
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "age.zip"
          $url = "https://github.com/FiloSottile/age/releases/download/$env:AGE_VERSION/age-$env:AGE_VERSION-windows-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive -MaximumRetryCount 5 -RetryIntervalSec 10
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $env:AGE_SHA256) { throw "age archive checksum mismatch" }
          $target = Join-Path $env:RUNNER_TEMP "age-tools"
          Expand-Archive -Path $archive -DestinationPath $target
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $target "age")
      - name: Run the store-mode suites
        shell: bash
        env:
          KB_MCP_DISABLE_EMBEDDINGS: "1"
          KB_MCP_DISABLE_MEDIA_EXTRACTION: "1"
          EXOMEM_DISABLE_CLIP: "1"
          # The service fixture must not start model loading or cache warmup.
          EXOMEM_DISABLE_EMBEDDINGS: "1"
          EXOMEM_DISABLE_WARMUP: "1"
          EXOMEM_WRITER_LEASE_STATE_DIR: ${{ runner.temp }}\exomem-reserved-state
          PYTHONDONTWRITEBYTECODE: "1"
          # An environment variable, never interpolated into the script text.
          PYTEST_ARGS: ${{ inputs.pytest_args }}
        run: |
          # The unquoted expansion splits the input into words and expands globs; nothing evaluates it.
          # shellcheck disable=SC2086
          uv run --frozen --python 3.13 pytest \
            -p no:randomly -q -n 4 --timeout 600 -rfEX \
            --junitxml store-suites-windows.xml $PYTEST_ARGS
      - name: Upload the junit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-suites-windows
          path: store-suites-windows.xml
          if-no-files-found: warn
