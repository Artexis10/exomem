name: Store latency (native Windows)

# Diagnostic lane for the single-store spike branch: runs the file-canonical
# path and the single-store prototype on a synthetic vault on native NTFS,
# including hard-kill trials. Dispatch by hand against the spike ref; it gates
# nothing and uploads the JSON reports.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  single-store-spike:
    name: single-store spike (native NTFS)
    runs-on: windows-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Run the comparison on a 13,000-page synthetic vault
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          uv run --frozen --python 3.13 python scripts/spike_single_store/bench.py
          "${{ runner.temp }}/spike" "${{ github.workspace }}/spike-out"
          --shape scripts/spike_single_store/medium_vault_shape.json
          --pages 13000 --ops 100 --kills-files 0 --kills-single 0 --converge-seconds 900
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: single-store-spike-ntfs
          path: spike-out
          if-no-files-found: warn
