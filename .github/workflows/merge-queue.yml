name: merge queue

# The repository's merge queue (scripts/merge_queue.py has the whole design).
# Each event can make a queued pull request ready or free the queue for the
# next batch: auto-merge enabled, a pull request's CI finishing, a batch
# landing on main, and a queue run's verdict (dispatched from ci.yml). The
# schedule recovers a run whose wake-up was lost.
on:
  pull_request_target:
    types: [auto_merge_enabled]
  workflow_run:
    workflows: [CI]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  advance:
    # A pull request's CI finishing matters; main's own push runs are covered by the push event.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request' }}
    # One controller at a time; GitHub keeps the newest waiting job and drops older
    # ones, and each job reads the whole queue again. The group sits on the job so a
    # skipped run never takes the waiting slot from a real wake-up.
    concurrency:
      group: merge-queue
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write
    steps:
      # Always main's code: pull request heads are only merged as data, never run here.
      - uses: actions/checkout@v4
        with:
          ref: main
          # Commits only: merge bases need the history, and trees and blobs load on demand.
          fetch-depth: 0
          filter: tree:0
      - name: Start the next batch when the queue is free
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: merge-queue
          GIT_AUTHOR_EMAIL: merge-queue@users.noreply.github.com
          GIT_COMMITTER_NAME: merge-queue
          GIT_COMMITTER_EMAIL: merge-queue@users.noreply.github.com
        run: python3 scripts/merge_queue.py advance
