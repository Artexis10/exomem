name: merge queue

# The repository's merge queue (scripts/merge_queue.py has the whole design).
# Each event can make a queued pull request ready or free the queue for the
# next batch: auto-merge enabled, a pull request's checks finishing, a batch
# landing on main, and a queue run's verdict or the controller itself
# (dispatches). The schedule recovers a lost wake-up. No pull_request_target
# trigger: public repositories block it by default from 2026-12-02.
on:
  pull_request:
    types: [auto_merge_enabled]
  workflow_run:
    # A pull request's two required checks; the queue takes it once both passed.
    workflows: [CI, PR title]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  # A pull_request run uses the pull request's own workflow file, so it only wakes
  # main's controller; a fork's read-only token cannot, and forks never join anyway.
  wake:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Wake the queue on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run merge-queue.yml --repo "$GITHUB_REPOSITORY" --ref main

  # Keeps Full evidence on main recent so a release cut can reuse it (release_cuts.py
  # pick-source). The repository variable FULL_EVIDENCE_HOURS sets the window; 0 turns it off.
  # Each landing on main checks it; GitHub creates this workflow's schedule only hours apart.
  # The script reads the window itself: an unset variable is null here, and GitHub compares
  # null with '0' as the number 0, so a condition on the variable would skip the job.
  full-evidence:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    concurrency:
      group: full-evidence
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: scripts
      - name: Dispatch Full on main when its newest Full run is old
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FULL_EVIDENCE_HOURS: ${{ vars.FULL_EVIDENCE_HOURS || '4' }}
        run: python3 scripts/release_evidence.py main-full

  advance:
    # A pull request's checks finishing matter; main's own push runs are covered by the push event.
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request') }}
    # One controller at a time; GitHub keeps the newest waiting job and drops older
    # ones, and each job reads the whole queue again. The group sits on the job so a
    # skipped run never takes the waiting slot from a real wake-up.
    concurrency:
      group: merge-queue
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write
    steps:
      # Always main's code: pull request heads are only merged as data, never run here.
      - uses: actions/checkout@v4
        with:
          ref: main
          # Commits only: merge bases need the history, and trees and blobs load on demand.
          fetch-depth: 0
          filter: tree:0
      - name: Start the next batch when the queue is free
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: merge-queue
          GIT_AUTHOR_EMAIL: merge-queue@users.noreply.github.com
          GIT_COMMITTER_NAME: merge-queue
          GIT_COMMITTER_EMAIL: merge-queue@users.noreply.github.com
        run: python3 scripts/merge_queue.py advance
