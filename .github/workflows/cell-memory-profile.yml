name: Cell memory profile

# bound-cell-memory D1: the before/after instrument for a cloud cell's resident
# memory. Its own workflow, not a ci.yml job: releases take their evidence from
# a dispatched ci.yml run, and a measurement tool must neither lengthen nor
# block a release. A harness failure turns only this workflow red.
on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:

jobs:
  cell-memory-profile:
    name: cell memory profile (5k synthetic vault)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Profile a cloud cell's resident memory at its fixed points
        # A real cloud cell (EXOMEM_CLOUD_CELL=1) over a dense synthetic vault,
        # sampled at import, model load, ready, first hybrid find, first
        # governed write and a reaper tick. The stub encoder keeps every
        # vault-proportional structure at bge-m3's width without the model's
        # download or its CPU-hours of encoding; the model's fixed cost is
        # measured on demand with --encoder onnx. It fails only when the
        # harness cannot drive the cell or a vault string reaches the report:
        # no memory figure is gated until task 1.3 sets baselines.
        # 5,000 notes (~20k chunks, 2.5x the latency lane) ran end to end in
        # 3m19s on a 20-core laptop; a runner at a 2-3x slower single thread
        # stays well inside the 15-minute target.
        run: >-
          uv run --frozen --extra embeddings-onnx python scripts/cell_memory_profile.py
          --notes 5000 --encoder stub --out test-results/cell-memory-profile.json
      - name: Upload the cell memory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cell-memory-profile
          path: test-results/cell-memory-profile.json
          if-no-files-found: ignore
