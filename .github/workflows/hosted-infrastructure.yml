name: Hosted infrastructure

on:
  pull_request:
    paths:
      - "infra/**"
      - "docs/runbooks/hosted/**"
      - "tests/test_hosted_*.py"
      - "openspec/changes/add-hosted-private-alpha-infrastructure/**"
      - ".github/workflows/hosted-infrastructure.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "docs/runbooks/hosted/**"
      - "tests/test_hosted_*.py"
      - "openspec/changes/add-hosted-private-alpha-infrastructure/**"
      - ".github/workflows/hosted-infrastructure.yml"
  # Re-enable the five-minute schedule only after the hosted deployment exists
  # and all three EXOMEM_BLACKBOX_* repository secrets are configured. The
  # cadence must match observability-v1.json poll_interval_seconds (300).
  workflow_dispatch:
    inputs:
      release_proof:
        description: Pull and verify the reviewed immutable release before promotion
        required: false
        default: false
        type: boolean
      deployment_phase:
        description: Exact reviewed pair member to consume
        required: true
        default: expand
        type: choice
        options: [expand, contract]
      external_blackbox:
        description: Run the deployed availability, backup-freshness, and scheduler probes
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  attestations: read

concurrency:
  group: hosted-infrastructure-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  # New pushes supersede PR feedback, but main and promotion evidence must finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.11.28"
  PYTHON_VERSION: "3.13.5"
  NODE_VERSION: "22.17.1"
  GO_VERSION: "1.26.5"

jobs:
  static:
    name: Offline static validation (not release proof)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - name: Restore exact validator bundle
        id: validator-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/go/bin/tflint
            ~/go/bin/helm
            ~/go/bin/kubeconform
            ~/go/bin/conftest
            ~/go/bin/sops
            ~/go/bin/age-keygen
            ~/.local/bin/trivy
            ~/.local/bin/shellcheck
            ~/.local/bin/oras
            .venv-hosted-ci
            ~/.ansible/collections
          key: hosted-validators-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('infra/tool-versions.env', 'infra/ansible/collections/requirements.yml') }}
      - name: Install exact infrastructure validators
        if: steps.validator-cache.outputs.cache-hit != 'true'
        run: |
          source infra/tool-versions.env
          install -d -m 0755 "$HOME/.local/bin"
          go install github.com/terraform-linters/tflint@v${TFLINT_VERSION}
          go install helm.sh/helm/v3/cmd/helm@v${HELM_VERSION}
          go install github.com/yannh/kubeconform/cmd/kubeconform@v${KUBECONFORM_VERSION}
          go install github.com/open-policy-agent/conftest@v${CONFTEST_VERSION}
          go install github.com/getsops/sops/v3/cmd/sops@v${SOPS_VERSION}
          go install filippo.io/age/cmd/age-keygen@v${AGE_VERSION}
          curl --fail --silent --show-error --location \
            --output /tmp/trivy.tar.gz \
            https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz
          echo "${TRIVY_LINUX_AMD64_SHA256}  /tmp/trivy.tar.gz" | sha256sum --check
          tar --extract --gzip --file /tmp/trivy.tar.gz --directory /tmp trivy
          install -m 0755 /tmp/trivy "$HOME/.local/bin/trivy"
          curl --fail --silent --show-error --location \
            --output /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz" | sha256sum --check
          tar --extract --xz --file /tmp/shellcheck.tar.xz --directory /tmp
          install -m 0755 /tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck "$HOME/.local/bin/shellcheck"
          curl --fail --silent --show-error --location \
            --output /tmp/oras.tar.gz \
            https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz
          echo "${ORAS_LINUX_AMD64_SHA256}  /tmp/oras.tar.gz" | sha256sum --check
          tar --extract --gzip --file /tmp/oras.tar.gz --directory /tmp oras
          install -m 0755 /tmp/oras "$HOME/.local/bin/oras"
          uv venv .venv-hosted-ci
          uv pip install --python .venv-hosted-ci/bin/python \
            ansible-core==${ANSIBLE_CORE_VERSION} ansible-lint==${ANSIBLE_LINT_VERSION} \
            checkov==${CHECKOV_VERSION}
          export PATH="$PWD/.venv-hosted-ci/bin:$PATH"
          ansible-galaxy collection install -r infra/ansible/collections/requirements.yml
      - name: Expose infrastructure validators
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "$PWD/.venv-hosted-ci/bin" >> "$GITHUB_PATH"
      - name: Audit exact validator versions
        run: |
          source infra/tool-versions.env
          require_go_module_version() {
            local binary="$1"
            local module="$2"
            local expected="$3"
            if ! go version -m "$(command -v "${binary}")" | \
              awk -v module="${module}" -v version="v${expected}" \
                '$1 == "mod" && $2 == module && $3 == version { found = 1 } END { exit !found }'; then
              echo "${binary} does not contain ${module}@v${expected}" >&2
              return 1
            fi
          }
          require_output_version() {
            local binary="$1"
            local expected="$2"
            shift 2
            local output
            local escaped="${expected//./\\.}"
            output="$("${binary}" "$@" 2>&1)"
            if ! grep -Eq "(^|[^0-9])v?${escaped}([^0-9]|$)" <<<"${output}"; then
              echo "${binary} did not report exact version ${expected}" >&2
              return 1
            fi
          }
          require_python_distribution() {
            local distribution="$1"
            local expected="$2"
            local actual
            actual="$(python -c 'import importlib.metadata as metadata, sys; print(metadata.version(sys.argv[1]))' "${distribution}")"
            if [[ "${actual}" != "${expected}" ]]; then
              echo "${distribution} is ${actual}, expected ${expected}" >&2
              return 1
            fi
          }
          require_go_module_version tflint github.com/terraform-linters/tflint "$TFLINT_VERSION"
          require_go_module_version helm helm.sh/helm/v3 "$HELM_VERSION"
          require_go_module_version kubeconform github.com/yannh/kubeconform "$KUBECONFORM_VERSION"
          require_go_module_version conftest github.com/open-policy-agent/conftest "$CONFTEST_VERSION"
          require_go_module_version sops github.com/getsops/sops/v3 "$SOPS_VERSION"
          require_go_module_version age-keygen filippo.io/age "$AGE_VERSION"
          require_python_distribution ansible-core "$ANSIBLE_CORE_VERSION"
          require_python_distribution ansible-lint "$ANSIBLE_LINT_VERSION"
          require_python_distribution checkov "$CHECKOV_VERSION"
          require_output_version ansible-galaxy "$COMMUNITY_GENERAL_VERSION" collection list community.general
          require_output_version ansible-galaxy "$COMMUNITY_LIBRARY_INVENTORY_FILTERING_VERSION" collection list community.library_inventory_filtering_v1
          require_output_version trivy "$TRIVY_VERSION" --version
          require_output_version shellcheck "$SHELLCHECK_VERSION" --version
          require_output_version oras "$ORAS_VERSION" version
      - name: Terraform, TFLint, Checkov, Ansible, Helm, policy, SOPS, types, tests, and secret scan
        run: |
          EXOMEM_RUN_REAL_SOPS_TESTS=1 \
          RUN_K3S_ADMISSION_TEST=1 \
          SOPS_BIN="$(command -v sops)" \
          AGE_KEYGEN_BIN="$(command -v age-keygen)" \
          infra/scripts/validate.sh
      - name: Strict hosted OpenSpec
        run: |
          source infra/tool-versions.env
          npm install --global @fission-ai/openspec@${OPENSPEC_VERSION}
          openspec validate add-hosted-private-alpha-infrastructure --strict

  release-proof:
    name: Published release promotion proof
    if: github.event_name == 'workflow_dispatch' && inputs.release_proof
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Install pinned ORAS for locked provisioner evidence discovery
        run: |
          source infra/tool-versions.env
          curl --fail --silent --show-error --location \
            --output /tmp/oras.tar.gz \
            https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz
          echo "${ORAS_LINUX_AMD64_SHA256}  /tmp/oras.tar.gz" | sha256sum --check
          tar --extract --gzip --file /tmp/oras.tar.gz --directory /tmp oras
          install -m 0755 /tmp/oras /usr/local/bin/oras
      - name: Derive and prove both published images from the reviewed phase lock
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_LOCK_PAIR: infra/contracts/exomem-hosted-deployment-lock-pair-v2.json
          DEPLOYMENT_PHASE: ${{ inputs.deployment_phase }}
        run: |
          test -f "$DEPLOYMENT_LOCK_PAIR" || { echo "canonical deployment lock pair is not committed" >&2; exit 2; }
          uv run --frozen python infra/scripts/prepare_hosted_release.py \
            --lock-pair "$DEPLOYMENT_LOCK_PAIR" \
            --phase "$DEPLOYMENT_PHASE" \
            --control-hostname control.example.invalid \
            --transfer-hostname transfer.example.invalid \
            --values-output /tmp/exomem-hosted-release-values.json
          PROVISIONER_IMAGE="$(python3 -c 'import json; print(json.load(open("/tmp/exomem-hosted-release-values.json"))["provisioner"]["deploymentLockJson"] )' | python3 -c 'import json, sys; print(json.load(sys.stdin)["components"]["provisioner"]["image"])')"
          uv run --frozen python infra/scripts/verify_hosted_release.py \
            --phase "$DEPLOYMENT_PHASE" \
            --repository .
          uv run --frozen python infra/scripts/verify_provisioner_image.py \
            --image "$PROVISIONER_IMAGE" \
            --require-published

  external-blackbox:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.external_blackbox)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: External availability, backup-freshness, and scheduler-last-success checks
        env:
          EXOMEM_BLACKBOX_CONTROL_URL: ${{ secrets.EXOMEM_BLACKBOX_CONTROL_URL }}
          EXOMEM_BLACKBOX_BACKUP_FRESHNESS_URL: ${{ secrets.EXOMEM_BLACKBOX_BACKUP_FRESHNESS_URL }}
          EXOMEM_BLACKBOX_SCHEDULER_URL: ${{ secrets.EXOMEM_BLACKBOX_SCHEDULER_URL }}
        run: python3 infra/scripts/external_blackbox.py --contract infra/contracts/observability-v1.json
