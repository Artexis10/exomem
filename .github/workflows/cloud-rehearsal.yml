name: Cloud rehearsal

on:
  pull_request:
    paths:
      - "infra/cloud-rehearsal/**"
      - "infra/cellctl/src/cellctl/control_test_contract.py"
      - "infra/cellctl/tests/fixtures/substrate-contract.json"
      - ".github/actions/substrate-test-contract/**"
      - ".github/workflows/cloud-rehearsal.yml"
  # The live rehearsal (P3) is the node gate; run it by hand before P4 and
  # after any change to cellctl, the platform chart, the cell image or the
  # pinned Substrate commit.
  workflow_dispatch:
    inputs:
      mode:
        description: "full: P3. full-coexistence: P3 with TopoLVM. owner-export: C6 after steps 1-2. operator-restore-abort: interrupted recovery. local-storage-drill: node-loss recovery."
        type: choice
        options: [full, full-coexistence, owner-export, operator-restore-abort, local-storage-drill]
        default: full

permissions:
  contents: read

concurrency:
  group: cloud-rehearsal-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: rehearsal unit tests and pinned ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Load the pinned tool versions
        run: grep -E '^[A-Z0-9_]+=' infra/tool-versions.env >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Check the rehearsal lockfile
        working-directory: infra/cloud-rehearsal
        run: uv lock --check
      - name: Unit tests
        working-directory: infra/cloud-rehearsal
        run: uv run --frozen python -m pytest -q -p no:cacheprovider tests
      - name: Pinned ruff
        working-directory: infra/cloud-rehearsal
        run: uvx --from "ruff==${RUFF_VERSION}" ruff check src tests

  rehearsal:
    name: P3 local rehearsal on disposable K3s
    needs: checks
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'local-storage-drill'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Load the pinned tool versions
        run: grep -E '^[A-Z0-9_]+=' infra/tool-versions.env >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      # The rehearsal builds three multi-GB cell images and imports each into
      # K3s, which a stock runner's free disk does not hold alongside the
      # preinstalled toolchains this job never uses.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      # Substrate's gateway image pins Node 24; its web app builds with the same.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Run the rehearsal
        working-directory: infra/cloud-rehearsal
        timeout-minutes: 140
        # On a pull request the question is whether the harness works: product
        # findings are in the report and the step summary, and exit 1 is the
        # node-gate verdict a manual dispatch enforces. A stage that cannot be
        # stood up, or a step that fails for any other reason, still fails here.
        env:
          PYTHONUNBUFFERED: "1"
          REHEARSAL_DIAGNOSTICS_DIR: ${{ runner.temp }}/rehearsal-diagnostics
          HARNESS_CHECK: ${{ github.event_name == 'pull_request' && '--harness-check' || '' }}
          COEXISTENCE: ${{ inputs.mode == 'full-coexistence' && '--local-storage-coexistence' || '' }}
          RESTORE_ABORT: ${{ inputs.mode == 'operator-restore-abort' && '--operator-restore-abort --steps 1,2 --harness-check' || '' }}
          OWNER_EXPORT: ${{ inputs.mode == 'owner-export' && '--owner-export --steps 1,2 --harness-check' || '' }}
        run: |
          uv run --frozen exomem-cloud-rehearsal run ${HARNESS_CHECK} ${COEXISTENCE} ${RESTORE_ABORT} ${OWNER_EXPORT} --report "${RUNNER_TEMP}/cloud-rehearsal-report.json"
      - name: Summarize the report
        if: always()
        run: |
          report="${RUNNER_TEMP}/cloud-rehearsal-report.json"
          if test -f "$report"; then
            python3 infra/cloud-rehearsal/summarize.py "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report was written." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Upload the report and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloud-rehearsal-report
          path: |
            ${{ runner.temp }}/cloud-rehearsal-report.json
            ${{ runner.temp }}/rehearsal-diagnostics
          if-no-files-found: error
          retention-days: 30

  local-reservation-host-proof:
    name: Native LVM reservation proof on disposable host
    needs: checks
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'local-storage-drill'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Load the pinned tool versions
        run: grep -E '^[A-Z0-9_]+=' infra/tool-versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: infra/topolvm/upstream-commit
      - name: Install runner storage tools
        # Cover the shared helper's complete download and installation budget.
        timeout-minutes: 9
        run: |
          scripts/ci-apt-install.sh lvm2 thin-provisioning-tools unzip
          sudo modprobe dm_thin_pool
      - name: Build canonical provider and negative controls
        env:
          GOMAXPROCS: "2"
          GOFLAGS: -p=2
        run: bash infra/cloud-rehearsal/reservations/build.sh "$RUNNER_TEMP/reservation-build"
      - name: Prove native locking and physical accounting
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,RUNNER_TEMP \
            bash infra/cloud-rehearsal/reservations/run.sh "$RUNNER_TEMP/reservation-build"
      - name: Retain compiled provider for the cluster drill
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-reservation-provider
          path: |
            ${{ runner.temp }}/reservation-build/canonical/build/lvmd
            ${{ runner.temp }}/reservation-build/canonical/build/hypertopolvm
            ${{ runner.temp }}/reservation-build/canonical/build/reservation-host-proof
            ${{ runner.temp }}/reservation-build/canonical/config/crd/bases/topolvm.io_logicalvolumes.yaml
            ${{ runner.temp }}/reservation-build/canonical/provenance.json
            ${{ runner.temp }}/reservation-build/canonical/upstream-commit
            ${{ runner.temp }}/reservation-build/evidence/source-identity.txt
            ${{ runner.temp }}/reservation-build/evidence/assembled-files.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Retain host proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-reservation-host-proof
          path: ${{ runner.temp }}/reservation-build/evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Remove owned build scratch
        if: always()
        run: sudo rm -rf -- "$RUNNER_TEMP/reservation-build"

  local-storage-drill:
    name: Local-storage node-loss drill on disposable K3s
    needs: [checks, local-reservation-host-proof]
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'local-storage-drill'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/substrate-test-contract
      - name: Download the proved provider binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: local-reservation-provider
          path: ${{ runner.temp }}/reservation-provider
      - name: Load the pinned tool versions
        run: grep -E '^[A-Z0-9_]+=' infra/tool-versions.env >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      # The cell image goes into Docker and both agents' containerd.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      # Exit 1 is a recorded product finding, 2 a harness failure; both fail
      # the job. Loop devices and the device-mapper module need sudo.
      - name: Run the drill
        working-directory: infra/cloud-rehearsal
        timeout-minutes: 140
        env:
          PYTHONUNBUFFERED: "1"
          REHEARSAL_DIAGNOSTICS_DIR: ${{ runner.temp }}/drill-diagnostics
          RESERVATION_PROVIDER_ROOT: ${{ runner.temp }}/reservation-provider/canonical
        run: |
          uv run --frozen exomem-cloud-rehearsal local-storage-drill --report "${RUNNER_TEMP}/local-storage-drill-report.json"
      - name: Summarize the report
        if: always()
        run: |
          report="${RUNNER_TEMP}/local-storage-drill-report.json"
          if test -f "$report"; then
            python3 infra/cloud-rehearsal/summarize.py "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report was written." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Upload the report and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-storage-drill-report
          path: |
            ${{ runner.temp }}/local-storage-drill-report.json
            ${{ runner.temp }}/drill-diagnostics
          if-no-files-found: error
          retention-days: 30
