name: gVisor overhead (diagnostic)

# Measures the Exomem Cloud cell image under runc and under runsc (gVisor) on one
# hosted runner, both arms in the same job and interleaved. A diagnostic branch
# workflow: it triggers only on a push to diag/gvisor-overhead, reads no secret
# and publishes nothing. The harness is scripts/gvisor_overhead/.
on:
  push:
    branches: [diag/gvisor-overhead]

permissions:
  contents: read

concurrency:
  group: gvisor-overhead
  cancel-in-progress: true

env:
  # A dated gVisor release; its sha512 is checked against the published checksum below.
  RUNSC_RELEASE: "20261026.0"
  # The image a cell runs in production (published, anonymous pull).
  CLOUD_IMAGE: ghcr.io/artexis10/exomem:0.154.0-cloud
  REPEATS: "1"
  SEED_NOTES: "200"

jobs:
  measure:
    name: runc and runsc on the Cloud cell image
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install gVisor runsc (pinned release, checksum verified)
        run: |
          set -euo pipefail
          base="https://storage.googleapis.com/gvisor/releases/release/${RUNSC_RELEASE}/x86_64"
          mkdir -p "$RUNNER_TEMP/runsc"
          cd "$RUNNER_TEMP/runsc"
          curl -fsSLO "$base/runsc"
          curl -fsSLO "$base/runsc.sha512"
          cat runsc.sha512
          sha512sum -c runsc.sha512
          chmod a+rx runsc
          sudo install -m 0755 runsc /usr/local/bin/runsc
          runsc --version
          # Systrap is the default platform in current releases; name it, and directfs, so the run records both.
          sudo runsc install --runtime=runsc -- --platform=systrap --directfs=true
          sudo systemctl restart docker
          cat /etc/docker/daemon.json
          docker info --format '{{json .Runtimes}}'
          docker run --rm --runtime=runsc hello-world

      - name: Pull the Cloud cell image
        run: |
          set -euo pipefail
          docker pull "$CLOUD_IMAGE"
          docker image inspect "$CLOUD_IMAGE" --format '{{.Id}} {{json .RepoDigests}} {{.Os}}/{{.Architecture}}'

      - name: Install harness dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet 'httpx>=0.28,<1'

      - name: Measure
        run: |
          mkdir -p "$RUNNER_TEMP/gv-out" "$RUNNER_TEMP/gv-work"
          umask 022
          "$RUNNER_TEMP/venv/bin/python" scripts/gvisor_overhead/run.py \
            --image "$CLOUD_IMAGE" --out "$RUNNER_TEMP/gv-out" --work "$RUNNER_TEMP/gv-work" \
            --repeats "$REPEATS" --seed-notes "$SEED_NOTES"

      - name: Per-case table
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/gv-out/results.jsonl" ]; then
            python3 scripts/gvisor_overhead/report.py "$RUNNER_TEMP/gv-out/results.jsonl" \
              --json-out "$RUNNER_TEMP/gv-out/summary.json" --md-out "$RUNNER_TEMP/gv-out/summary.md"
            { echo '### gVisor overhead'; cat "$RUNNER_TEMP/gv-out/summary.md"; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the result files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gvisor-overhead
          path: ${{ runner.temp }}/gv-out
          if-no-files-found: warn
