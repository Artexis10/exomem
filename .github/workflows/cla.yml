name: CLA

# Stores each signature on the `cla-signatures` branch through the REST API. The job never
# checks out pull-request code, so `pull_request_target` cannot run a fork's code with the
# write token. `cla-signatures` is not protected, because the action cannot write to a
# protected branch, and it must already hold `signatures/v1/cla.json` with
# `{"signedContributors": []}`: the action fails on a missing file instead of creating it.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  cla:
    name: cla
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      # The action is archived; v2.6.1 is pinned by commit SHA so the code cannot change.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/v1/cla.json
          path-to-document: https://github.com/substrate-systems/evermatter/blob/main/CLA.md
          branch: cla-signatures
          # The action's default locks every pull request that closes, merged or not.
          lock-pullrequest-aftermerge: false
          # Exact logins only: the action's wildcard match is an unanchored substring match.
          allowlist: Artexis10,exomem-release-bot[bot],dependabot[bot]
