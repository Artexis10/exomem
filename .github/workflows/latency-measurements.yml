# Latency measurements against the latest release, nightly and on demand.
# They do not gate a pull request or release evidence: the Full run in ci.yml
# does not wait for them. A regression is fixed forward on main. Dispatch this
# on a branch to measure that branch: its paired recall series compare it with
# its merge base on the default branch instead of the latest release.
name: Latency measurements

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

# The jobs run `gh release view` (scripts/recall_latency_gate.py) and local git only.
permissions:
  contents: read

concurrency:
  group: latency-measurements-${{ github.ref }}
  cancel-in-progress: false

jobs:
  retrieval-latency:
    name: retrieval latency (2k synthetic vault, shard ${{ matrix.shard }}/4)
    # Keep this benchmark on its calibrated Ubuntu 24.04 runtime.
    runs-on: ubuntu-24.04
    # Green CI took 9m38s; one case allows 15m. Let the remaining suite report
    # its result after that case while keeping every latency assertion unchanged.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: &setup-uv-inputs
          enable-cache: true
          # v10 no longer prunes by default; keep v5's small, pruned uv cache in the shared cache budget.
          prune-cache: true
      - &prepare-duration-snapshot
        name: Prepare isolated timing snapshot
        env:
          EXOMEM_DURATIONS_PATH: &duration-snapshot-path ${{ runner.temp }}/test-durations.json
        run: cp .test_durations.json "$EXOMEM_DURATIONS_PATH"
      - name: Per-lane latency ceiling gate (2000-note synthetic vault, model-free)
        env:
          EXOMEM_DURATIONS_PATH: *duration-snapshot-path
        # The anti-"hidden 14s" gate (tests/test_latency_gate.py): generates a
        # realistic densely-wikilinked 2000-note vault and asserts NO retrieval
        # lane exceeds its ceiling (graph rebuild → ~1.9s trips it). This job
        # OWNS the file: it runs in NEITHER PR tier (the partition check in
        # tests/test_ci_reliability_contract.py enforces that), so its evidence
        # comes from nightly/dispatch full runs, next to the golden quality gate.
        # Each case keeps its whole timing loop and function-scoped vault on an idle runner.
        run: >-
          uv run --frozen python -m pytest tests/test_latency_gate.py -q
          --splits=4 --group=${{ matrix.shard }} --splitting-algorithm=least_duration
          --durations-path="$EXOMEM_DURATIONS_PATH"
          ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '--store-durations --clean-durations' || '' }}
          --durations=20 --junitxml=test-results/retrieval-latency-${{ matrix.shard }}.xml
      - name: Upload latency timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-latency-shard-${{ matrix.shard }}-junit
          # Per-run diagnostics: nothing reads them after the run, so a week is enough.
          retention-days: 7
          path: test-results/retrieval-latency-${{ matrix.shard }}.xml
          if-no-files-found: warn
      - name: Upload refreshed test durations
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: test-durations-latency-shard-${{ matrix.shard }}
          path: *duration-snapshot-path

  recall-latency-series:
    name: recall latency paired series
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      series: ${{ steps.series.outputs.series }}
      shards: ${{ steps.series.outputs.shards }}
      shard_count: ${{ steps.series.outputs.shard_count }}
      base_tag: ${{ steps.series.outputs.base_tag }}
      base_commit: ${{ steps.series.outputs.base_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: *setup-uv-inputs
      - name: Verify the latency instrument once before fan-out
        env:
          UV_PYTHON: /usr/bin/python3
          UV_PYTHON_DOWNLOADS: never
        run: uv run --frozen --group recall-benchmark python -m pytest tests/test_recall_latency_gate.py tests/test_recall_timing.py tests/test_frame_stack.py -q
      - name: Read the series from the reference case file
        id: series
        # The case file defines the series; the paired matrix keeps no second list.
        # A branch's base is its merge base, so its comparison holds only the branch's own change.
        # That base has no tag, so the commit labels itself.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          default=$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name)
          if [ "$GITHUB_REF" = "refs/heads/$default" ]; then
            tag=$(gh release view --json tagName --jq .tagName)
            commit=$(git rev-parse --verify "refs/tags/$tag^{commit}")
          else
            commit=$(git merge-base HEAD "refs/remotes/origin/$default")
            tag=$commit
          fi
          echo "base_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "base_commit=$commit" >> "$GITHUB_OUTPUT"
          echo "series=$(jq -c '[.[].series] | unique' benchmarks/recall-latency/cases.json)" >> "$GITHUB_OUTPUT"
          echo "shard_count=$(jq -r .paired_shards benchmarks/recall-latency/profile.json)" >> "$GITHUB_OUTPUT"
          echo "shards=$(jq -c '.paired_shards as $n | [range(1; $n + 1)]' benchmarks/recall-latency/profile.json)" >> "$GITHUB_OUTPUT"

  recall-latency-paired:
    name: recall latency samples (${{ matrix.series }}, shard ${{ matrix.shard }})
    needs: [recall-latency-series]
    # Keep this benchmark on its calibrated Ubuntu 24.04 runtime.
    runs-on: ubuntu-24.04
    # Keep the established budget while measuring the new case-shard timings.
    timeout-minutes: &recall-paired-timeout 45
    strategy:
      fail-fast: false
      matrix:
        series: ${{ fromJSON(needs.recall-latency-series.outputs.series) }}
        shard: ${{ fromJSON(needs.recall-latency-series.outputs.shards) }}
    steps:
      - name: Record paired workload start
        run: date +%s > "$RUNNER_TEMP/recall-latency-job-start"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: *setup-uv-inputs
      - name: Resolve the served encoder digest
        id: recall-encoder
        env:
          UV_PYTHON: /usr/bin/python3
          UV_PYTHON_DOWNLOADS: never
        run: uv run --frozen --group recall-benchmark python scripts/recall_latency_gate.py --encoder-cache-key >> "$GITHUB_OUTPUT"
      - name: Cache the served encoder by digest
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: recall-encoder-${{ runner.os }}-${{ steps.recall-encoder.outputs.digest }}
      - name: Collect raw same-runner case pairs
        # Stop under the job budget so the elapsed record and evidence upload still run.
        timeout-minutes: 40
        env:
          GH_TOKEN: ${{ github.token }}
          SERIES: ${{ matrix.series }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.recall-latency-series.outputs.shard_count }}
          BASE_TAG: ${{ needs.recall-latency-series.outputs.base_tag }}
          BASE_COMMIT: ${{ needs.recall-latency-series.outputs.base_commit }}
          UV_PYTHON: /usr/bin/python3
          UV_PYTHON_DOWNLOADS: never
        run: >-
          uv run --frozen --group recall-benchmark python scripts/recall_latency_gate.py
          --paired --series "$SERIES" --base-tag "$BASE_TAG" --base-commit "$BASE_COMMIT"
          --shard "$SHARD" --shards "$SHARDS"
          --output "recall-latency-fragment-$SERIES-$SHARD.json"
      - name: Record elapsed paired workload
        if: always()
        env:
          JOB_TIMEOUT_MINUTES: *recall-paired-timeout
        run: python3 -c 'import json,os,pathlib,time; start=int((pathlib.Path(os.environ["RUNNER_TEMP"])/"recall-latency-job-start").read_text()); pathlib.Path("recall-latency-job-elapsed.json").write_text(json.dumps({"boundary":"first-step-to-pre-upload-timer","elapsed_seconds":time.time()-start,"job_budget_seconds":60*int(os.environ["JOB_TIMEOUT_MINUTES"])}))'
      - name: Upload paired recall evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recall-latency-raw-${{ matrix.series }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recall-latency-fragment-${{ matrix.series }}-${{ matrix.shard }}.json
            recall-latency-job-elapsed.json
          if-no-files-found: warn

  recall-latency-aggregate:
    name: recall latency paired (${{ matrix.series }})
    if: ${{ !cancelled() && needs.recall-latency-series.result == 'success' }}
    needs: [recall-latency-series, recall-latency-paired]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        series: ${{ fromJSON(needs.recall-latency-series.outputs.series) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: *setup-uv-inputs
      - name: Download raw attempts into separate artifact directories
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: recall-latency-raw-${{ matrix.series }}-*-${{ github.run_id }}-*
          path: paired-fragments
          merge-multiple: false
      - name: Validate complete provenance and compare the series once
        if: ${{ !cancelled() }}
        env:
          SERIES: ${{ matrix.series }}
          BASE_TAG: ${{ needs.recall-latency-series.outputs.base_tag }}
          BASE_COMMIT: ${{ needs.recall-latency-series.outputs.base_commit }}
          PRODUCER_OUTCOME: ${{ needs.recall-latency-paired.result }}
          UV_PYTHON: /usr/bin/python3
          UV_PYTHON_DOWNLOADS: never
        run: >-
          uv run --frozen --group recall-benchmark python scripts/recall_latency_gate.py
          --aggregate-paired paired-fragments --series "$SERIES"
          --base-tag "$BASE_TAG" --base-commit "$BASE_COMMIT"
          --producer-outcome "$PRODUCER_OUTCOME"
          --output "recall-latency-paired-$SERIES.json"
      - name: Retain the complete verdict and its original raw provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recall-latency-paired-${{ matrix.series }}
          # The current verdict can change on retry; its raw producer attempts stay immutable.
          overwrite: true
          path: |
            recall-latency-paired-${{ matrix.series }}.json
            paired-fragments/
          if-no-files-found: warn

  governance-projection-wire:
    name: governance projected wire characterization (${{ matrix.route }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        route: [keyword, bm25, vector-hard-off, rerank-hard-off, clip-hard-off, graph, graph-rerank-hard-off, max-query, max-limit, max-shape, hidden-index-missing, pagination]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: *setup-uv-inputs
      - name: Verify lockfile is current
        run: uv lock --check
      - name: Characterize exact-capacity hidden-corpus actual-wire routes
        env:
          EXOMEM_GOVERNANCE_TIMING_ROUTE: ${{ matrix.route }}
          EXOMEM_DISABLE_EMBEDDINGS: "1"
          EXOMEM_DISABLE_MEDIA_EXTRACTION: "1"
          EXOMEM_DISABLE_CLIP: "1"
          EXOMEM_DISABLE_RANKING: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          uv run --frozen --python 3.13 python -m pytest -q
          tests/test_governance_projection_wire_gate.py
          --session-timeout=360

  governance-projection-wire-vector-cpu:
    name: governance projected vector CPU wire (${{ matrix.route }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        route: [keyword, bm25, vector-live, rerank-hard-off, clip-hard-off, graph, graph-rerank-hard-off, max-query, max-limit, max-shape, hidden-index-missing, pagination]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: *setup-uv-inputs
      - name: Cache the certified BGE vector model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-base-en-v1.5-vector-cpu-v1
      - name: Verify lockfile is current
        run: uv lock --check
      - name: Certify exact-capacity hidden-corpus vector CPU routes
        env:
          EXOMEM_GOVERNANCE_TIMING_PROFILE: vectors-cpu-torch-v1
          # The profile certifies the English torch model its timing budget was set on.
          EXOMEM_RECALL_MODEL: BAAI/bge-base-en-v1.5
          EXOMEM_GOVERNANCE_TIMING_ROUTE: ${{ matrix.route }}
          EXOMEM_DISABLE_MEDIA_EXTRACTION: "1"
          EXOMEM_DISABLE_CLIP: "1"
          EXOMEM_DISABLE_RANKING: "1"
          EXOMEM_DEVICE: cpu
          EXOMEM_EMBED_BACKEND: torch
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          uv run --frozen --extra embeddings --python 3.13 python -m pytest -q
          tests/test_governance_projection_wire_gate.py
          --session-timeout=600
