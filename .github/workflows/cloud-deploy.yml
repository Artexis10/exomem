name: cloud-deploy

# automate-cloud-releases D1: after a release, set its attested cell image as
# Substrate's cell_image, when the platform carries the release and no upgrade
# barrier stops it, then wait until the canary runs it. When either check stops
# the newest release, it sets the newest older release that the fleet lacks and the
# platform carries (deploy-newest-covered-release), and the newest release's alert
# stays active. The logic and its tests are in infra/scripts/cloud_deploy.py and
# tests/test_cloud_deploy.py.
#
# - It runs on a dispatch on main. The release workflow's tag run ends with that
#   dispatch, and so does the platform upgrade. A workflow_run trigger never
#   fired: the tag run starts from a github.token dispatch, and such a run's
#   completion starts no other workflow (v0.172.0-v0.174.0 started none).
# - It also runs once a day. A daily run re-reports the active alerts (a release that
#   waits on a platform upgrade, a fleet that has missed a release for too long, a
#   pinned cell, a failing run) even when no release lands, and retries a rollout that
#   a missed dispatch left behind. With the fleet current it resolves the alerts and
#   ends CELL_IMAGE_CURRENT.
# - The `cloud-deploy` environment holds EXOMEM_DEPLOY_TOKEN and the alert
#   capability, and admits only main (docs/runbooks/cloud-platform-deploy.md).
#   Without the token, the run does nothing and succeeds.
# - It holds no cluster credential and calls Substrate over HTTPS only. The log
#   is public, so the script prints only codes and counts.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'

permissions:
  contents: read
  deployments: read
  attestations: read
  packages: read

# One run at a time. GitHub replaces a pending run with a newer one, and each run
# reads the newest release, so the collapse loses nothing.
concurrency:
  group: cloud-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Set the release's cell image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: cloud-deploy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # The platform gate diffs the platform's release tag against this one.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Install the registry lookup's one dependency
        # The version uv.lock pins.
        run: python3 -m pip install --user packaging==26.2
      - name: Set the cell image and wait for the canary
        env:
          GH_TOKEN: ${{ github.token }}
          EXOMEM_DEPLOY_TOKEN: ${{ secrets.EXOMEM_DEPLOY_TOKEN }}
          EXOMEM_CLOUD_DEPLOY_ALERT_URL: ${{ secrets.EXOMEM_CLOUD_DEPLOY_ALERT_URL }}
          EXOMEM_SUBSTRATE_URL: ${{ vars.EXOMEM_SUBSTRATE_URL }}
          CLOUD_DEPLOY_POLL_INTERVAL_SECONDS: ${{ vars.CLOUD_DEPLOY_POLL_INTERVAL_SECONDS }}
          CLOUD_DEPLOY_POLL_TIMEOUT_SECONDS: ${{ vars.CLOUD_DEPLOY_POLL_TIMEOUT_SECONDS }}
          CLOUD_DEPLOY_RELEASE_BEHIND_HOURS: ${{ vars.CLOUD_DEPLOY_RELEASE_BEHIND_HOURS }}
        run: python3 infra/scripts/cloud_deploy.py
