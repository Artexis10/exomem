name: frozen stance verifier

on:
  push:
    paths:
      - src/exomem/claims.py
      - src/exomem/sensing.py
      - src/exomem/sensing_nli.py
      - src/exomem/sensing_ledger.py
      - src/exomem/sensed_model.py
      - src/exomem/sensor_worker.py
      - src/exomem/sensor_worker_child.py
      - src/exomem/audit.py
      - scripts/prove-sensing-transport.py
      - tests/test_audit_contradiction_order.py
      - tests/test_sensing_real_pin.py
      - tests/test_frozen_verifier_real.py
      - tests/test_frozen_verifiers.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/frozen-verifier.yml
  pull_request:
    paths:
      - src/exomem/claims.py
      - src/exomem/sensing.py
      - src/exomem/sensing_nli.py
      - src/exomem/sensing_ledger.py
      - src/exomem/sensed_model.py
      - src/exomem/sensor_worker.py
      - src/exomem/sensor_worker_child.py
      - src/exomem/audit.py
      - scripts/prove-sensing-transport.py
      - tests/test_audit_contradiction_order.py
      - tests/test_sensing_real_pin.py
      - tests/test_frozen_verifier_real.py
      - tests/test_frozen_verifiers.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/frozen-verifier.yml
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Independent main runs must not cancel the verifier called by full CI.
  group: frozen-verifier-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-multilingual-pin:
    name: exact multilingual pin
    # Base-controlled release validation permits only version changes; full CI proves the base.
    if: ${{ github.head_ref != 'release-please--branches--main' && !(github.event_name == 'push' && github.ref == 'refs/heads/release-please--branches--main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HOME: /tmp/exomem-frozen-verifier-hf
      EXOMEM_DISABLE_EMBEDDINGS: "1"
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Verify lockfile
        run: uv lock --check
      - name: Cache exact model revision
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}/hub
          key: >-
            frozen-stance-linux-b5113eb38ab63efdd7f280f8c144ea8b13f978ce
      - name: Download and verify the declared artifact manifest
        run: |
          uv run --frozen --extra nli python - <<'PY'
          from pathlib import Path

          from huggingface_hub import snapshot_download

          from exomem import claims

          pin = claims.VERIFIER_PINS[0]
          downloaded = Path(
              snapshot_download(
                  repo_id=pin.model_name,
                  revision=pin.model_revision,
                  allow_patterns=list(pin.artifact_files),
              )
          )
          digest, resident = claims._hash_resident_snapshot(pin)
          assert downloaded == Path(resident), (downloaded, resident)
          assert digest == pin.weights_sha256, (digest, pin.weights_sha256)
          print(f"verified {pin.model_name}@{pin.model_revision}: {digest}")
          PY
      - name: Exercise production admission against the exact local bytes
        env:
          EXOMEM_CLAIM_POLARITY_NLI: "1"
          EXOMEM_RUN_REAL_NLI: "1"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          EXOMEM_TEST_NLI_ADMISSION_OUTPUT: ${{ runner.temp }}/sensing-admission.json
        run: >-
          uv run --frozen --extra nli python -m pytest
          tests/test_frozen_verifier_real.py tests/test_sensing_real_pin.py -q -vv -s

      - name: Prove installed worker, ledger and audit transport
        run: |
          proof_root="$RUNNER_TEMP/sensing-transport"
          proof_dist=$(mktemp -d "$RUNNER_TEMP/sensing-wheel.XXXXXX")
          proof_python="$PWD/.venv/bin/python"
          proof_memory_bytes=$((5 * 1024 * 1024 * 1024))
          mkdir -p "$proof_root"
          uv build --wheel --out-dir "$proof_dist"
          uv pip install --python "$proof_python" --no-deps --reinstall "$proof_dist"/*.whl
          # The fresh hosted VM owns this service. The proof runs as the runner user.
          sudo -n systemd-run --wait --pipe --collect \
            --unit="sensing-transport-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --property="User=$(id -u)" --property="Group=$(id -g)" \
            --property="MemoryMax=$proof_memory_bytes" --property=MemorySwapMax=0 \
            --property=RuntimeMaxSec=300 --property=TimeoutStopSec=5 \
            --property=CPUQuota=100% --working-directory="$proof_root" \
            "$proof_python" "$PWD/scripts/prove-sensing-transport.py" \
            --root "$proof_root" --wheel "$proof_dist"/*.whl \
            --source-cache "$HF_HOME/hub" \
            --audit-helper "$PWD/tests/test_audit_contradiction_order.py" \
            --admission-evidence "$RUNNER_TEMP/sensing-admission.json" \
            --memory-limit-bytes "$proof_memory_bytes"

      - name: Retain installed transport results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sensing-transport-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sensing-transport/installed-proof-results.json
            ${{ runner.temp }}/sensing-admission.json
          if-no-files-found: warn
