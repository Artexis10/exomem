name: Kata Containers overhead (diagnostic)

# Measures the Exomem Cloud cell image under runc and under Kata Containers on one
# hosted runner, both arms in the same job and interleaved. A diagnostic branch
# workflow: it triggers only on a push to diag/kata-overhead, reads no secret and
# publishes nothing. The harness is scripts/kata_overhead/.
on:
  push:
    branches: [diag/kata-overhead]

permissions:
  contents: read

concurrency:
  group: kata-overhead
  cancel-in-progress: true

env:
  # A dated Kata release. The Go runtime package is the one the Kata documentation names for Docker
  # (Docker supports the Go runtime with QEMU only). The sha256 is the digest GitHub publishes for the
  # release asset; the install step checks the download against it and against the API at run time.
  KATA_RELEASE: "4.3.1"
  KATA_SHA256: "66b35b06f6b41b56f8606ddf3ed3e5660b0971d1e309d903457c4056a0b9eff0"
  KATA_ASSET: "kata-go-static-4.3.1-amd64.tar.zst"
  # The image a cell runs in production (published, anonymous pull).
  CLOUD_IMAGE: ghcr.io/artexis10/exomem:0.154.0-cloud
  REPEATS: "1"
  SEED_NOTES: "200"
  # "--compat-only" probes the runtimes and stops; empty runs the whole measurement.
  EXTRA_ARGS: ""
  # "measure" times runc against Kata; "trace" records the syscalls of the runc cell with strace.
  PHASES: "measure"
  # kata-blk: the shipped QEMU configuration (plus the block-device key). kata-blk-tuned: the same arm with the
  # configuration built below from the shipped file of KATA_HYPERVISOR plus KATA_CONFIG_EDITS.
  ARMS: "runc,kata-blk,kata-blk-tuned"
  # The tuning round: qemu or clh, and the "key = value" lines that replace the shipped values (one per line).
  KATA_HYPERVISOR: "clh"
  KATA_CONFIG_EDITS: ""
  # "1" also boots a cell with and without psi=1 on the guest kernel command line and prints the PSI files.
  PSI_PROBE: "0"

jobs:
  measure:
    name: runc and Kata on the Cloud cell image
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Kata Containers (pinned release, checksum verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l /dev/kvm
          base="https://github.com/kata-containers/kata-containers/releases/download/${KATA_RELEASE}"
          mkdir -p "$RUNNER_TEMP/kata"
          cd "$RUNNER_TEMP/kata"
          curl -fsSLO "$base/$KATA_ASSET"
          echo "${KATA_SHA256}  ${KATA_ASSET}" | sha256sum -c -
          published="$(gh api "repos/kata-containers/kata-containers/releases/tags/${KATA_RELEASE}" \
            --jq ".assets[] | select(.name == \"${KATA_ASSET}\") | .digest")"
          echo "published digest: $published"
          test "$published" = "sha256:${KATA_SHA256}"
          command -v zstd >/dev/null || sudo apt-get install -y --no-install-recommends zstd
          tar --zstd -xf "$KATA_ASSET"
          sudo mv opt/kata /opt/kata
          dir=/opt/kata/share/defaults/kata-containers
          mkdir -p "$RUNNER_TEMP/shipped"
          cp "$dir/configuration-qemu.toml" "$dir/configuration-${KATA_HYPERVISOR}.toml" "$RUNNER_TEMP/shipped/"
          # The block-volume arm needs the runtime to hot-plug a host block device; the shipped default switches
          # that off. The key does nothing for a mount that is not a block device.
          sudo sed -i -E 's/^disable_block_device_use *= *true/disable_block_device_use = false/' "$dir/configuration-qemu.toml"
          diff "$RUNNER_TEMP/shipped/configuration-qemu.toml" "$dir/configuration-qemu.toml" || true
          # The tuned arm: the hypervisor's shipped configuration, the same block key, then the edits. A key that
          # is not in the file stops the job, so a misspelt key cannot pass as a measured variant.
          edit_config() {
            local file="$1" line key value
            while IFS= read -r line; do
              [ -n "${line// }" ] || continue
              key="${line%%=*}"; key="${key// }"; value="${line#*=}"; value="${value# }"
              grep -qE "^${key}[[:space:]]*=" "$file" || { echo "config key not found in $file: $key"; return 1; }
              sudo sed -i -E "s|^${key}[[:space:]]*=.*|${key} = ${value}|" "$file"
            done
          }
          sudo cp "$dir/configuration-${KATA_HYPERVISOR}.toml" "$dir/configuration-tuned.toml"
          edit_config "$dir/configuration-tuned.toml" <<< "disable_block_device_use = false"
          edit_config "$dir/configuration-tuned.toml" <<< "$KATA_CONFIG_EDITS"
          echo "--- tuned against the shipped ${KATA_HYPERVISOR} configuration"
          diff "$RUNNER_TEMP/shipped/configuration-${KATA_HYPERVISOR}.toml" "$dir/configuration-tuned.toml" || true
          ls -l /opt/kata/bin
          /opt/kata/bin/kata-runtime --version
          /opt/kata/bin/containerd-shim-kata-v2 --version || true
          # Docker runs Kata through its containerd shim: register the shim as a runtime.
          sudo mkdir -p /etc/docker
          if [ -s /etc/docker/daemon.json ]; then cat /etc/docker/daemon.json; fi
          sudo python3 - <<'PY'
          import json, os
          path = "/etc/docker/daemon.json"
          config = json.load(open(path)) if os.path.exists(path) and os.path.getsize(path) else {}
          config.setdefault("runtimes", {})["kata"] = {"runtimeType": "/opt/kata/bin/containerd-shim-kata-v2"}
          json.dump(config, open(path, "w"), indent=2)
          PY
          cat /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}'

      - name: Pull the Cloud cell image
        run: |
          set -euo pipefail
          docker pull "$CLOUD_IMAGE"
          docker image inspect "$CLOUD_IMAGE" --format '{{.Id}} {{json .RepoDigests}} {{.Os}}/{{.Architecture}}'

      - name: Kata smoke test (a VM boots and runs the image)
        run: |
          set -euo pipefail
          docker run --rm --runtime kata --entrypoint uname "$CLOUD_IMAGE" -a
          uname -a

      - name: Install harness dependencies
        run: |
          command -v strace >/dev/null || sudo apt-get install -y --no-install-recommends strace
          strace --version | sed -n 1p
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet 'httpx>=0.28,<1'

      - name: Guest PSI probe (memory.pressure with and without psi=1)
        if: env.PSI_PROBE == '1'
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/kv-out/diagnostics"
          out="$RUNNER_TEMP/kv-out/diagnostics/psi_probe.txt"
          dir=/opt/kata/share/defaults/kata-containers
          probe() {
            echo "=== $1"
            docker run --rm --runtime kata --cpus 2 --memory 3g -e EXOMEM_CLOUD_CELL=1 --entrypoint sh "$CLOUD_IMAGE" -c '
              echo "cmdline: $(cat /proc/cmdline)"
              echo "--- /proc/pressure"; ls -l /proc/pressure 2>&1; cat /proc/pressure/memory 2>&1
              echo "--- cgroup files"; ls /sys/fs/cgroup | grep -i pressure; cat /sys/fs/cgroup/memory.pressure 2>&1
              echo "--- the cell brake"; python -c "from exomem import media_brakes; print(media_brakes.read_cell())" 2>&1' 2>&1
          }
          {
            echo "guest kernel PSI config:"; grep -E 'CONFIG_PSI' /opt/kata/share/kata-containers/config-6.18.56-208
            sudo ln -sfn configuration-qemu.toml "$dir/configuration.toml"
            probe "shipped kernel_params"
            sudo cp "$dir/configuration-qemu.toml" "$RUNNER_TEMP/configuration-qemu.before-psi.toml"
            trap 'sudo cp "$RUNNER_TEMP/configuration-qemu.before-psi.toml" "$dir/configuration-qemu.toml"' EXIT
            sudo sed -i -E 's/^(kernel_params *= *"[^"]*)"/\1 psi=1"/' "$dir/configuration-qemu.toml"
            grep -E '^kernel_params' "$dir/configuration-qemu.toml"
            probe "kernel_params with psi=1"
          } 2>&1 | tee "$out"

      - name: Measure
        run: |
          mkdir -p "$RUNNER_TEMP/kv-out" "$RUNNER_TEMP/kv-work"
          umask 022
          "$RUNNER_TEMP/venv/bin/python" scripts/kata_overhead/run.py \
            --image "$CLOUD_IMAGE" --out "$RUNNER_TEMP/kv-out" --work "$RUNNER_TEMP/kv-work" \
            --repeats "$REPEATS" --seed-notes "$SEED_NOTES" --phases "$PHASES" --arms "$ARMS" \
            ${EXTRA_ARGS:+"$EXTRA_ARGS"}

      - name: Keep the Kata configuration that ran
        if: always()
        run: |
          dir=/opt/kata/share/defaults/kata-containers
          mkdir -p "$RUNNER_TEMP/kv-out/kata-config"
          cp "$dir/configuration-tuned.toml" "$dir/configuration-qemu.toml" "$RUNNER_TEMP/kv-out/kata-config/"
          diff "$RUNNER_TEMP/shipped/configuration-${KATA_HYPERVISOR}.toml" "$dir/configuration-tuned.toml" \
            > "$RUNNER_TEMP/kv-out/kata-config/tuned-against-shipped.diff" || true
          diff "$RUNNER_TEMP/shipped/configuration-qemu.toml" "$dir/configuration-qemu.toml" \
            > "$RUNNER_TEMP/kv-out/kata-config/default-arm-against-shipped.diff" || true

      - name: Per-case table
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/kv-out/results.jsonl" ]; then
            python3 scripts/kata_overhead/report.py "$RUNNER_TEMP/kv-out/results.jsonl" \
              --json-out "$RUNNER_TEMP/kv-out/summary.json" --md-out "$RUNNER_TEMP/kv-out/summary.md"
            { echo '### Kata overhead'; cat "$RUNNER_TEMP/kv-out/summary.md"; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the result files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kata-overhead
          path: ${{ runner.temp }}/kv-out
          if-no-files-found: warn
