name: Cloud cellctl

on:
  pull_request:
    paths:
      - "infra/cellctl/**"
      - "infra/helm/platform/**"
      - "infra/tool-versions.env"
      - "infra/ansible/roles/k3s/files/audit-policy.yaml"
      - "src/exomem/cloud_import*.py"
      - "src/exomem/cloud_export.py"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/cloud-cellctl.yml"
      - ".github/actions/substrate-test-contract/**"
  push:
    branches: [main]
    paths:
      - "infra/cellctl/**"
      - "infra/helm/platform/**"
      - "infra/tool-versions.env"
      - "infra/ansible/roles/k3s/files/audit-policy.yaml"
      - "src/exomem/cloud_import*.py"
      - "src/exomem/cloud_export.py"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/cloud-cellctl.yml"
      - ".github/actions/substrate-test-contract/**"
  # A manual run also replays the live K3s suite (live-k3s below).
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: cloud-cellctl-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: cellctl tests, pinned ruff and platform chart
    # Base-controlled release validation permits only version changes; full CI proves the base.
    if: &not-release-pr ${{ github.head_ref != 'release-please--branches--main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/substrate-test-contract
      - name: Load the pinned tool versions
        run: grep -E '^[A-Z0-9_]+=' infra/tool-versions.env >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install the pinned Helm release binary
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/helm.tar.gz \
            "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_LINUX_AMD64_SHA256}  /tmp/helm.tar.gz" | sha256sum --check
          tar --extract --gzip --file /tmp/helm.tar.gz --directory /tmp linux-amd64/helm
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          test "$(helm version --template '{{.Version}}')" = "v${HELM_VERSION}"
      - name: Install the PostgreSQL 16 server binaries the fixture runs
        # Bounded and retried by the helper; the step cap is the backstop
        # (see tests/test_ci_apt_install.py).
        timeout-minutes: 9
        run: |
          scripts/ci-apt-install.sh postgresql-16
          test -x /usr/lib/postgresql/16/bin/postgres
          echo "CELLCTL_PG_BIN=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"
      # The chart tests render infra/helm/platform, which needs the dependency
      # archives the chart step builds, so they run after it.
      # `uv run --frozen` never rewrites the lockfile; this is what still
      # fails the job when infra/cellctl/uv.lock drifts from pyproject.toml.
      - name: Check the cellctl lockfile
        working-directory: infra/cellctl
        run: uv lock --check
      # The rehearsal takes cellctl by path, so a cellctl dependency change
      # leaves its lockfile stale; its own workflows do not run on cellctl.
      - name: Check the cloud rehearsal lockfile
        working-directory: infra/cloud-rehearsal
        run: uv lock --check
      - name: Pinned ruff
        working-directory: infra/cellctl
        run: uvx --from "ruff==${RUFF_VERSION}" ruff check src tests
      - name: Platform chart dependency build, lint and template
        run: |
          helm repo add hcloud https://charts.hetzner.cloud
          helm repo add traefik https://traefik.github.io/charts
          helm repo add jetstack https://charts.jetstack.io
          helm repo add topolvm https://topolvm.github.io/topolvm
          helm dependency build infra/helm/platform
          helm lint infra/helm/platform --strict \
            --namespace exomem-platform \
            --values infra/helm/platform/values.validation.yaml
          helm template exomem-platform infra/helm/platform \
            --namespace exomem-platform \
            --values infra/helm/platform/values.validation.yaml \
            --include-crds > /dev/null
      # The partition check collects live edge cases, which read the vendored chart archives.
      - name: Fast suite
        working-directory: infra/cellctl
        run: |
          uv run --frozen python -m pytest -q -p no:cacheprovider \
            --ignore=tests/test_k3s_integration.py \
            --ignore=tests/test_platform_chart_headers.py
      # A skip (no helm on PATH) must fail the job, never pass it quietly.
      - name: Platform chart tests
        working-directory: infra/cellctl
        shell: bash
        run: |
          uv run --frozen python -m pytest -q -rs -p no:cacheprovider \
            tests/test_platform_chart_headers.py \
            | tee "${RUNNER_TEMP}/chart-tests.txt"
          if grep -q '^SKIPPED \[' "${RUNNER_TEMP}/chart-tests.txt"; then
            echo "::error::a platform chart test was skipped"
            exit 1
          fi

  # The chart tests pin the admission and network policies' text, not their
  # logic: only the live suite proves a rule denies what it should
  # (harden-exomem-cloud-operator-access 2.7). So a pull request touching
  # those templates, or the live suite itself, runs it too. values.yaml is
  # left out on purpose: release bumps touch it.
  live-k3s-scope:
    name: Does this change reach the live K3s policy scenarios
    if: *not-release-pr
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Match the pull request's changed files
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          # Every file whose change can alter what the live suite proves:
          # all platform templates (including cellctl's scope policy), the
          # values schema and validation values, the vendored subcharts, the
          # cell manifest renderer, the node audit policy it mounts, and the
          # live suite, import commands, image inputs and this workflow. values.yaml
          # is left out because release bumps touch it; chart tests pin the
          # invariants it carries. Git quotes a path with special or
          # non-ASCII characters, hence the optional leading quote.
          LIVE_K3S_PATTERN: '^"?(infra/helm/platform/(templates/|values\.schema\.json$|values\.validation\.yaml$|Chart\.(yaml|lock)$)|infra/cellctl/src/cellctl/manifests\.py$|infra/cellctl/src/cellctl/k8s_client\.py$|infra/ansible/roles/k3s/files/audit-policy\.yaml$|infra/cellctl/tests/test_k3s_integration\.py$|infra/cellctl/tests/test_export_storage\.py$|infra/cellctl/src/cellctl/exports\.py$|src/exomem/cloud_(import[^/]*|export)\.py$|Dockerfile$|pyproject\.toml$|uv\.lock$|\.github/workflows/cloud-cellctl\.yml$)'
        run: |
          case "$EVENT" in
            # Reusable workflows retain the full-CI caller's scheduled event.
            workflow_dispatch|schedule) run=true ;;
            pull_request)
              # No rename detection, so a renamed template still shows its
              # old path. A diff that cannot be computed runs the suite. The
              # match reads a here-string, not a pipe: grep -q exiting early
              # would SIGPIPE the writer and, under pipefail, read as no match.
              if ! changed=$(git diff --name-only --no-renames "$BASE...$HEAD"); then
                run=true
              elif grep -Eq "$LIVE_K3S_PATTERN" <<< "$changed"; then
                run=true
              else
                run=false
              fi
              ;;
            *) run=false ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "live K3s suite runs: $run"

  # Separate runners keep each group's cluster policies and storage isolated.
  # The complementary selectors run every case once; only imports need the source image.
  live-k3s:
    name: Live K3s integration suite (${{ matrix.suite }}, shard ${{ matrix.shard }}/${{ matrix.shards }})
    if: needs.live-k3s-scope.outputs.run == 'true'
    # The live runners build their own dependencies; the workflow still requires checks to pass.
    needs: [live-k3s-scope]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Measured durations: https://github.com/Artexis10/exomem/actions/runs/40294036858.
        include:
          - suite: protected-import
            shard: 1
            shards: 4
          - suite: protected-import
            shard: 2
            shards: 4
          - suite: protected-import
            shard: 3
            shards: 4
          - suite: protected-import
            shard: 4
            shards: 4
          - suite: platform
            shard: 1
            shards: 2
          - suite: platform
            shard: 2
            shards: 2
            # One shorter runner owns S3 setup and the unsharded transport suite.
            export_transport: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/substrate-test-contract
      - name: Load the pinned tool versions
        run: grep -E '^[A-Z0-9_]+=' infra/tool-versions.env >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Install the pinned Helm release binary
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/helm.tar.gz \
            "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_LINUX_AMD64_SHA256}  /tmp/helm.tar.gz" | sha256sum --check
          tar --extract --gzip --file /tmp/helm.tar.gz --directory /tmp linux-amd64/helm
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          test "$(helm version --template '{{.Version}}')" = "v${HELM_VERSION}"
      - name: Install the PostgreSQL 16 server binaries the fixture runs
        # Bounded and retried by the helper; the step cap is the backstop
        # (see tests/test_ci_apt_install.py).
        timeout-minutes: 9
        run: |
          scripts/ci-apt-install.sh postgresql-16
          test -x /usr/lib/postgresql/16/bin/postgres
          echo "CELLCTL_PG_BIN=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"
      - name: Build the platform chart dependencies the suite renders
        run: |
          helm repo add hcloud https://charts.hetzner.cloud
          helm repo add traefik https://traefik.github.io/charts
          helm repo add jetstack https://charts.jetstack.io
          helm repo add topolvm https://topolvm.github.io/topolvm
          helm dependency build infra/helm/platform
      - name: Read the source image build metadata
        if: matrix.suite == 'protected-import'
        id: import-meta
        run: |
          build_time=$(git show -s --format=%cI HEAD)
          echo "build_time=$(date -u -d "$build_time" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build the source Cloud image for encrypted import
        if: matrix.suite == 'protected-import'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        timeout-minutes: 25
        with:
          context: .
          target: cloud
          load: true
          push: false
          tags: cellctl-import-source:ci-${{ github.sha }}
          build-args: |
            EXOMEM_RELEASE_BUILD_TIME=${{ steps.import-meta.outputs.build_time }}
          cache-from: type=gha,scope=cloud-k3s
          cache-to: type=gha,mode=max,scope=cloud-k3s
      # The export transport tests need a real S3 store with encryption at
      # rest; this MinIO uses the live suite's pinned image and a KMS key.
      - name: Start the MinIO for the export transport tests
        if: matrix.export_transport == true
        working-directory: infra/cellctl
        shell: bash
        run: |
          image="$(uv run --frozen python -c 'from tests.test_k3s_integration import MINIO_IMAGE; print(MINIO_IMAGE)')"
          docker run --detach --name export-storage --publish 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=export-proof -e MINIO_ROOT_PASSWORD=export-proof-secret \
            -e "MINIO_KMS_SECRET_KEY=export-proof:$(head -c 32 /dev/urandom | base64)" \
            "$image" server /data --address :9000
          timeout 60 bash -c 'until curl --silent --fail http://127.0.0.1:9000/minio/health/live; do sleep 1; done'
      # A skip (no Docker, a missing variable) must fail the job, never pass it.
      - name: Live K3s suite
        working-directory: infra/cellctl
        shell: bash
        env:
          RUN_CELLCTL_K3S_TEST: "1"
          CELLCTL_K3S_IMPORT_IMAGE: ${{ matrix.suite == 'protected-import' && format('cellctl-import-source:ci-{0}', github.sha) || '' }}
          PYTHONUNBUFFERED: "1"
          SUITE_GROUP: ${{ matrix.suite }}
          SUITE_SHARD: ${{ matrix.shard }}
          SUITE_SHARDS: ${{ matrix.shards }}
          # These fixed test identities partition the existing suite, including all their parameters.
          # Both run the product's own commands from the source-built image, so both belong to the
          # protected-import group; the platform group runs every other case.
          IMPORT_TEST: test_protected_import_waits_for_real_cleanup_pod_gc
          EXPORT_TEST: test_owner_export_packs_the_real_volume_and_serves_one_verified_archive
        run: |
          selection="$IMPORT_TEST or $EXPORT_TEST"
          if test "$SUITE_GROUP" = platform; then
            selection="not ($selection)"
          fi
          HELM_BIN="$(command -v helm)" \
          uv run --frozen python -m pytest -q -s -rs -p no:cacheprovider \
            --junitxml="${RUNNER_TEMP}/live-k3s.xml" \
            --splits="$SUITE_SHARDS" --group="$SUITE_SHARD" \
            --splitting-algorithm=least_duration --durations-path=.test_durations.json \
            -k "$selection" tests/test_k3s_integration.py \
            | tee "${RUNNER_TEMP}/live-k3s.txt"
          if grep -q '^SKIPPED \[' "${RUNNER_TEMP}/live-k3s.txt"; then
            echo "::error::the live K3s suite was skipped"
            exit 1
          fi
      # C6's transport tests read a real S3 store, not the cluster, so one group runs them.
      # A skip (no store) must fail the job here too.
      - name: Export transport suite
        if: matrix.export_transport == true
        working-directory: infra/cellctl
        shell: bash
        env:
          CELLCTL_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          CELLCTL_TEST_S3_ACCESS_KEY: export-proof
          CELLCTL_TEST_S3_SECRET_KEY: export-proof-secret
          PYTHONUNBUFFERED: "1"
        run: |
          uv run --frozen python -m pytest -q -s -rs -p no:cacheprovider tests/test_export_storage.py \
            | tee "${RUNNER_TEMP}/export-storage.txt"
          if grep -q '^SKIPPED \[' "${RUNNER_TEMP}/export-storage.txt"; then
            echo "::error::the export transport suite was skipped"
            exit 1
          fi
      - name: Upload live K3s evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-k3s-${{ matrix.suite }}-${{ matrix.shard }}-junit
          path: ${{ runner.temp }}/live-k3s.xml
          if-no-files-found: warn
