name: PR title

# pull_request, not pull_request_target: GitHub blocks pull_request_target in public
# repositories by default from 2026-12-02, and this check needs no secrets.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  conventional-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      # Run the base revision's checker, so a pull request cannot weaken the checker
      # that judges its own title. A change to this workflow file shows in review.
      - name: Check out trusted base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Validate pull-request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python scripts/check_pr_title.py "$PR_TITLE"
