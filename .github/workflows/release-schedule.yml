name: release schedule

# Starts a release cut on a schedule, so no session waits on a release. It never starts one
# while a controller run is unfinished, resumes an open cut that no run is working on, and
# otherwise cuts from the newest main commit with reusable Full evidence (pick-source) when a
# change since the last release would appear in its changelog.
# The cut controller does the rest: proposal, qualification, merge, tag and publication.
# The repository variable RELEASE_SCHEDULE set to `off` stops scheduled cuts.

on:
  schedule:
    # Four times a day; main's Full evidence is at most FULL_EVIDENCE_HOURS old (merge-queue.yml).
    - cron: "20 4,10,16,22 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: release-schedule
  cancel-in-progress: false

jobs:
  cut:
    if: ${{ vars.RELEASE_SCHEDULE != 'off' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      # The decision reads commits with release-please's own parser; the same pin as the cut controller.
      - name: Install the pinned release-please parser
        run: npm install --prefix "$RUNNER_TEMP/release-please" --ignore-scripts --no-audit --no-fund release-please@17.6.0
      - name: Decide whether to cut, and from which source
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NODE_PATH: ${{ runner.temp }}/release-please/node_modules
        run: |
          set -euo pipefail
          decision=$(python3 scripts/release_cuts.py schedule)
          echo "$decision" | jq .
          {
            echo "### Release schedule"
            echo
            echo "$decision" | jq -r '"- cut: \(.cut)\n- resume: \(.resume // false)\n- reason: \(.reason)\n- source: \(.source // "none")\n- evidence run: \(.evidence_run // "none")"'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "cut=$(jq -r .cut <<<"$decision")" >> "$GITHUB_OUTPUT"
          echo "source=$(jq -r '.source // ""' <<<"$decision")" >> "$GITHUB_OUTPUT"
      - name: Start the cut controller
        if: steps.decide.outputs.cut == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ steps.decide.outputs.source }}
        run: gh workflow run release-evidence-automation.yml --repo "$GITHUB_REPOSITORY" --ref main -f source="$SOURCE"
