# Explicit release intent supplies evidence and refreshes checks. An intent that
# names the reviewed release head also lands it: once evidence and every required
# check pass, the guarded merge runs for that exact source and head. An intent
# without a head, a Full run no intent named, or RELEASE_AUTO_MERGE=off when a run
# starts leaves the merge to the release session. An intent stays valid for one day
# while main and the release head stay unchanged. Long-lived GitHub auto-merge is
# not release intent. Landing reads the release App secrets at repository level.
name: release evidence automation

on:
  workflow_dispatch:
    inputs:
      release_pr:
        description: Release PR number requesting source evidence
        required: false
        type: string
      expected_base:
        description: Exact main source commit selected for the release PR
        required: false
        type: string
      expected_head:
        description: Reviewed release PR head; with it, the release merges itself once its checks pass
        required: false
        type: string
      evidence_run:
        description: Full CI producer run whose completion refreshes release checks
        required: false
        type: string
      evidence_attempt:
        description: Exact Full CI producer attempt
        required: false
        type: string

permissions:
  actions: write
  contents: read
  pull-requests: read

env:
  GH_REPO: ${{ github.repository }}
  # The repository variable RELEASE_AUTO_MERGE=off turns landing off without a code change.
  LAND: ${{ vars.RELEASE_AUTO_MERGE != 'off' && secrets.RELEASE_PLEASE_APP_CLIENT_ID != '' && secrets.RELEASE_PLEASE_APP_PRIVATE_KEY != '' }}

# Duplicate intent for one PR must not dispatch concurrent Full fallback runs.
concurrency:
  group: release-evidence-automation-${{ inputs.release_pr || inputs.evidence_run }}

jobs:
  dispatch-evidence:
    name: dispatch evidence run on release intent
    if: ${{ inputs.release_pr != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Reuse complete evidence or dispatch the Full fallback
        id: intent
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.release_pr }}
          BASE_SHA: ${{ inputs.expected_base }}
          HEAD_SHA: ${{ inputs.expected_head }}
        run: |
          args=(intent --pr "$PR_NUMBER" --expected-base "$BASE_SHA")
          if [ -n "$HEAD_SHA" ]; then args+=(--expected-head "$HEAD_SHA" --output release-intent.json); fi
          python3 scripts/release_evidence.py "${args[@]}"
      - name: Keep the release intent for the evidence run
        if: ${{ inputs.expected_head != '' && env.LAND == 'true' && steps.intent.outputs.reused != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-intent
          path: release-intent.json
          if-no-files-found: error
          retention-days: 1
      - name: Mint the release App token
        if: ${{ inputs.expected_head != '' && env.LAND == 'true' && steps.intent.outputs.reused == 'true' }}
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          # Only what the merge needs.
          permission-contents: write
          permission-pull-requests: write
      - name: Land the intended release on reused evidence
        if: ${{ inputs.expected_head != '' && env.LAND == 'true' && steps.intent.outputs.reused == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MERGE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python3 scripts/release_evidence.py land --intent release-intent.json

  rerun-evidence-check:
    name: re-run release checks when evidence lands
    if: ${{ inputs.evidence_run != '' && inputs.release_pr == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh release checks after the exact Full attempt completes
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN: ${{ inputs.evidence_run }}
          EVIDENCE_ATTEMPT: ${{ inputs.evidence_attempt }}
        run: python3 scripts/release_evidence.py refresh --run-id "$EVIDENCE_RUN" --attempt "$EVIDENCE_ATTEMPT"
      - name: Find a release intent for the release PR's source and head
        if: ${{ env.LAND == 'true' }}
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_evidence.py land --find
      - name: Mint the release App token
        if: ${{ steps.find.outputs.intended == 'true' }}
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          # Only what the merge needs.
          permission-contents: write
          permission-pull-requests: write
      - name: Land the intended release
        if: ${{ steps.find.outputs.intended == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MERGE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python3 scripts/release_evidence.py land
