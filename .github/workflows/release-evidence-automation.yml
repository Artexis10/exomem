# The privileged controller always executes on main. Only release cuts serialize.
# Main pushes retain artifact recovery and never run Release Please.
name: release evidence automation

on:
  workflow_dispatch:
    inputs:
      source:
        description: Full merged main commit SHA to select or resume as the fixed release source
        required: false
        type: string
      evidence_run:
        description: Completed Full producer whose receipt refreshes pending metadata checks
        required: false
        type: string
      evidence_attempt:
        description: Exact Full producer attempt
        required: false
        type: string

permissions:
  actions: write
  contents: read
  pull-requests: read

env:
  GH_REPO: ${{ github.repository }}

# Evidence callbacks never queue behind the cut that is waiting for their checks.
concurrency:
  group: release-evidence-${{ inputs.source != '' && 'cut' || inputs.evidence_run }}
  cancel-in-progress: false

jobs:
  cut:
    if: ${{ inputs.source != '' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: release
    permissions:
      actions: write
      contents: read
      pull-requests: write
    env:
      LAND: ${{ vars.RELEASE_AUTO_MERGE != 'off' }}
      NODE_PATH: ${{ runner.temp }}/release-please/node_modules
    steps:
      - name: Mint the release App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          prune-cache: true
      - name: Install the action's maintained metadata updaters
        run: npm install --prefix "$RUNNER_TEMP/release-please" --ignore-scripts --no-audit --no-fund release-please@17.6.0
      - name: Select or resume the immutable cut
        id: cut
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE: ${{ inputs.source }}
        run: python3 scripts/release_cuts.py prepare --source "$SOURCE"
      - name: Propose the release on its isolated source
        if: steps.cut.outputs.propose == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0, release-please 17.6.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: ${{ steps.cut.outputs.branch }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
      - name: Reject non-metadata changes before executing candidate code
        if: steps.cut.outputs.merged != 'true'
        id: proposal
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_cuts.py check-head
      - name: Check out the generated release proposal
        if: steps.cut.outputs.merged != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.proposal.outputs.head }}
          path: candidate
          persist-credentials: false
          token: ${{ github.token }}
      - name: Regenerate packages from the selected source
        if: steps.cut.outputs.merged != 'true'
        working-directory: candidate
        run: |
          uv run --frozen python scripts/cloud-plugin.py build
          uv run --frozen exomem package-skills --plugin-root plugins/claude-code
      - name: Push only generated packages with the release App
        if: steps.cut.outputs.merged != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python3 scripts/release_cuts.py push-generated --candidate candidate
      - name: Retain authentic evidence before minting the landing token
        if: env.LAND == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ACTIONS_TOKEN: ${{ github.token }}
        run: python3 scripts/release_cuts.py evidence
      - name: Mint a fresh release App token after Full qualification
        if: env.LAND == 'true'
        id: landing-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - name: Qualify the exact head and verify its squash outcome
        if: env.LAND == 'true'
        env:
          GH_TOKEN: ${{ steps.landing-token.outputs.token }}
        run: python3 scripts/release_cuts.py qualify
      - name: Tag the verified native squash outcome
        if: env.LAND == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0, release-please 17.6.0
        with:
          token: ${{ steps.landing-token.outputs.token }}
          target-branch: ${{ steps.cut.outputs.branch }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
      - name: Reconcile current main and publish only after origin acceptance
        if: env.LAND == 'true'
        env:
          GH_TOKEN: ${{ steps.landing-token.outputs.token }}
          RELEASE_ACTIONS_TOKEN: ${{ github.token }}
        run: python3 scripts/release_cuts.py reconcile

  rerun-evidence-check:
    if: ${{ inputs.evidence_run != '' && inputs.source == '' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh metadata checks after the exact Full attempt completes
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN: ${{ inputs.evidence_run }}
          EVIDENCE_ATTEMPT: ${{ inputs.evidence_attempt }}
        run: python3 scripts/release_evidence.py refresh --run-id "$EVIDENCE_RUN" --attempt "$EVIDENCE_ATTEMPT"
