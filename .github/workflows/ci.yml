name: CI

# Disposable hosted regression proof; this branch never merges.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-mixed-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KB_MCP_DISABLE_EMBEDDINGS: "1"
      KB_MCP_DISABLE_MEDIA_EXTRACTION: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      EXOMEM_TEST_TIER: core
      EXOMEM_TUI_TEST_DIRECTORY: tests/tui
      FASTMCP_MCP_CAMELCASE_COMPAT: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0ac1ecf139fc01aa23df6b2e19bcec7d42ac987d
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"
          enable-cache: true
      - name: Exercise finite mixed recall and existing unit behavior
        run: >-
          uv run --frozen --python 3.13 python -m pytest -q
          tests/test_semantic_unit_recall.py -o timeout=180
          --junitxml=${{ runner.temp }}/finite-mixed-head.xml
      - name: Verify the prior candidate exposes the occurrence-work regression
        shell: bash
        run: |
          baseline="$RUNNER_TEMP/finite-mixed-baseline"
          git worktree add --detach "$baseline" 7f42ea282907cfc49c669297de0327a72b5bfb97
          cp tests/test_semantic_unit_recall.py "$baseline/tests/test_semantic_unit_recall.py"
          set +e
          PYTHONPATH="$baseline/src" "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest -q "$baseline/tests/test_semantic_unit_recall.py::test_page_only_parent_unit_growth_keeps_keyword_metadata_work_bounded" -o timeout=180 --junitxml="$RUNNER_TEMP/finite-mixed-baseline.xml"
          result=$?
          set -e
          test "$result" -eq 1
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse(Path(os.environ["RUNNER_TEMP"]) / "finite-mixed-baseline.xml").getroot()
          cases = list(root.iter("testcase"))
          assert len(cases) == 1
          failure = cases[0].find("failure")
          assert failure is not None and failure.attrib["message"].startswith("AssertionError")
          assert "large_steps <= small_steps * 1.5" in (failure.text or "")
          assert not list(root.iter("error"))
          print("The prior candidate fails on the metadata work-growth assertion.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finite-mixed-regression
          path: ${{ runner.temp }}/finite-mixed-*.xml
          if-no-files-found: warn
