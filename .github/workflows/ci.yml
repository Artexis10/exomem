name: CI graph diagnostic

# Temporary branch-only probe. This workflow is never a release evidence run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graph-convergence:
    name: graph convergence (concurrent writer)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Graph converges under sustained concurrent writes
        # The property eight PRs of graph work never had a gate for: with a
        # writer running continuously, repair queued off the write path must
        # still converge. Asserts the graph reaches `current`, the durable queue
        # drains, and an audit finds zero drift against the Markdown -- drift
        # audited rather than asserted by construction from the code that
        # produced it.
        #
        # `--max-blocking 0` also asserts that no write parks, which is the
        # whole claim of #591 -- an interactive write does not wait on graph
        # repair. It is only gateable because the two defects this lane found
        # are fixed: the same run measured a 15.6 s worst write before and
        # 861 ms after, against a 5 s blocking threshold. Six times the margin,
        # so red here is a regression rather than a slow runner.
        run: >-
          uv run --frozen python scripts/graph_concurrent_convergence.py .
          --pages 400 --seconds 45 --drain-interval 0.5 --check --max-blocking 0
