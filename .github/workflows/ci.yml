  release-evidence:
    needs: scope
    name: release evidence
    runs-on: ubuntu-latest
    # A reconciliation check syncs the project and runs the package generators.
    timeout-minutes: 15
    # Read-only: the checks read PR files, runs, artifacts and tags, and write nothing.
    permissions:
      actions: read
      contents: read
      pull-requests: read
    # Release metadata validates its source; every other context succeeds here
    # while the selected ordinary and Full jobs supply their own evidence.
    steps:
      - name: Report the selected source scope
        if: needs.scope.outputs.release != 'true'
        env:
          FULL_CI: ${{ needs.scope.outputs.full }}
        run: echo "Full source scope is $FULL_CI"
      - name: Check out the release checker at the release base
        # The base revision, so a release PR cannot edit its own check.
        if: needs.scope.outputs.release == 'true' && needs.scope.outputs.reconcile != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: |
            scripts/check_release_pr_files.py
            scripts/release_evidence.py
            scripts/release_metadata.cjs
            release-please-config.json
          sparse-checkout-cone-mode: false
      - name: Install the pinned release metadata updaters
        if: needs.scope.outputs.release == 'true' && needs.scope.outputs.reconcile != 'true'
        run: npm install --prefix "$RUNNER_TEMP/release-please" --ignore-scripts --no-audit --no-fund release-please@17.6.0
      - name: Require that the release PR changes only what release-please writes
        # The release PR runs no test job, which is sound only while its diff
        # is release-please's own work (scripts/check_release_pr_files.py).
        # `shell: bash` adds pipefail; a failed API call must refuse.
        if: needs.scope.outputs.release == 'true' && needs.scope.outputs.reconcile != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          NODE_PATH: ${{ runner.temp }}/release-please/node_modules
        run: |
          if test "$HEAD_REPO" != "$GH_REPO"; then
            echo "a release PR must come from $GH_REPO, not $HEAD_REPO" >&2
            exit 1
          fi
          gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files" --jq '.[] | tojson' \
            > "$RUNNER_TEMP/pr-files.jsonl"
          git fetch --quiet origin "$BASE_SHA" "$HEAD_SHA"
          python3 scripts/check_release_pr_files.py release-please-config.json "$RUNNER_TEMP/pr-files.jsonl" --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Require complete Full evidence for the release source tree
        if: needs.scope.outputs.release == 'true' && needs.scope.outputs.reconcile != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/release_evidence.py select --source "$BASE_SHA"
      # A reconciliation PR runs no test job, which is sound only while merging
      # it gives exactly what the cut controller projects onto main
      # (release_cuts.py check-reconciliation). The checker runs from the base.
      - name: Check out the reconciliation checker at the PR base
        if: needs.scope.outputs.reconcile == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install the reconciliation generators
        if: needs.scope.outputs.reconcile == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          prune-cache: true
      - name: Install the pinned release metadata updaters for the reconciliation
        if: needs.scope.outputs.reconcile == 'true'
        run: npm install --prefix "$RUNNER_TEMP/release-please" --ignore-scripts --no-audit --no-fund release-please@17.6.0
      - name: Require that the reconciliation PR is the controller's projection
        if: needs.scope.outputs.reconcile == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          NODE_PATH: ${{ runner.temp }}/release-please/node_modules
        run: |
          if test "$HEAD_REPO" != "$GH_REPO"; then
            echo "a reconciliation PR must come from $GH_REPO, not $HEAD_REPO" >&2
            exit 1
          fi
          python3 scripts/release_cuts.py check-reconciliation --head "$HEAD_SHA" --trusted-main "$BASE_SHA" --source "${HEAD_REF#release-reconcile/}"

  # A dispatched or scheduled full run is a superset of the push run at the
  # same revision: the same jobs plus the full tier and py3.13. The push run is
  # cancelled so the same proof does not take the shared job slots twice.
  # Best effort: an API error must not turn the full run's evidence red.
  cancel-superseded-push-run:
    needs: scope
    name: cancel the push run this full run supersedes
    if: ${{ needs.scope.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Cancel unfinished push runs of this workflow at this revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          runs=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?event=push&head_sha=$GITHUB_SHA&per_page=20" \
            --jq ".workflow_runs[] | select(.event == \"push\" and .head_sha == \"$GITHUB_SHA\" and .status != \"completed\" and .id != $GITHUB_RUN_ID) | .id")
          for run in $runs; do
            gh run cancel "$run" && echo "cancelled push run $run at $GITHUB_SHA" ||
              echo "push run $run was not cancelled; it may have finished"
          done

  # Engineering-practices quality check (https://github.com/Artexis10/engineering-practices):
  # fails on dead code a pull request adds and posts the Quality report. It informs
  # review and is deliberately outside the required CI gate below.
  quality:
    if: ${{ github.event_name == 'pull_request' && !cancelled() && needs.scope.result == 'success' }}
    # The test jobs named in .github/quality.yml, so their runtime is known.
    needs: [scope, timing-tests, core-tests, recall-structural-reference, harness-tests, windows-held-filesystem, tui, product-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: quality-${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Artexis10/engineering-practices@v1

  gate:
    name: required CI gate
    # Surface dependency failures, but let superseded PR runs release the runner.
    if: ${{ !cancelled() }}
    needs:
      - scope
      - release-evidence
      - timing-tests
      - core-tests
      - recall-structural-reference
      - harness-tests
      - windows-held-filesystem
      - tui
      - product-e2e
      - frozen-verifier
      - cloud-cellctl
      - retrieval-quality
      - semantic-write-latency
      - graph-convergence
      - onboarding
      - docker
      - specs
      - build
      - capabilities
      - lint
    runs-on: ubuntu-latest
    steps:
      - name: Require the selected CI tier to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          FULL_CI: ${{ needs.scope.outputs.full == 'true' }}
        run: |
          failures=$(jq -r --argjson full_ci "$FULL_CI" '
            to_entries[]
            | select(.value.result != "success" and ($full_ci or .value.result != "skipped"))
            | "CI dependency \(.key) returned \(.value.result)"
          ' <<< "$RESULTS")
          if test -n "$failures"; then
            printf '%s\n' "$failures" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        if: needs.scope.outputs.full == 'true'
        with:
          fetch-depth: 2
      - name: Record the actual checkout after the Full gate passes
        if: needs.scope.outputs.full == 'true'
        run: python3 scripts/release_evidence.py record --output full-ci-evidence.json
      - name: Retain immutable Full evidence for this run and attempt
        if: needs.scope.outputs.full == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: full-ci-evidence.json
          if-no-files-found: error
          retention-days: 90

  # Main's push run is the only evidence that the shards a pull request skips pass,
  # so one tracking issue says when it is red and closes itself when it is green.
  # Best effort: an API error must not turn the push run red, hiding the gate's own result.
  main-failing-issue:
    needs: gate
    name: track a failing main run
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open, update or close the main CI tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GATE_RESULT: ${{ needs.gate.result }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          commit="${GITHUB_SHA:0:12} $(head -n 1 <<< "$COMMIT_SUBJECT")"
          facts="Run: $run_url"$'\n'"Commit: $commit"
          open=$(gh issue list --label ci-main-failing --state open --limit 20 --json number --jq '.[].number')
          case "$GATE_RESULT" in
            failure)
              if test -n "$open"; then
                gh issue comment "$(head -n 1 <<< "$open")" --body "Main CI is still failing."$'\n\n'"$facts"
              else
                gh label create ci-main-failing --force --color B60205 --description "The required CI gate failed on a push to main"
                gh issue create --label ci-main-failing --title "main CI is failing" \
                  --body "The required CI gate failed on a push to main. Fix forward on main."$'\n\n'"$facts"
              fi ;;
            success)
              for number in $open; do
                gh issue close "$number" --comment "Main CI is green again."$'\n\n'"$facts"
              done ;;
          esac

  # A merge queue run (scripts/merge_queue.py) reports its result on each member
  # pull request and wakes the queue. A run the workflow token dispatched raises
  # no workflow_run event, so it wakes the queue itself.
  merge-queue-verdict:
    name: merge queue verdict
    needs: gate
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.queue && startsWith(github.ref, 'refs/heads/merge-queue/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      statuses: write
    steps:
      # The verdict runs main's script, so a candidate that breaks it still gets a verdict.
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: scripts
      - name: Post the result on each member and wake the queue
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE: ${{ inputs.queue }}
          RESULT: ${{ needs.gate.result }}
        run: python3 scripts/merge_queue.py verdict

  # A full run that release-evidence-automation.yml dispatched with
  # GITHUB_TOKEN raises no workflow_run event when it completes, so the full
  # run signals its own evidence: after its gate passes it dispatches that
  # workflow, which waits for this run's recorded completion and then re-runs
  # the waiting release PR's failed checks; on a cut branch it also resumes the
  # cut. Known bound: a release PR run still in progress then has nothing to
  # re-run; the PR tier normally finishes well inside the full tier's duration.
  release-evidence-landed:
    name: signal release evidence landed
    needs: gate
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-cuts/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the release check re-run for this evidence run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVIDENCE_RUN: ${{ github.run_id }}
          EVIDENCE_ATTEMPT: ${{ github.run_attempt }}
        run: gh workflow run release-evidence-automation.yml --ref main -f evidence_run="$EVIDENCE_RUN" -f evidence_attempt="$EVIDENCE_ATTEMPT"
      # A cut gives up polling before a Full run that queued behind other work
      # finishes. Resuming the same source is the cut's own retry path, and an
      # already finished cut re-checks its accepted origin and publishes nothing new.
      - name: Resume the release cut this Full run qualifies
        if: startsWith(github.ref, 'refs/heads/release-cuts/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CUT_BRANCH: ${{ github.ref_name }}
        run: gh workflow run release-evidence-automation.yml --ref main -f source="${CUT_BRANCH#release-cuts/}"
