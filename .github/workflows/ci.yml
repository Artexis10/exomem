  tui:
    needs: scope
    name: terminal UI (textual, headless + snapshots)
    if: *not-release-pr
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: *setup-uv-inputs
      - name: TUI suite (Pilot interaction + committed SVG goldens)
        # The lean matrix skips tests/tui (no `tui` extra there); this job
        # opts in. Goldens render only from the deterministic FakeBackend —
        # regenerate intentionally with `pytest tests/tui --snapshot-update`.
        run: uv run --frozen --extra tui --group tui-dev python -m pytest "$EXOMEM_TUI_TEST_DIRECTORY" tests/test_tui_entry.py -q

  product-e2e:
    needs: scope
    name: product E2E (installed wheel, stdio + HTTP)
    if: *not-release-pr
    runs-on: ubuntu-latest
    # Keep the existing eight-minute journey, bounded apt setup and native proof inside the job.
    timeout-minutes: 20
    # The job installs and runs earlier published releases; it needs no write access.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Compare the complete PR merge tree with its base parent.
          fetch-depth: 2
      - name: Select installed journey scope
        # Docs-only paths are outside the wheel and sdist inputs, and the
        # journey reads none of them.
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci_change_scope.py "the installed journey"
      - name: Install uv
        if: steps.scope.outputs.docs_only != 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: *setup-uv-inputs
      - name: Install the pinned older reader for the installed launcher proof
        if: steps.scope.outputs.docs_only != 'true'
        timeout-minutes: 5
        run: |
          uv run --no-project --python 3.13 scripts/ci_install_release.py "$EXOMEM_TEST_OLDER_READER_VERSION" \
            "$RUNNER_TEMP/older-reader" "$EXOMEM_TEST_OLDER_READER_SHA256" EXOMEM_TEST_OLDER_READER_PYTHON
      # Release evidence pins the rollback application (move-structured-collections-to-sqlite
      # design §10, "Reversal"). The install script checks the wheel against the pinned SHA-256.
      - name: Install the pinned earlier application for the rollback qualification
        if: >-
          steps.scope.outputs.docs_only != 'true' && needs.scope.outputs.full == 'true'
          && env.EXOMEM_TEST_COMPATIBLE_APPLICATION_VERSION != ''
        timeout-minutes: 5
        run: |
          uv run --no-project --python 3.13 scripts/ci_install_release.py "$EXOMEM_TEST_COMPATIBLE_APPLICATION_VERSION" \
            "$RUNNER_TEMP/compatible-application" "$EXOMEM_TEST_COMPATIBLE_APPLICATION_SHA256" EXOMEM_TEST_COMPATIBLE_PYTHON
      # The one run also drives the S1 summary-collection journey
      # (scripts/e2e_s1_summary_journey.py): installed release capability checks,
      # preserved-source import with a mid-job restart, daily queries
      # against an independent reference, recipient field release/revocation,
      # fresh copy adoption, old-reader refusal, rollback, and unchanged file collections.
      # Its last step migrates the adopted copy's file Records and Planning collections
      # into the store and proves them in store mode.
      # Budget evidence, 27 runs on 2026-10-16 (S1 journey included): median 217 s,
      # p90 228 s, max 258 s (two slow runners passed 240 s). 330 s clears the slowest
      # healthy run by ~30% and still fires at a 1.5x slowdown of the median.
      - name: Governed lifecycle, restart persistence, transport shutdown, S1 summary journey
        if: steps.scope.outputs.docs_only != 'true'
        run: uv run --frozen python scripts/e2e_product_loop.py --budget-seconds 330 --request-timeout 20
      - name: Restore the age release archive
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with: *age-archive-cache
      - name: Install retained-original encryption tools
        # The script bounds its download retries at three minutes.
        timeout-minutes: 5
        if: steps.scope.outputs.docs_only != 'true'
        run: scripts/ci-install-age.sh
      - name: Cloud frame reads with native codecs
        if: steps.scope.outputs.docs_only != 'true'
        env:
          KB_MCP_DISABLE_EMBEDDINGS: "1"
          KB_MCP_DISABLE_MEDIA_EXTRACTION: "1"
          EXOMEM_DISABLE_WARMUP: "1"
          OPENBLAS_NUM_THREADS: *native-math-threads
          PYTHONDONTWRITEBYTECODE: "1"
          FASTMCP_MCP_CAMELCASE_COMPAT: "false"
        # Keep mandatory decoder proof in this job, outside lean worker environments.
        # Each test owns its temporary vault and ledger, so tests run on parallel workers.
        # Work stealing splits the long preview-recovery module across workers.
        # Preserve thread stacks before a worker timeout can discard them.
        run: >-
          uv run --frozen --extra frame-codecs python -m pytest -q -n 4 --dist worksteal
          -o faulthandler_timeout=100
          tests/test_cloud_video_frames.py tests/test_image_view.py tests/test_media_previews.py tests/test_camera_raw.py
          tests/test_media_preview_recovery.py tests/test_capture_metadata.py
          tests/test_capture_backfill.py tests/test_capture_backfill_store.py tests/test_capture_recovery.py
          tests/test_speech_attach_door.py
          -m frame_codecs -o timeout=120
          --junitxml=test-results/e2e-logs/cloud-frame-junit.xml
      # The harness prints the tail inline; this keeps the whole log for the
      # failures whose cause is older than the tail.
      - name: Upload E2E server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-e2e-server-logs
          # Per-run diagnostics: nothing reads them after the run, so a week is enough.
          retention-days: 7
          path: test-results/e2e-logs
          if-no-files-found: ignore

  # Reuse the specialized suites so release evidence includes them at its base.
  frozen-verifier:
    needs: scope
    if: ${{ needs.scope.outputs.full == 'true' }}
    uses: ./.github/workflows/frozen-verifier.yml

  cloud-cellctl:
    needs: scope
    if: ${{ needs.scope.outputs.full == 'true' }}
    uses: ./.github/workflows/cloud-cellctl.yml

  retrieval-quality:
    needs: scope
    name: retrieval quality (golden gate, embeddings)
    if: ${{ needs.scope.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    # A cold cache fetches bge-m3 and, until its artefact is published, builds
    # the int8 artefact on the runner (minutes, ~9 GB peak) before the
    # multilingual activation acceptance runs; a warm cache needs neither. The
    # dense recall acceptance adds about four minutes of sidecar builds.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: *setup-uv-inputs
      # Cache the downloaded models between runs, with the served bge-m3 int8
      # artefact the activation acceptance loads (fetched or host-built into
      # ~/.cache/huggingface/exomem-artifacts). The first run downloads them;
      # later runs restore them so the gate stays fast. Keyed on the pinned
      # revisions and the artefact digest, so a pin bump busts the cache.
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-base-en-v1.5-reranker-base-bge-m3-5617a9f6-int8-7b9a0b3b
      - name: Golden retrieval quality gate (hybrid ranking, live vectors)
        # Runs the embeddings-marked suite (tests/test_retrieval_golden.py):
        # builds the sidecar over the fixture KB and asserts hybrid NDCG@10 / MRR
        # / recall@10 clear their floors. Kept OFF the fast 3-version matrix so
        # lean CI never pays the torch download. EXOMEM_DISABLE_EMBEDDINGS is
        # deliberately unset here — the test lifts it and loads the real model.
        run: uv run --frozen --extra embeddings python -m pytest -m embeddings -v

  semantic-write-latency:
    needs: scope
    name: semantic write latency (2k and 8k)
    if: ${{ needs.scope.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: *setup-uv-inputs
      - name: FTS5 read-after-write visibility regression
        run: uv run --frozen python -m pytest tests/test_read_after_write_visibility.py -q
      - name: Semantic validate and commit latency scaling gate (2k and 8k)
        # Aggregate timings only: the foreground semantic path must stay bounded
        # after startup warm-up and must not regress to corpus-wide parse/resolver
        # work when the corpus grows 4x.
        run: uv run --frozen python scripts/semantic_write_latency.py --check

  graph-convergence:
    needs: scope
    name: graph convergence (concurrent writer)
    if: ${{ needs.scope.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: *setup-uv-inputs
      - name: Graph converges under sustained concurrent writes
        # The property eight PRs of graph work never had a gate for: with a
        # writer running continuously, repair queued off the write path must
        # still converge. Asserts the graph reaches `current`, the durable queue
        # drains, and an audit finds zero drift against the Markdown -- drift
        # audited rather than asserted by construction from the code that
        # produced it.
        #
        # `--max-blocking 0` also asserts that no write parks, which is the
        # whole claim of #591 -- an interactive write does not wait on graph
        # repair. It is only gateable because the two defects this lane found
        # are fixed: the same run measured a 15.6 s worst write before and
        # 861 ms after, against a 5 s blocking threshold. Six times the margin,
        # so red here is a regression rather than a slow runner.
        run: >-
          uv run --frozen python scripts/graph_concurrent_convergence.py .
          --pages 400 --seconds 45 --drain-interval 0.5 --check --max-blocking 0

  onboarding:
    needs: scope
    name: onboarding (wheel path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: *setup-uv-inputs
      - name: Wheel-only time-to-value gate
        # Proves the onboarding path works from the built wheel alone — the
        # packaged sample vault ships, `exomem demo` has no repo dependency,
        # and `exomem setup --yes` completes — with a hard wall-time budget.
        run: uv run --frozen python scripts/time-to-value.py --budget-seconds 120

  docker:
    needs: scope
    name: docker (lean build + smoke)
    if: ${{ needs.scope.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build lean image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: lean
          load: true
          tags: exomem:pr-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: In-container demo smoke (packaged sample vault, no mounts)
        run: docker run --rm exomem:pr-smoke demo --json
      - name: HTTP boot + claude.ai discovery-route smoke (dummy OAuth env, no GitHub calls)
        run: |
          trap 'docker rm -f exomem-smoke >/dev/null 2>&1 || true' EXIT
          mkdir -p /tmp/vault
          docker run --rm -v /tmp/vault:/vault exomem:pr-smoke init --vault /vault
          docker run -d --name exomem-smoke -p 8765:8765 \
            -v /tmp/vault:/vault -e EXOMEM_VAULT_PATH=/vault \
            -e EXOMEM_BASE_URL=http://127.0.0.1:8765 \
            -e GITHUB_CLIENT_ID=dummy -e GITHUB_CLIENT_SECRET=dummy \
            -e EXOMEM_GITHUB_USERNAME=dummy -e EXOMEM_GITHUB_USER_ID=1 \
            -e EXOMEM_JWT_SIGNING_KEY=dummy \
            exomem:pr-smoke
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/mcp || true)
            [ "$code" = "401" ] && break
            sleep 1
          done
          test "$code" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/.well-known/oauth-authorization-server)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/.well-known/oauth-protected-resource)" = "200"
          docker logs exomem-smoke | tail -5
          docker stop exomem-smoke

  specs:
    needs: scope
    name: OpenSpec validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.20"
