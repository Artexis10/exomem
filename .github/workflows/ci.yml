name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && format('full-{0}', github.ref) || github.event.pull_request.number || github.ref }}
  # New pushes supersede PR feedback, but main/release evidence must finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: tests (py${{ matrix.python-version }}, shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # PRs and main pushes pay for the newest runtime only. The minimum
        # supported runtime joins on nightly/manual runs and release PRs, where
        # compatibility evidence is useful without doubling every feedback run.
        python-version: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release-please--branches--main')) && fromJSON('["3.11", "3.13"]') || fromJSON('["3.13"]') }}
        # Separate runners keep process, port, filesystem, and mutation-lock
        # state isolated while cutting the serial critical path by roughly 4x.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          # Benchmark contract receipts are verified against their complete
          # introduction/amendment ancestry. A shallow PR merge checkout
          # cannot prove that history and must not silently weaken the gate.
          fetch-depth: 0
      - name: Install pinned Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install process-isolation runtime
        # A stalled package mirror is not a test failure, but it presented as
        # one. `apt-get update` has no wall-clock bound, so when
        # azure.archive.ubuntu.com went dark on a single runner this step sat
        # for 29m26s, consumed the job's entire 30-minute budget, and the shard
        # ended `cancelled` without reaching a line of test code. The gate below
        # asserts every dependency is `success`, and `cancelled` is not
        # `success` -- so a mirror outage fails the required check exactly like
        # a red test, and blocked the 0.55.0 release twice before anyone looked
        # past the job name. The helper bounds each attempt and retries; this is
        # the outer backstop only. It must exceed the helper's own worst case
        # (3 x 45s of update, then 150s of install = 285s) with margin, and stay
        # far under the 30-minute job budget it exists to protect.
        timeout-minutes: 6
        run: |
          scripts/ci-apt-install.sh bubblewrap
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --new-session --die-with-parent \
            --ro-bind / / -- /usr/bin/true
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Verify lockfile is current
        run: uv lock --check
      - name: Run tests (lean — BM25/keyword, server media extraction off)
        env:
          # The suite runs without the embeddings/media extras; these mirror the
          # conftest autouse defaults so a forgotten extra can't change behaviour.
          KB_MCP_DISABLE_EMBEDDINGS: "1"
          KB_MCP_DISABLE_MEDIA_EXTRACTION: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          uv run --frozen --python ${{ matrix.python-version }} python -m pytest -q
          --splits=4
          --group=${{ matrix.shard }}
          --splitting-algorithm=least_duration
          --durations-path=.test_durations.json
          --session-timeout=1500
          --durations=50
          --durations-min=1
          --junitxml=test-results/junit-${{ matrix.python-version }}-shard-${{ matrix.shard }}.xml
      - name: Upload lean test timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-py${{ matrix.python-version }}-shard-${{ matrix.shard }}-junit
          path: test-results/junit-${{ matrix.python-version }}-shard-${{ matrix.shard }}.xml
          if-no-files-found: warn
      - name: Sample vault smoke (the exact command users run)
        if: matrix.shard == 1
        run: uv run --frozen --python ${{ matrix.python-version }} exomem demo --json

  windows-held-filesystem:
    name: Windows held filesystem (native NTFS)
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Verify lockfile is current
        run: uv lock --check
      - name: Require NTFS and 8.3 aliases
        shell: pwsh
        run: |
          $drive = (Get-Item $env:GITHUB_WORKSPACE).PSDrive.Name
          $volume = Get-Volume -DriveLetter $drive
          if ($volume.FileSystem -ne "NTFS") {
            throw "held-filesystem verification requires NTFS"
          }
          $writableNtfs = @()
          foreach ($candidate in Get-Volume | Where-Object { $_.DriveLetter -and $_.FileSystem -eq "NTFS" }) {
            $probe = "$($candidate.DriveLetter):\exomem-held-volume-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            try {
              New-Item -ItemType Directory -Path $probe -ErrorAction Stop | Out-Null
              Remove-Item -LiteralPath $probe -Force -ErrorAction Stop
              $writableNtfs += $candidate.DriveLetter
            } catch {
              # The native test will report which volume was unavailable.
            }
          }
          if (@($writableNtfs | Sort-Object -Unique).Count -lt 2) {
            throw "held-filesystem verification requires at least two writable NTFS volumes"
          }
          fsutil.exe 8dot3name set "$drive`:" 0
          if ($LASTEXITCODE -ne 0) {
            throw "failed to enable per-volume 8.3 alias creation"
          }
          fsutil.exe 8dot3name query "$drive`:"
          if ($LASTEXITCODE -ne 0) {
            throw "failed to verify per-volume 8.3 alias creation"
          }
      - name: Native held-filesystem gate
        env:
          KB_MCP_DISABLE_EMBEDDINGS: "1"
          KB_MCP_DISABLE_MEDIA_EXTRACTION: "1"
          EXOMEM_DISABLE_CLIP: "1"
          EXOMEM_WRITER_LEASE_STATE_DIR: ${{ runner.temp }}\exomem-reserved-state
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          uv run --frozen --python 3.13 python -m pytest -q
          tests/test_held_fs_contract.py
          tests/test_held_fs_windows.py
          tests/test_reserved_admin_paths.py
          tests/test_mutation_concurrency.py
          tests/test_windows_path_alias_guard.py
          --session-timeout=600
      - name: Native reserved-path compatibility gate
        env:
          KB_MCP_DISABLE_EMBEDDINGS: "1"
          KB_MCP_DISABLE_MEDIA_EXTRACTION: "1"
          EXOMEM_DISABLE_CLIP: "1"
          EXOMEM_WRITER_LEASE_STATE_DIR: ${{ runner.temp }}\exomem-reserved-state-compat
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          uv run --frozen --python 3.13 python -m pytest -q
          tests/test_governance_receipts.py
          tests/test_graph_lifecycle_windows.py
          tests/test_media_processing.py
          -k "test_reconcile_dry_run_keeps_evidence_and_operational_files_byte_identical
          or test_windows_epoch_abort_flushes_removed_floor_and_preserves_lifecycle_refusal
          or test_windows_deletion_post_rename_flush_refusal_durably_inverse_restores_prior_truth
          or test_windows_deletion_inverse_move_failure_retains_epoch_and_marker_for_reconcile
          or test_windows_recovery_post_rename_flush_refusal_durably_inverse_restores_prior_truth
          or test_windows_recovery_inverse_move_failure_retains_epoch_and_marker_for_reconcile
          or test_prose_only_sidecar_is_repaired_without_losing_notes
          or test_partial_pending_sidecar_is_canonically_repaired_with_prose
          or test_completed_sidecar_with_invalid_cheap_provenance_is_reconciled
          or test_legacy_completed_sidecar_without_any_provenance_is_preserved
          or test_legacy_completed_mp4_backfills_partial_provenance_without_rewriting_transcript
          or test_caller_supplied_completed_text_backfills_missing_provenance_in_place
          or test_bounded_reconcile_skips_converged_prefix_and_advances_later_work"
          --session-timeout=600

  tui:
    name: terminal UI (textual, headless + snapshots)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: TUI suite (Pilot interaction + committed SVG goldens)
        # The lean matrix skips tests/tui (no `tui` extra there); this job
        # opts in. Goldens render only from the deterministic FakeBackend —
        # regenerate intentionally with `pytest tests/tui --snapshot-update`.
        run: uv run --frozen --extra tui --group tui-dev python -m pytest tests/tui tests/test_tui_entry.py -q

  product-e2e:
    name: product E2E (installed wheel, stdio + HTTP)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Governed lifecycle, restart persistence, and transport shutdown
        run: uv run --frozen python scripts/e2e_product_loop.py --budget-seconds 240 --request-timeout 20
      # The harness prints the tail inline; this keeps the whole log for the
      # failures whose cause is older than the tail.
      - name: Upload E2E server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-e2e-server-logs
          path: test-results/e2e-logs
          if-no-files-found: ignore

  retrieval-quality:
    name: retrieval quality (golden gate, embeddings)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release-please--branches--main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Cache the downloaded bge model between runs — the first run downloads
      # ~0.5 GB, later runs restore it so the gate stays fast. Keyed on the
      # model rev pinned in eval_retrieval.py so a model bump busts the cache.
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-base-en-v1.5-reranker-base
      - name: Golden retrieval quality gate (hybrid ranking, live vectors)
        # Runs the embeddings-marked suite (tests/test_retrieval_golden.py):
        # builds the sidecar over the fixture KB and asserts hybrid NDCG@10 / MRR
        # / recall@10 clear their floors. Kept OFF the fast 3-version matrix so
        # lean CI never pays the torch download. EXOMEM_DISABLE_EMBEDDINGS is
        # deliberately unset here — the test lifts it and loads the real model.
        run: uv run --frozen --extra embeddings python -m pytest -m embeddings -v

  retrieval-latency:
    name: retrieval latency (2k synthetic vault)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release-please--branches--main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Per-lane latency ceiling gate (2000-note synthetic vault, model-free)
        # The anti-"hidden 14s" gate (tests/test_latency_gate.py): generates a
        # realistic densely-wikilinked 2000-note vault and asserts NO retrieval
        # lane exceeds its ceiling (graph rebuild → ~1.9s trips it). Model-free,
        # so it ALSO runs in the lean matrix; pinned here as the benchmark gate's
        # home next to the golden quality gate.
        run: uv run --frozen python -m pytest tests/test_latency_gate.py -q

  governance-projection-wire:
    name: governance projected wire characterization (${{ matrix.route }})
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release-please--branches--main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        route: [keyword, bm25, vector-hard-off, rerank-hard-off, clip-hard-off, graph, graph-rerank-hard-off, max-query, max-limit, max-shape, hidden-index-missing, pagination]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Verify lockfile is current
        run: uv lock --check
      - name: Characterize exact-capacity hidden-corpus actual-wire routes
        env:
          EXOMEM_GOVERNANCE_TIMING_ROUTE: ${{ matrix.route }}
          EXOMEM_DISABLE_EMBEDDINGS: "1"
          EXOMEM_DISABLE_MEDIA_EXTRACTION: "1"
          EXOMEM_DISABLE_CLIP: "1"
          EXOMEM_DISABLE_RANKING: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          uv run --frozen --python 3.13 python -m pytest -q
          tests/test_governance_projection_wire_gate.py
          --session-timeout=360

  governance-projection-wire-vector-cpu:
    name: governance projected vector CPU wire (${{ matrix.route }})
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release-please--branches--main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        route: [keyword, bm25, vector-live, rerank-hard-off, clip-hard-off, graph, graph-rerank-hard-off, max-query, max-limit, max-shape, hidden-index-missing, pagination]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Cache the certified BGE vector model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-base-en-v1.5-vector-cpu-v1
      - name: Verify lockfile is current
        run: uv lock --check
      - name: Certify exact-capacity hidden-corpus vector CPU routes
        env:
          EXOMEM_GOVERNANCE_TIMING_PROFILE: vectors-cpu-torch-v1
          EXOMEM_GOVERNANCE_TIMING_ROUTE: ${{ matrix.route }}
          EXOMEM_DISABLE_MEDIA_EXTRACTION: "1"
          EXOMEM_DISABLE_CLIP: "1"
          EXOMEM_DISABLE_RANKING: "1"
          EXOMEM_DEVICE: cpu
          EXOMEM_EMBED_BACKEND: torch
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          uv run --frozen --extra embeddings --python 3.13 python -m pytest -q
          tests/test_governance_projection_wire_gate.py
          --session-timeout=600

  semantic-write-latency:
    name: semantic write latency (2k and 8k)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release-please--branches--main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: FTS5 read-after-write visibility regression
        run: uv run --frozen python -m pytest tests/test_read_after_write_visibility.py -q
      - name: Semantic validate and commit latency scaling gate (2k and 8k)
        # Aggregate timings only: the foreground semantic path must stay bounded
        # after startup warm-up and must not regress to corpus-wide parse/resolver
        # work when the corpus grows 4x.
        run: uv run --frozen python scripts/semantic_write_latency.py --check

  graph-convergence:
    name: graph convergence (concurrent writer)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release-please--branches--main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Graph converges under sustained concurrent writes
        # The property eight PRs of graph work never had a gate for: with a
        # writer running continuously, repair queued off the write path must
        # still converge. Asserts the graph reaches `current`, the durable queue
        # drains, and an audit finds zero drift against the Markdown -- drift
        # audited rather than asserted by construction from the code that
        # produced it.
        #
        # `--max-blocking 0` also asserts that no write parks, which is the
        # whole claim of #591 -- an interactive write does not wait on graph
        # repair. It is only gateable because the two defects this lane found
        # are fixed: the same run measured a 15.6 s worst write before and
        # 861 ms after, against a 5 s blocking threshold. Six times the margin,
        # so red here is a regression rather than a slow runner.
        run: >-
          uv run --frozen python scripts/graph_concurrent_convergence.py .
          --pages 400 --seconds 45 --drain-interval 0.5 --check --max-blocking 0

  onboarding:
    name: onboarding (wheel path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Wheel-only time-to-value gate
        # Proves the onboarding path works from the built wheel alone — the
        # packaged sample vault ships, `exomem demo` has no repo dependency,
        # and `exomem setup --yes` completes — with a hard wall-time budget.
        run: uv run --frozen python scripts/time-to-value.py --budget-seconds 120

  docker:
    name: docker (lean build + smoke)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release-please--branches--main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build lean image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: lean
          load: true
          tags: exomem:pr-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: In-container demo smoke (packaged sample vault, no mounts)
        run: docker run --rm exomem:pr-smoke demo --json
      - name: HTTP boot + claude.ai discovery-route smoke (dummy OAuth env, no GitHub calls)
        run: |
          trap 'docker rm -f exomem-smoke >/dev/null 2>&1 || true' EXIT
          mkdir -p /tmp/vault
          docker run --rm -v /tmp/vault:/vault exomem:pr-smoke init --vault /vault
          docker run -d --name exomem-smoke -p 8765:8765 \
            -v /tmp/vault:/vault -e EXOMEM_VAULT_PATH=/vault \
            -e EXOMEM_BASE_URL=http://127.0.0.1:8765 \
            -e GITHUB_CLIENT_ID=dummy -e GITHUB_CLIENT_SECRET=dummy \
            -e EXOMEM_GITHUB_USERNAME=dummy -e EXOMEM_GITHUB_USER_ID=1 \
            -e EXOMEM_JWT_SIGNING_KEY=dummy \
            exomem:pr-smoke
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/mcp || true)
            [ "$code" = "401" ] && break
            sleep 1
          done
          test "$code" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/.well-known/oauth-authorization-server)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/.well-known/oauth-protected-resource)" = "200"
          docker logs exomem-smoke | tail -5
          docker stop exomem-smoke

  specs:
    name: OpenSpec validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate all OpenSpec records
        run: |
          source infra/tool-versions.env
          npm exec --yes @fission-ai/openspec@${OPENSPEC_VERSION} -- validate --all --strict
      - name: Refuse task-complete active changes
        run: python scripts/check_openspec_archive_discipline.py

  build:
    name: package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Validate public build inputs before packaging
        run: python scripts/validate-public-artifacts.py --repository
      - name: Build package
        run: uv build
      - name: Build generic standalone skill archives
        run: uv run --frozen exomem package-skills --out dist/skills
      - name: Validate unpacked build artifacts
        run: python scripts/validate-public-artifacts.py dist

  capabilities:
    name: capabilities doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Check generated capabilities doc
        run: uv run --frozen python scripts/generate-capabilities.py --check

  lint:
    name: lint + targeted types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Ruff correctness baseline (required)
        run: uvx ruff check . --select F
      - name: Full Ruff gate for new memory contracts
        run: >-
          uvx ruff check
          src/exomem/memory_refs.py
          src/exomem/observe_memory.py
          src/exomem/memory_context.py
          src/exomem/memory_schema.py
          src/exomem/relation_registry.py
          src/exomem/structure_promotion.py
          src/exomem/traversal_profiles.py
          src/exomem/epistemic_graph.py
          src/exomem/call_ledger.py
          src/exomem/call_spans.py
          src/exomem/source_taxonomy.py
          src/exomem/reclassify_source.py
          src/exomem/referent_resolution.py
          src/exomem/entity_registry.py
          src/exomem/referent_runtime.py
          src/exomem/entity_types.py
          scripts/e2e_product_loop.py
          scripts/e2e_http_server.py
          scripts/smoke-media-pipeline.py
          tests/test_memory_refs.py
          tests/test_observe_memory.py
          tests/test_memory_schema.py
          tests/test_relation_registry.py
          tests/test_structure_promotion.py
          tests/test_traversal_profiles.py
          tests/test_call_ledger.py
          tests/test_call_spans.py
          tests/test_source_taxonomy.py
          tests/test_reclassify_source.py
          tests/test_referent_resolution.py
          tests/test_entity_registry.py
          tests/test_indexes.py
          tests/test_knowledge_packs.py
          tests/test_find_referents_envelope.py
          tests/test_referent_resolution_benchmark.py
          --select E,F,I,B,UP,BLE
      - name: Targeted contract type check
        run: >-
          uvx mypy --follow-imports skip --ignore-missing-imports --check-untyped-defs
          src/exomem/memory_refs.py
          src/exomem/observe_memory.py
          src/exomem/memory_context.py
          src/exomem/memory_schema.py
          src/exomem/relation_registry.py
          src/exomem/structure_promotion.py
          src/exomem/traversal_profiles.py
          src/exomem/epistemic_graph.py
          src/exomem/source_taxonomy.py
          src/exomem/reclassify_source.py
          src/exomem/referent_resolution.py
          src/exomem/entity_registry.py
          src/exomem/referent_runtime.py
          src/exomem/entity_types.py

  gate:
    name: required CI gate
    # Surface dependency failures, but let superseded PR runs release the runner.
    if: ${{ !cancelled() }}
    needs:
      - test
      - windows-held-filesystem
      - tui
      - product-e2e
      - retrieval-quality
      - retrieval-latency
      - governance-projection-wire
      - governance-projection-wire-vector-cpu
      - semantic-write-latency
      - graph-convergence
      - onboarding
      - docker
      - specs
      - build
      - capabilities
      - lint
    runs-on: ubuntu-latest
    steps:
      - name: Require the selected CI tier to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          FULL_CI: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release-please--branches--main') }}
        run: |
          for result in $RESULTS; do
            if test "$result" = success; then
              continue
            fi
            if test "$FULL_CI" != true && test "$result" = skipped; then
              continue
            fi
            echo "unexpected CI result for full_ci=$FULL_CI: $result" >&2
            exit 1
          done
