name: CI memory probe
on:
  workflow_dispatch:
    inputs:
      junit_artifact_id:
        description: Artifact ID of the original failing JUnit report
        required: true
      source_ref:
        description: Exact source commit from the original failure
        required: true
defaults:
  run:
    working-directory: reproduction
permissions:
  contents: read
  actions: read
jobs:
  memory-prefix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: probe
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: reproduction
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record the original source identity
        run: git rev-parse HEAD
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install the normal process-isolation runtime
        timeout-minutes: 6
        run: |
          scripts/ci-apt-install.sh bubblewrap
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --new-session --die-with-parent --ro-bind / / -- /usr/bin/true
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          pyproject-file: reproduction/pyproject.toml
      - name: Install the normal older reader
        run: |
          uv venv "$RUNNER_TEMP/older-reader" --python 3.13.14
          uv pip install --python "$RUNNER_TEMP/older-reader/bin/python" "exomem==0.106.0"
          echo "EXOMEM_TEST_OLDER_READER_PYTHON=$RUNNER_TEMP/older-reader/bin/python" >> "$GITHUB_ENV"
      - name: Download the original CI report
        env:
          GH_TOKEN: ${{ github.token }}
          JUNIT_ARTIFACT_ID: ${{ inputs.junit_artifact_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$JUNIT_ARTIFACT_ID/zip" > "$RUNNER_TEMP/original-junit.zip"
      - name: Run the exact CI prefix with allocation tracing
        env:
          KB_MCP_DISABLE_EMBEDDINGS: "1"
          KB_MCP_DISABLE_MEDIA_EXTRACTION: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          EXOMEM_TEST_TIER: core
          FASTMCP_MCP_CAMELCASE_COMPAT: "false"
          PYTHONPATH: ../probe/scripts:src:tests
          PROBE_JUNIT_ZIP: ${{ runner.temp }}/original-junit.zip
          ANTHROPIC_API_KEY: ""
          ANTHROPIC_AUTH_TOKEN: ""
          OPENAI_API_KEY: ""
        run: >-
          uv run --frozen --python 3.13.14 python -m pytest -q -rA
          -p ci_memory_probe
          --session-timeout=1400
          --junitxml=test-results/memory-prefix.xml
      - name: Retain diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-prefix-junit
          path: reproduction/test-results/memory-prefix.xml
          if-no-files-found: warn
