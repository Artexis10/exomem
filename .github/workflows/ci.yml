name: CI

# Temporary discriminator only. Restore the maintained workflow before delivery.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lease-drain-discriminator:
    name: lease drain discriminator (py3.13)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KB_MCP_DISABLE_EMBEDDINGS: "1"
      KB_MCP_DISABLE_MEDIA_EXTRACTION: "1"
      EXOMEM_TEST_TIER: core
      OPENBLAS_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      FASTMCP_MCP_CAMELCASE_COMPAT: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"
      - name: Run authority grant release discriminator
        shell: bash
        run: |
          mkdir -p test-results
          set -o pipefail
          uv run --frozen --python 3.13 python -m pytest -q \
            tests/test_collection_store_runtime.py::test_close_waits_until_authority_grant_is_released \
            tests/test_collection_store_runtime.py::test_close_drains_a_guard_rejected_after_shared_grant_acquisition \
            tests/test_collection_store_runtime.py::test_authority_grant_acquisition_timeout_does_not_block_close \
            tests/test_collection_store_runtime.py::test_explicit_close_drains_authority_holders_without_owning_boundary \
            -o timeout=60 \
            --junitxml=test-results/lease-drain-discriminator.xml \
            2>&1 | tee test-results/lease-drain-discriminator.log
      - name: Upload discriminator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lease-drain-discriminator
          path: |
            test-results/lease-drain-discriminator.xml
            test-results/lease-drain-discriminator.log
          if-no-files-found: warn
