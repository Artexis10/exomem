name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      queue:
        description: Set only by the merge queue (scripts/merge_queue.py), which names the pull requests this candidate tests. Empty means a Full run
        required: false
        default: ""
        type: string

concurrency:
  group: ci-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && format('full-{0}', github.ref) || github.event.pull_request.number || github.ref }}
  # New PR and main pushes supersede feedback; dispatched and scheduled evidence finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  # The store-blind release the collection-store gate runs as an actual older
  # interpreter (tests/test_collection_store_s1_gate.py fails without it).
  EXOMEM_TEST_OLDER_READER_VERSION: "0.106.0"
  EXOMEM_TEST_OLDER_READER_SHA256: "a3d18d3abbfcf93b4831950c033197b5ca3f6aecdd89756e6359ca5b51cba626"
  # The newest release one store schema back; move it to the next one with each schema bump.
  # Each pinned release comes with its published wheel's SHA-256 (scripts/ci_install_release.py).
  EXOMEM_TEST_PREVIOUS_SCHEMA_VERSION: "0.200.0"
  EXOMEM_TEST_PREVIOUS_SCHEMA_SHA256: "722882a877da8e291e4ac46e0f1e062b467e738e49fae15c8b13378e55238111"
  # The earlier release that full runs qualify as the rollback application on a migrated store,
  # with its published wheel's SHA-256: any published release that reads the current store schema. A store schema bump empties both, because no earlier
  # release reads the new schema; the next release that ships that schema sets them again.
  EXOMEM_TEST_COMPATIBLE_APPLICATION_VERSION: ""
  EXOMEM_TEST_COMPATIBLE_APPLICATION_SHA256: ""
  # The dedicated TUI job owns this subtree; its optional conftest must not shadow lean-tier helpers.
  EXOMEM_TUI_TEST_DIRECTORY: tests/tui

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      release: ${{ steps.scope.outputs.release }}
      reconcile: ${{ steps.scope.outputs.reconcile }}
      docs_only: ${{ steps.docs-scope.outputs.docs_only }}
      pytest_args: ${{ steps.docs-scope.outputs.pytest_args }}
      changed_tests: ${{ steps.docs-scope.outputs.changed_tests }}
      python_versions: ${{ steps.docs-scope.outputs.python_versions }}
      core_matrix: ${{ steps.docs-scope.outputs.core_matrix }}
      harness_matrix: ${{ steps.docs-scope.outputs.harness_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: scope
        run: python3 scripts/release_evidence.py scope
      # A push to main skips the core and harness shards when the merge queue passed them on this tree.
      - id: queue
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/merge_queue.py tested
      - id: docs-scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL: ${{ steps.scope.outputs.full }}
          QUEUE_TESTED: ${{ steps.queue.outputs.tested }}
          # The one list of test runtimes and shard counts; the supported floor
          # (requires-python >=3.11) comes first. A pull request runs no shard,
          # only its own changed test modules plus the repository-wide guards in
          # tests/pr_guard_modules.txt: core ones on every runtime here, harness
          # ones on the floor. A push to main runs every shard on the floor; a
          # Full run runs every shard on every runtime.
          FULL_PYTHON_VERSIONS: '["3.11", "3.13"]'
          CORE_SHARDS: "24"
          HARNESS_SHARDS: "6"
        run: python3 scripts/ci_change_scope.py "unmarked test cases and empty core/harness shard jobs"

  timing-tests:
    needs: scope
    name: serial timing checks (py${{ matrix.python-version }})
    # Keep timing checks on an idle runner while every core worker pool starts.
    env: &serial-core-selections
      EXOMEM_SERIAL_CORE_MODULE: tests/test_governance_overhead.py
      EXOMEM_SERIAL_ANALYTICS_MODULE: tests/test_query_engine_analytics.py
      EXOMEM_SERIAL_GRAPH_MODULE: tests/test_graph_lane_perf.py
      # The write-burst clock guard measures its own concurrent workload, outside the worker pool.
      EXOMEM_SERIAL_SENSING_MODULE: tests/test_sensed_write_burst_probe.py
      # Real-clock attribution needs an idle process, outside the worker pool.
      EXOMEM_SERIAL_RECALL_NODE: tests/test_recall_integration.py::test_every_request_shape_attributes_its_time
    if: &not-release-pr ${{ needs.scope.outputs.release != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.scope.outputs.python_versions) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select test scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci_change_scope.py "serial timing checks on a docs-only change"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: &setup-uv-inputs
          enable-cache: true
          # v10 no longer prunes by default; keep v5's small, pruned uv cache in the shared cache budget.
          prune-cache: true
      - name: Verify lockfile is current
        run: uv lock --check
      # Workers can finish while the headroom check still reads the scheduling baseline.
      - &prepare-duration-snapshot
        name: Prepare isolated timing snapshot
        env:
          EXOMEM_DURATIONS_PATH: &duration-snapshot-path ${{ runner.temp }}/test-durations.json
        run: cp .test_durations.json "$EXOMEM_DURATIONS_PATH"
      - name: Run tests (serial timing checks)
        if: steps.scope.outputs.docs_only != 'true'
        env: &core-test-env
          KB_MCP_DISABLE_EMBEDDINGS: "1"
          KB_MCP_DISABLE_MEDIA_EXTRACTION: "1"
          # Pytest workers own CPU parallelism; avoid a native math pool per interpreter.
          OPENBLAS_NUM_THREADS: &native-math-threads "1"
          EXOMEM_DURATIONS_PATH: *duration-snapshot-path
          # Core shards read bytecode from scripts/ci-prepare-bytecode.sh's cache, outside the checkout.
          # This five-module job does not prepare one; without a cache, Python compiles in memory.
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
          PYTHONDONTWRITEBYTECODE: "1"
          EXOMEM_TEST_TIER: core
          # core-tests installs restic (scripts/ci-install-restic.sh), so its vault-backup tests fail when it is missing.
          # The cross-platform runners do not install it, and their run skips those tests with a reason.
          EXOMEM_REQUIRE_RESTIC: "1"
          FASTMCP_MCP_CAMELCASE_COMPAT: "false"
        run: >-
          uv run --frozen --python ${{ matrix.python-version }} python -m pytest -q
          "$EXOMEM_SERIAL_CORE_MODULE"
          "$EXOMEM_SERIAL_ANALYTICS_MODULE"
          "$EXOMEM_SERIAL_GRAPH_MODULE"
          "$EXOMEM_SERIAL_SENSING_MODULE"
          "$EXOMEM_SERIAL_RECALL_NODE"
          -o timeout=180
          --durations-path="$EXOMEM_DURATIONS_PATH"
          --junitxml=test-results/junit-core-${{ matrix.python-version }}-serial.xml
          ${{ needs.scope.outputs.full == 'true' && '--store-durations --clean-durations' || '' }}
      - name: Upload test timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-py${{ matrix.python-version }}-serial-junit
          # Per-run diagnostics: nothing reads them after the run, so a week is enough.
          retention-days: 7
          path: test-results/junit-core-${{ matrix.python-version }}-serial.xml
          if-no-files-found: warn
      # Clean snapshots contain only measured cases, so cached values cannot overwrite another job's evidence.
      - name: Upload refreshed test durations
        if: needs.scope.outputs.full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-durations-core-py${{ matrix.python-version }}-serial
          path: *duration-snapshot-path

  # The PR suite runs as two independently sharded tiers so each job stays
  # bounded while four workers use each runner's four vCPUs. `core-tests` is the
  # suite minus the benchmark-harness modules minus the nightly-owned
  # tests/test_latency_gate.py; `harness-tests` is exactly the modules in
  # tests/harness_modules.txt (benchmark-package importers, generated by
  # scripts/generate_harness_modules.py). The scope job builds both matrices:
  # a pull request runs only its own changed test modules and the guard modules
  # in tests/pr_guard_modules.txt, and main pushes and Full runs run every shard.
  # The split moves no coverage. Tier selection is
  # EXOMEM_TEST_TIER, applied by tests/conftest.py; tests/test_ci_reliability_contract.py proves the two
  # tiers plus the latency file partition the previous lean suite exactly.
  # The 180-second per-test limit leaves room for CPU sharing. Disable worker
  # replacement because scheduler recovery previously stalled after a crash.
  core-tests:
    needs: scope
    name: core tests (py${{ matrix.python-version }}, ${{ matrix.selection || format('shard {0}/{1}', matrix.shard, matrix.splits) }})
    env: *serial-core-selections
    # The release PR runs no test job: `release-evidence` requires a green
    # full run at its base revision and refuses a release PR that changes
    # anything release-please does not manage. Lint, build (packages, Cloud
    # archives, privacy), specs, capabilities and the wheel onboarding gate,
    # which runs the packaged demo, still run.
    # An empty matrix is a pull request with no core module to run.
    if: ${{ needs.scope.outputs.release != 'true' && needs.scope.outputs.core_matrix != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The scope job (scripts/ci_change_scope.py) picks runtimes, shards and changed-test groups.
        # Each entry's shard matches its splits. Separate runners keep process, port,
        # filesystem, and mutation-lock state isolated while cutting the serial critical path.
        include: ${{ fromJSON(needs.scope.outputs.core_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Benchmark contract receipts are verified against their complete
          # introduction/amendment ancestry. A shallow PR merge checkout
          # cannot prove that history and must not silently weaken the gate.
          fetch-depth: 0
      - name: Install pinned Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install process-isolation runtime
        # The helper separates download and installation deadlines. This cap
        # covers its update retries, backoffs, and kill grace with margin.
        timeout-minutes: 9
        run: |
          scripts/ci-apt-install.sh bubblewrap
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --new-session --die-with-parent \
            --ro-bind / / -- /usr/bin/true
      - name: Restore the age release archive
        # GitHub release downloads failed in most core shards on 2026-11-08.
        # Keyed on the script, which pins the version and checksum.
        uses: actions/cache@v4
        with: &age-archive-cache
          path: ${{ runner.temp }}/age-archive
          key: age-archive-${{ hashFiles('scripts/ci-install-age.sh') }}
      - name: Install age encryption tools
        # The protected-import suite skips without the real age and age-keygen.
        # The script bounds its download retries at three minutes.
        timeout-minutes: 5
        run: scripts/ci-install-age.sh
      - name: Restore the restic release archive
        # Keyed on the script; the archive name carries the version that the Dockerfile pins.
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/restic-archive
          key: restic-archive-${{ hashFiles('scripts/ci-install-restic.sh') }}
      - name: Install restic
        # The personal vault backup tests fail in CI without the real restic.
        # The script bounds its download retries at three minutes.
        timeout-minutes: 5
        run: scripts/ci-install-restic.sh
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: *setup-uv-inputs
      - name: Verify lockfile is current
        run: uv lock --check
      - name: Install the pinned older readers for the collection-store gate
        timeout-minutes: 5
        run: |
          uv run --no-project --python 3.13 scripts/ci_install_release.py "$EXOMEM_TEST_OLDER_READER_VERSION" \
            "$RUNNER_TEMP/older-reader" "$EXOMEM_TEST_OLDER_READER_SHA256" EXOMEM_TEST_OLDER_READER_PYTHON
          uv run --no-project --python 3.13 scripts/ci_install_release.py "$EXOMEM_TEST_PREVIOUS_SCHEMA_VERSION" \
            "$RUNNER_TEMP/previous-schema" "$EXOMEM_TEST_PREVIOUS_SCHEMA_SHA256" EXOMEM_TEST_PREVIOUS_SCHEMA_PYTHON
      - *prepare-duration-snapshot
      - name: Prepare shared bytecode
        # About a minute on a healthy runner; the cache never decides which tests run.
        timeout-minutes: 5
        env: *core-test-env
        run: scripts/ci-prepare-bytecode.sh ${{ matrix.python-version }}
      - name: Select the pull request's own test modules
        # The appended --changed-tests makes tests/conftest.py ignore every other module; the
        # tier and --ignore rules still apply to these, and exit 5 means none of them belongs to this job.
        if: matrix.selection
        env:
          CHANGED_TESTS: ${{ needs.scope.outputs.changed_tests }}
        run: echo "EXOMEM_CHANGED_TESTS=$CHANGED_TESTS" >> "$GITHUB_ENV"
      - name: Run tests (core tier — BM25/keyword, server media extraction off)
        env: *core-test-env
        # Full runs replace the scratch snapshot with measured cases and upload it.
        # Refreshing the baseline stays a reviewed change through scripts/refresh_test_durations.py.
        # Preserve thread stacks before a worker timeout can discard them.
        # Each disposable runner owns this shallow root, which keeps xdist within the calibrated filesystem-call budget.
        run: >-
          uv run --frozen --python ${{ matrix.python-version }} python -m pytest -q
          --basetemp=/tmp/exomem-pytest
          --splits=${{ matrix.splits }}
          -n 4
          --dist loadfile
          --max-worker-restart=0
          -o timeout=180
          --ignore="$EXOMEM_TUI_TEST_DIRECTORY"
          --ignore="$EXOMEM_SERIAL_CORE_MODULE"
          --ignore="$EXOMEM_SERIAL_ANALYTICS_MODULE"
          --ignore="$EXOMEM_SERIAL_GRAPH_MODULE"
          --ignore="$EXOMEM_SERIAL_SENSING_MODULE"
          --deselect="$EXOMEM_SERIAL_RECALL_NODE"
          --group=${{ matrix.shard }}
          --splitting-algorithm=least_duration
          --durations-path="$EXOMEM_DURATIONS_PATH"
          -o faulthandler_timeout=150
          --session-timeout=1400
          --durations=50
          --durations-min=1
          --junitxml=test-results/junit-core-${{ matrix.python-version }}-shard-${{ matrix.shard }}.xml
          ${{ needs.scope.outputs.pytest_args }}
          ${{ needs.scope.outputs.full == 'true' && '--store-durations --clean-durations' || '' }}
          ${{ matrix.selection && '--changed-tests="$EXOMEM_CHANGED_TESTS" || test $? -eq 5' || '' }}
      - name: Upload test timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-py${{ matrix.python-version }}-shard-${{ matrix.shard }}-junit
          # Per-run diagnostics: nothing reads them after the run, so a week is enough.
          retention-days: 7
          path: test-results/junit-core-${{ matrix.python-version }}-shard-${{ matrix.shard }}*.xml
          if-no-files-found: warn
      - name: Upload refreshed test durations
        if: needs.scope.outputs.full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-durations-core-py${{ matrix.python-version }}-shard-${{ matrix.shard }}
          path: *duration-snapshot-path
      - name: Sample vault smoke (the exact command users run)
        if: matrix.shard == 1
        run: uv run --frozen --python ${{ matrix.python-version }} exomem demo --json

  recall-structural-reference:
    needs: scope
    name: structural recall (system SQLite)
    if: *not-release-pr
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_NO_MANAGED_PYTHON: "true"
      UV_PYTHON_DOWNLOADS: never
      OPENBLAS_NUM_THREADS: *native-math-threads
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select test scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci_change_scope.py "structural recall on a docs-only change"
      - name: Install uv
        if: steps.scope.outputs.docs_only != 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: *setup-uv-inputs
      - name: Verify reference interpreter and SQLite
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          /usr/bin/python3.12 -c 'import platform, sqlite3; print(platform.python_version(), sqlite3.sqlite_version); assert sqlite3.sqlite_version == "3.45.1"'
          uv run --frozen --python /usr/bin/python3.12 python -c 'import platform, sqlite3, sys; print(sys.executable, platform.python_version(), sqlite3.sqlite_version); assert sqlite3.sqlite_version == "3.45.1"'
      - name: Run structural recall gate
        if: steps.scope.outputs.docs_only != 'true'
        run: >-
          uv run --frozen --python /usr/bin/python3.12 python -m pytest -q -s
          tests/test_ranking_catalogue_metadata.py::test_public_recall_work_does_not_scale_with_unrelated_pages
          -o timeout=600 --session-timeout=720
          --junitxml=test-results/recall-structural-reference.xml
      - name: Upload structural recall evidence
        if: always() && steps.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: recall-structural-reference
          # Per-run diagnostics: nothing reads them after the run, so a week is enough.
          retention-days: 7
          path: test-results/recall-structural-reference.xml
          if-no-files-found: warn

  harness-tests:
    needs: scope
    name: harness tests (py${{ matrix.python-version }}, ${{ matrix.selection || format('shard {0}/{1}', matrix.shard, matrix.splits) }})
    # An empty matrix is a pull request with no harness module to run.
    if: ${{ needs.scope.outputs.release != 'true' && needs.scope.outputs.harness_matrix != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The scope job picks runtimes, shards and changed-test groups; each shard matches its splits.
        include: ${{ fromJSON(needs.scope.outputs.harness_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Benchmark contract receipts are verified against their complete
          # introduction/amendment ancestry — this tier is where those tests
          # live, so the full history is non-negotiable here.
          fetch-depth: 0
      - name: Install pinned Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install process-isolation runtime
        # The shared helper bounds download and installation separately.
        timeout-minutes: 9
        run: |
          scripts/ci-apt-install.sh bubblewrap
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --new-session --die-with-parent \
            --ro-bind / / -- /usr/bin/true
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: *setup-uv-inputs
      - name: Verify lockfile is current
        run: uv lock --check
      - name: Prepare bytecode for installed hook commands
        # Editable source lives outside site-packages; prepare both with the test interpreter.
        run: >-
          uv run --frozen --compile-bytecode --python ${{ matrix.python-version }}
          python -m compileall -q src/exomem
      - *prepare-duration-snapshot
      - name: Select the pull request's own test modules
        # As in core-tests: --changed-tests keeps only these modules, and exit 5 means none is harness.
        if: matrix.selection
        env:
          CHANGED_TESTS: ${{ needs.scope.outputs.changed_tests }}
        run: echo "EXOMEM_CHANGED_TESTS=$CHANGED_TESTS" >> "$GITHUB_ENV"
      - name: Run tests (harness tier — benchmark-importing modules)
        env:
          KB_MCP_DISABLE_EMBEDDINGS: "1"
          KB_MCP_DISABLE_MEDIA_EXTRACTION: "1"
          OPENBLAS_NUM_THREADS: *native-math-threads
          EXOMEM_DURATIONS_PATH: *duration-snapshot-path
          PYTHONDONTWRITEBYTECODE: "1"
          EXOMEM_TEST_TIER: harness
          FASTMCP_MCP_CAMELCASE_COMPAT: "false"
        # Contiguous chunks keep most cached fixture consumers on one runner.
        # Six chunks retain 1.5x predicted headroom within the 900-second cap.
        run: >-
          uv run --frozen --python ${{ matrix.python-version }} python -m pytest -q
          --splits=${{ matrix.splits }}
          -n 4
          --dist loadfile
          --max-worker-restart=0
          -o timeout=180
          --ignore="$EXOMEM_TUI_TEST_DIRECTORY"
          --group=${{ matrix.shard }}
          --splitting-algorithm=duration_based_chunks
          --durations-path="$EXOMEM_DURATIONS_PATH"
          --session-timeout=900
          --durations=50
          --durations-min=1
          --junitxml=test-results/junit-harness-${{ matrix.python-version }}-shard-${{ matrix.shard }}.xml
          ${{ needs.scope.outputs.pytest_args }}
          ${{ needs.scope.outputs.full == 'true' && '--store-durations --clean-durations' || '' }}
          ${{ matrix.selection && '--changed-tests="$EXOMEM_CHANGED_TESTS" || test $? -eq 5' || '' }}
      - name: Upload test timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-py${{ matrix.python-version }}-shard-${{ matrix.shard }}-junit
          # Per-run diagnostics: nothing reads them after the run, so a week is enough.
          retention-days: 7
          path: test-results/junit-harness-${{ matrix.python-version }}-shard-${{ matrix.shard }}.xml
          if-no-files-found: warn
      - name: Upload refreshed test durations
        if: needs.scope.outputs.full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-durations-harness-py${{ matrix.python-version }}-shard-${{ matrix.shard }}
          path: *duration-snapshot-path

  windows-held-filesystem:
    needs: scope
    name: Windows held filesystem (native NTFS)
    if: *not-release-pr
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: *setup-uv-inputs
      - name: Verify lockfile is current
        run: uv lock --check
      - name: Require NTFS and 8.3 aliases
        shell: pwsh
        run: |
          $drive = (Get-Item $env:GITHUB_WORKSPACE).PSDrive.Name
          $volume = Get-Volume -DriveLetter $drive
          if ($volume.FileSystem -ne "NTFS") {
            throw "held-filesystem verification requires NTFS"
          }
          $writableNtfs = @()
          foreach ($candidate in Get-Volume | Where-Object { $_.DriveLetter -and $_.FileSystem -eq "NTFS" }) {
            $probe = "$($candidate.DriveLetter):\exomem-held-volume-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            try {
              New-Item -ItemType Directory -Path $probe -ErrorAction Stop | Out-Null
              Remove-Item -LiteralPath $probe -Force -ErrorAction Stop
              $writableNtfs += $candidate.DriveLetter
            } catch {
              # The native test will report which volume was unavailable.
            }
          }
          if (@($writableNtfs | Sort-Object -Unique).Count -lt 2) {
            throw "held-filesystem verification requires at least two writable NTFS volumes"
          }
          fsutil.exe 8dot3name set "$drive`:" 0
          if ($LASTEXITCODE -ne 0) {
            throw "failed to enable per-volume 8.3 alias creation"
          }
          fsutil.exe 8dot3name query "$drive`:"
          if ($LASTEXITCODE -ne 0) {
            throw "failed to verify per-volume 8.3 alias creation"
          }
      - name: Native held-filesystem gate
        env:
          KB_MCP_DISABLE_EMBEDDINGS: "1"
          KB_MCP_DISABLE_MEDIA_EXTRACTION: "1"
          EXOMEM_DISABLE_CLIP: "1"
          # The service fixture must not start model loading or cache warmup.
          EXOMEM_DISABLE_EMBEDDINGS: "1"
          EXOMEM_DISABLE_WARMUP: "1"
          EXOMEM_WRITER_LEASE_STATE_DIR: ${{ runner.temp }}\exomem-reserved-state
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          uv run --frozen --python 3.13 python -m pytest -q
