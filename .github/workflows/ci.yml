  release-evidence:
    needs: scope
    name: release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Release metadata validates its source; every other context succeeds here
    # while the selected ordinary and Full jobs supply their own evidence.
    steps:
      - name: Report the selected source scope
        if: needs.scope.outputs.release != 'true'
        env:
          FULL_CI: ${{ needs.scope.outputs.full }}
        run: echo "Full source scope is $FULL_CI"
      - name: Check out the release checker at the release base
        # The base revision, so a release PR cannot edit its own check.
        if: needs.scope.outputs.release == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: |
            scripts/check_release_pr_files.py
            scripts/release_evidence.py
            release-please-config.json
          sparse-checkout-cone-mode: false
      - name: Require that the release PR changes only what release-please writes
        # The release PR runs no test job, which is sound only while its diff
        # is release-please's own work (scripts/check_release_pr_files.py).
        # `shell: bash` adds pipefail; a failed API call must refuse.
        if: needs.scope.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if test "$HEAD_REPO" != "$GH_REPO"; then
            echo "a release PR must come from $GH_REPO, not $HEAD_REPO" >&2
            exit 1
          fi
          gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files" --jq '.[] | tojson' \
            > "$RUNNER_TEMP/pr-files.jsonl"
          python3 scripts/check_release_pr_files.py release-please-config.json "$RUNNER_TEMP/pr-files.jsonl"
      - name: Require complete Full evidence for the release source tree
        if: needs.scope.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/release_evidence.py select --source "$BASE_SHA"

  # A dispatched or scheduled full run is a superset of the push run at the
  # same revision: the same jobs plus the full tier and py3.13. The push run is
  # cancelled so the same proof does not take the shared job slots twice.
  # Best effort: an API error must not turn the full run's evidence red.
  cancel-superseded-push-run:
    needs: scope
    name: cancel the push run this full run supersedes
    if: ${{ needs.scope.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Cancel unfinished push runs of this workflow at this revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          runs=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?event=push&head_sha=$GITHUB_SHA&per_page=20" \
            --jq ".workflow_runs[] | select(.event == \"push\" and .head_sha == \"$GITHUB_SHA\" and .status != \"completed\" and .id != $GITHUB_RUN_ID) | .id")
          for run in $runs; do
            gh run cancel "$run" && echo "cancelled push run $run at $GITHUB_SHA" ||
              echo "push run $run was not cancelled; it may have finished"
          done

  # Engineering-practices quality check (https://github.com/Artexis10/engineering-practices):
  # fails on dead code a pull request adds and posts the Quality report. It informs
  # review and is deliberately outside the required CI gate below.
  quality:
    if: ${{ github.event_name == 'pull_request' && !cancelled() && needs.scope.result == 'success' }}
    # The test jobs named in .github/quality.yml, so their runtime is known.
    needs: [scope, timing-tests, core-tests, recall-structural-reference, harness-tests, windows-held-filesystem, tui, product-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: quality-${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Artexis10/engineering-practices@v1

  gate:
    name: required CI gate
    # Surface dependency failures, but let superseded PR runs release the runner.
    if: ${{ !cancelled() }}
    needs:
      - scope
      - release-evidence
      - timing-tests
      - core-tests
      - recall-structural-reference
      - harness-tests
      - windows-held-filesystem
      - tui
      - product-e2e
      - frozen-verifier
      - cloud-cellctl
      - retrieval-quality
      - retrieval-latency
      - recall-latency-series
      - recall-latency-paired
      - recall-latency-aggregate
      - governance-projection-wire
      - governance-projection-wire-vector-cpu
      - semantic-write-latency
      - graph-convergence
      - onboarding
      - docker
      - specs
      - build
      - capabilities
      - lint
    runs-on: ubuntu-latest
    steps:
      - name: Require the selected CI tier to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          FULL_CI: ${{ needs.scope.outputs.full == 'true' }}
        run: |
          failures=$(jq -r --argjson full_ci "$FULL_CI" '
            to_entries[]
            | select(.value.result != "success" and ($full_ci or .value.result != "skipped"))
            | "CI dependency \(.key) returned \(.value.result)"
          ' <<< "$RESULTS")
          if test -n "$failures"; then
            printf '%s\n' "$failures" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        if: needs.scope.outputs.full == 'true'
        with:
          fetch-depth: 2
      - name: Record the actual checkout after the Full gate passes
        if: needs.scope.outputs.full == 'true'
        run: python3 scripts/release_evidence.py record --output full-ci-evidence.json
      - name: Retain immutable Full evidence for this run and attempt
        if: needs.scope.outputs.full == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: full-ci-evidence.json
          if-no-files-found: error
          retention-days: 90

  # A full run that release-evidence-automation.yml dispatched with
  # GITHUB_TOKEN raises no workflow_run event when it completes, so the full
  # run signals its own evidence: after its gate passes it dispatches that
  # workflow, which waits for this run's recorded completion and then re-runs
  # the waiting release PR's failed checks. Known bound: a release PR run still
  # in progress then has nothing to re-run; the PR tier normally finishes well
  # inside the full tier's duration.
  release-evidence-landed:
    name: signal release evidence landed
    needs: gate
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the release check re-run for this evidence run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVIDENCE_RUN: ${{ github.run_id }}
          EVIDENCE_ATTEMPT: ${{ github.run_attempt }}
        run: gh workflow run release-evidence-automation.yml --ref main -f evidence_run="$EVIDENCE_RUN" -f evidence_attempt="$EVIDENCE_ATTEMPT"
