name: CI

# Disposable hosted regression proof; this branch never merges.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-mixed-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KB_MCP_DISABLE_EMBEDDINGS: "1"
      KB_MCP_DISABLE_MEDIA_EXTRACTION: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      EXOMEM_TEST_TIER: core
      EXOMEM_TUI_TEST_DIRECTORY: tests/tui
      FASTMCP_MCP_CAMELCASE_COMPAT: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6838bf7967976fcfd3f95adc48d1d66920cfe81b
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"
          enable-cache: true
      - name: Exercise finite mixed recall and existing unit behavior
        run: >-
          uv run --frozen --python 3.13 python -m pytest -q
          tests/test_semantic_unit_recall.py -o timeout=180
          --junitxml=${{ runner.temp }}/finite-mixed-head.xml
      - name: Verify the released baseline exposes the same finite completeness defect
        shell: bash
        run: |
          baseline="$RUNNER_TEMP/finite-mixed-baseline"
          git worktree add --detach "$baseline" 9432ea367192e8833d6dc5aef1ffb2b463ed4d8a
          cp tests/test_semantic_unit_recall.py "$baseline/tests/test_semantic_unit_recall.py"
          set +e
          PYTHONPATH="$baseline/src" "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest -q "$baseline/tests/test_semantic_unit_recall.py::test_hybrid_mixed_recall_fills_finite_demand_without_a_candidate_window_warning" -o timeout=180 --junitxml="$RUNNER_TEMP/finite-mixed-baseline.xml"
          result=$?
          set -e
          test "$result" -eq 1
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse(Path(os.environ["RUNNER_TEMP"]) / "finite-mixed-baseline.xml").getroot()
          cases = list(root.iter("testcase"))
          assert len(cases) == 1
          failure = cases[0].find("failure")
          assert failure is not None and failure.attrib["message"].startswith("AssertionError")
          assert "semantic_units_candidate_window" in (failure.text or "")
          assert not list(root.iter("error"))
          print("The released baseline fails on the finite completeness assertion.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finite-mixed-regression
          path: ${{ runner.temp }}/finite-mixed-*.xml
          if-no-files-found: warn
