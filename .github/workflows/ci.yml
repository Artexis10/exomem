# Disposable hosted proof; never merge this branch.
name: CI
'on':
  workflow_dispatch: null
permissions:
  contents: read
env:
  EXOMEM_TEST_OLDER_READER_VERSION: 0.106.0
  EXOMEM_TEST_PREVIOUS_SCHEMA_VERSION: 0.127.5
  EXOMEM_TUI_TEST_DIRECTORY: tests/tui
jobs:
  canonical-paired-report:
    name: recall latency paired (keyword)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - name: Record paired workload start
      run: date +%s > "$RUNNER_TEMP/recall-latency-job-start"
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: 106649bfb1f46e8ec0b5cb47e41f3c47225a2d26
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Resolve the served encoder digest
      id: recall-encoder
      env:
        UV_PYTHON: /usr/bin/python3
        UV_PYTHON_DOWNLOADS: never
      run: uv run --frozen --group recall-benchmark python scripts/recall_latency_gate.py
        --encoder-cache-key >> "$GITHUB_OUTPUT"
    - name: Cache the served encoder by digest
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: recall-encoder-${{ runner.os }}-${{ steps.recall-encoder.outputs.digest
          }}
    - name: Verify the latency instrument
      env:
        UV_PYTHON: /usr/bin/python3
        UV_PYTHON_DOWNLOADS: never
      run: uv run --frozen --group recall-benchmark python -m pytest tests/test_recall_latency_gate.py
        tests/test_recall_timing.py -q
    - name: Compare governed recall with the latest release
      timeout-minutes: 40
      env:
        GH_TOKEN: ${{ github.token }}
        SERIES: keyword
        UV_PYTHON: /usr/bin/python3
        UV_PYTHON_DOWNLOADS: never
      run: uv run --frozen --group recall-benchmark python scripts/recall_latency_gate.py
        --paired --series "$SERIES" --output "recall-latency-paired-$SERIES.json"
    - name: Record elapsed paired workload
      if: always()
      env:
        JOB_TIMEOUT_MINUTES: 45
      run: python3 -c 'import json,os,pathlib,time; start=int((pathlib.Path(os.environ["RUNNER_TEMP"])/"recall-latency-job-start").read_text());
        pathlib.Path("recall-latency-job-elapsed.json").write_text(json.dumps({"boundary":"first-step-to-pre-upload-timer","elapsed_seconds":time.time()-start,"job_budget_seconds":60*int(os.environ["JOB_TIMEOUT_MINUTES"])}))'
    - name: Upload paired recall evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: recall-latency-paired-keyword
        path: 'recall-latency-paired-keyword.json

          recall-latency-job-elapsed.json

          '
        if-no-files-found: warn
