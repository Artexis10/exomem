name: CI

# Disposable hosted preparation proof; this branch never merges.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recall-worker-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_PYTHON: /usr/bin/python3
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7e0c1d41c536bb455c5d258000c43be70084115b
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"
          enable-cache: true
      - name: Resolve the encoder digest
        id: encoder
        run: uv run --frozen --group recall-benchmark python scripts/recall_latency_gate.py --encoder-cache-key >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: recall-encoder-${{ runner.os }}-${{ steps.encoder.outputs.digest }}
      - name: Diagnose unit and mixed classification on the actual reference
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          uv run --frozen --group recall-benchmark python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import tempfile
          import textwrap
          import hashlib
          from pathlib import Path

          script = Path.cwd() / "scripts" / "recall_latency_gate.py"
          original = script.read_text()
          overlay = textwrap.dedent(r'''
          import ast

          class _ClassificationOverlay(ast.NodeTransformer):
              matches = 0

              def visit_FunctionDef(self, node):
                  if node.name == "_worker_sample":
                      statement = node.body[-1]
                      assert isinstance(statement, ast.Return) and isinstance(statement.value, ast.Dict)
                      statement.value.keys.append(ast.Constant("diagnostic"))
                      # These are public producer fields and a closed failure token, not query text.
                      statement.value.values.append(ast.parse("""{
                          'failed_stage': failed_stage,
                          'has_degraded': bool(isinstance(result, dict) and result.get('degraded')),
                          'candidate_window_degraded': bool(isinstance(result, dict) and 'semantic_units_candidate_window' in (result.get('degraded') or ())),
                          'has_warming': bool(isinstance(result, dict) and 'warming' in result),
                          'collector_count': len(collectors),
                          'interval_count': len(trace.intervals),
                          'public_error_entries': sum(bool(stage.get('error')) for stage in ((result.get('timings') or {}).get('stages', {}).values() if isinstance(result, dict) else ())),
                          'collector_error_entries': sum(bool(stage.get('error')) for collector in collectors for stage in collector.stages.values()),
                          'unmapped_error_entries': sum(bool(stage.get('error')) and not any(name in producers for producers in REFERENCE['stage_rows'].values()) for collector in collectors for name, stage in collector.stages.items()),
                          'canonical_error_rows': [row for row, producers in REFERENCE['stage_rows'].items() if any(collector.stages.get(name, {}).get('error') for collector in collectors for name in producers)]
                      }""", mode="eval").body)
                      self.matches += 1
                  return node

          _classification_tree = ast.parse(_classification_source, filename=__file__)
          _classification_transformer = _ClassificationOverlay()
          _classification_tree = _classification_transformer.visit(_classification_tree)
          assert _classification_transformer.matches == 1
          exec(compile(ast.fix_missing_locations(_classification_tree), __file__, "exec"), globals())
          ''')
          wrapper = "_classification_source = " + repr(original) + "\n" + overlay
          script.write_text(wrapper)
          sys.path.insert(0, str(Path.cwd() / "scripts"))
          import recall_latency_gate as gate

          report = {"state": "failed", "mode": "unit-mixed-diagnostic", "timings": "diagnostic warm-up only; not qualified", "source": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                    "diagnostic_overlay": "classification-metadata-only", "instrument_sha256": hashlib.sha256(original.encode()).hexdigest(), "overlay_sha256": hashlib.sha256(wrapper.encode()).hexdigest()}
          workers = {}
          try:
              profile = json.loads((gate.BENCHMARK / "profile.json").read_text())
              cases, _ = gate.reference_cases(profile)
              tag = subprocess.check_output(["gh", "release", "view", "--json", "tagName", "--jq", ".tagName"], text=True).strip()
              report["tag"] = tag
              cpus = sorted(os.sched_getaffinity(0))[:gate.REFERENCE["reference_cpus"]]
              if len(cpus) != gate.REFERENCE["reference_cpus"]:
                  raise gate.MeasurementRefused("two-cpu-reference-unavailable")
              with tempfile.TemporaryDirectory(prefix="recall-worker-preflight-") as directory:
                  scratch = Path(directory)
                  base = scratch / "base"
                  base.mkdir()
                  archive = scratch / "release.tar"
                  with archive.open("wb") as stream:
                      subprocess.run(["git", "archive", tag], stdout=stream, check=True)
                  subprocess.run(["tar", "-xf", str(archive), "-C", str(base)], check=True)
                  python = gate._prepare_tag_runtime(base, scratch)
                  try:
                      for arm, source in (("head", gate.ROOT), ("base", base)):
                          runtime = ({"python": python, "runtime_prefix": python.parent.parent, "runtime_policy": "frozen-tag-runtime"} if arm == "base" else {})
                          workers[arm] = gate._Worker(source, scratch / "vault", scratch / arm, cpus, profile, **runtime)
                          report.setdefault("environment", {})[arm] = workers[arm].environment
                      head, base_environment = (report["environment"][arm] for arm in ("head", "base"))
                      for field in ("encoder_digest", "encoder_identity", "corpus", "sqlite_version"):
                          if head[field] != base_environment[field]:
                              raise gate.MeasurementRefused("paired-reference-inputs-differ")
                      if head["sqlite_version"] not in profile["sqlite_versions"]:
                          raise gate.MeasurementRefused("reference-sqlite-unsupported")
                      first_cases = {case["series"]: case for case in reversed(cases)}
                      report["warm_calls"] = []
                      for arm, worker in (("head", workers["head"]),):
                          try:
                              # Replay the observed shapes to separate first-use cost from persistent work.
                              for repeat in range(3):
                                  for case in (first_cases["unit"], first_cases["mixed"]):
                                      principal = "owner"
                                      result = worker.exchange({**case, "principal": principal, "rows": gate.REFERENCE["stage_rows"]})
                                      report["warm_calls"].append({"arm": arm, "principal": principal, "case": case["id"], "series": case["series"], "repeat": repeat, **result})
                          finally:
                              worker.pause()
                      report["state"] = "failed" if any(row["state"] != "ok" for row in report["warm_calls"]) else "observed"
                  finally:
                      for worker in workers.values():
                          worker.close()
          except Exception as error:
              report["reason"] = error.code if isinstance(error, gate.MeasurementRefused) else type(error).__name__
              report["phase"] = getattr(error, "phase", None)
          finally:
              Path("recall-bootstrap-result.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          raise SystemExit(report["state"] == "failed")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recall-worker-preflight
          path: recall-bootstrap-result.json
          if-no-files-found: warn
