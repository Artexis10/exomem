name: CI

# Disposable hosted preparation proof; this branch never merges.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recall-worker-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_PYTHON: /usr/bin/python3
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7e0c1d41c536bb455c5d258000c43be70084115b
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"
          enable-cache: true
      - name: Resolve the encoder digest
        id: encoder
        run: uv run --frozen --group recall-benchmark python scripts/recall_latency_gate.py --encoder-cache-key >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: recall-encoder-${{ runner.os }}-${{ steps.encoder.outputs.digest }}
      - name: Compare the direct leaf with the maintained bound command
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          uv run --frozen --group recall-benchmark python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import tempfile
          import hashlib
          from pathlib import Path

          script = Path.cwd() / "scripts" / "recall_latency_gate.py"
          original = script.read_text()
          helper = r'''
          import inspect
          import threading

          _counter_original_sample = _worker_sample

          def _counter_sample(vault_root, request):
              from exomem import artifact_role_state, command_surface, commands, find_corpus
              from exomem.governance import egress, lifecycle
              from exomem.collection_store import ownership
              request_thread = threading.get_ident()
              observed = {}
              lock = threading.Lock()
              active = True
              def wrap(name, original):
                  def measured(*args, **kwargs):
                      nonlocal active
                      thread = threading.get_ident()
                      variant = (kwargs.get("content") is not None) if name in ("parse_page", "_parse_page_after_checkpoint") else None
                      key = (name, thread, variant)
                      started = time.perf_counter_ns()
                      with lock:
                          row = observed.get(key)
                          if row is None:
                              stack = []
                              frame = inspect.currentframe().f_back
                              while frame is not None and len(stack) < 12:
                                  module = frame.f_globals.get("__name__", "")
                                  if module.startswith("exomem."):
                                      stack.append({"module": module, "function": frame.f_code.co_name, "line": frame.f_lineno})
                                  frame = frame.f_back
                              del frame
                              row = {"boundary": name, "thread_id": thread, "request_thread": thread == request_thread,
                                     "content_supplied": variant, "ownership_active": ownership._READ.get() is not None, "started": 0, "completed": 0,
                                     "completed_ns": 0, "stack": stack}
                              observed[key] = row
                          row["started"] += 1
                      try:
                          return original(*args, **kwargs)
                      finally:
                          ended = time.perf_counter_ns()
                          with lock:
                              if active:
                                  row["completed"] += 1
                                  row["completed_ns"] += ended - started
                  return measured
              # Closed application symbols define this disposable diagnostic's boundaries.
              targets = ((find_corpus, "parse_page"), (find_corpus, "_parse_page_after_checkpoint"), (artifact_role_state, "_state"),
                         (egress, "_decide_path"), (lifecycle, "_tombstone_generation"))
              originals = [(module, name, getattr(module, name)) for module, name in targets]
              for module, name, original in originals:
                  setattr(module, name, wrap(name, original))
              original_ask = commands.op_ask_memory
              if request.get("diagnostic_dispatcher"):
                  ask_command = next(command for command in commands.PRODUCT_COMMANDS if command.name == "ask_memory")
                  bound = command_surface.bind_vault(ask_command.leaf, vault_root, command=ask_command)
                  def dispatched(_vault_root, **kwargs):
                      return bound(**kwargs)
                  commands.op_ask_memory = dispatched
              try:
                  result = _counter_original_sample(vault_root, request)
              finally:
                  commands.op_ask_memory = original_ask
                  with lock:
                      active = False
                      rows = [{**row, "pending": row["started"] - row["completed"]} for row in observed.values()]
                  for module, name, original in originals:
                      setattr(module, name, original)
              result["boundary_observations"] = {"request_thread_id": request_thread,
                  "scope": "actual thread IDs; completed intervals only; counters add overhead; diagnostic only",
                  "rows": rows}
              return result

          _worker_sample = _counter_sample
          '''
          overlay = "import ast\n_profile_helper = " + repr(helper) + "\n_profile_tree = ast.parse(_profile_source, filename=__file__)\nassert isinstance(_profile_tree.body[-1], ast.If)\n_profile_tree.body[-1:-1] = ast.parse(_profile_helper).body\nexec(compile(ast.fix_missing_locations(_profile_tree), __file__, 'exec'), globals())\n"
          wrapper = "_profile_source = " + repr(original) + "\n" + overlay
          script.write_text(wrapper)
          sys.path.insert(0, str(Path.cwd() / "scripts"))
          import recall_latency_gate as gate

          report = {"state": "failed", "mode": "thread-qualified-bound-command", "timings": "counter-wrapped diagnostic only; not qualified", "source": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(), "diagnostic_overlay": "thread-qualified-boundary-counters-and-declared-bound-command-comparison", "instrument_sha256": hashlib.sha256(original.encode()).hexdigest(), "overlay_sha256": hashlib.sha256(wrapper.encode()).hexdigest()}
          workers = {}
          try:
              profile = json.loads((gate.BENCHMARK / "profile.json").read_text())
              cases, _ = gate.reference_cases(profile)
              tag = subprocess.check_output(["gh", "release", "view", "--json", "tagName", "--jq", ".tagName"], text=True).strip()
              report["tag"] = tag
              cpus = sorted(os.sched_getaffinity(0))[:gate.REFERENCE["reference_cpus"]]
              if len(cpus) != gate.REFERENCE["reference_cpus"]:
                  raise gate.MeasurementRefused("two-cpu-reference-unavailable")
              with tempfile.TemporaryDirectory(prefix="recall-worker-preflight-") as directory:
                  scratch = Path(directory)
                  try:
                      for arm, source in (("head", gate.ROOT),):
                          workers[arm] = gate._Worker(source, scratch / "vault", scratch / arm, cpus, profile)
                          report.setdefault("environment", {})[arm] = workers[arm].environment
                      head = report["environment"]["head"]
                      if head["sqlite_version"] not in profile["sqlite_versions"]:
                          raise gate.MeasurementRefused("reference-sqlite-unsupported")
                      first_cases = {case["series"]: case for case in reversed(cases)}
                      report["warm_calls"] = []
                      for arm, worker in (("head", workers["head"]),):
                          try:
                              for principal in ("owner",):
                                  case = first_cases["unit"]
                                  for ordinal, dispatched in enumerate((False, False, True, True)):
                                      request = {**case, "principal": principal, "rows": gate.REFERENCE["stage_rows"], "diagnostic_dispatcher": dispatched}
                                      result = worker.exchange(request)
                                      report["warm_calls"].append({"ordinal": ordinal, "bound_command": dispatched, "arm": arm, "principal": principal, "case": case["id"], "series": case["series"], **result})
                          finally:
                              worker.pause()
                      report["state"] = "failed" if any(row["state"] != "ok" for row in report["warm_calls"]) else "observed"
                  finally:
                      for worker in workers.values():
                          worker.close()
          except Exception as error:
              report["reason"] = error.code if isinstance(error, gate.MeasurementRefused) else type(error).__name__
              report["phase"] = getattr(error, "phase", None)
          finally:
              Path("recall-bootstrap-result.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          raise SystemExit(report["state"] == "failed")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recall-worker-preflight
          path: recall-bootstrap-result.json
          if-no-files-found: warn
