name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to re-publish (PyPI and/or GHCR), for example v0.2.1
        required: true
        type: string

# Prefer the same GitHub App-token pattern as the Endstate repos. A non-GITHUB_TOKEN
# credential lets Release Please PRs and releases trigger normal CI/release events.
# If the app secrets are not configured on this repo yet, fall back to GITHUB_TOKEN
# so release automation still works, with GitHub's normal recursion protection.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_APP: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID != '' && secrets.RELEASE_PLEASE_APP_PRIVATE_KEY != '' }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_branch: ${{ steps.release.outputs.pr && fromJson(steps.release.outputs.pr).headBranchName }}
    steps:
      - name: Mint GitHub App installation token
        if: env.HAS_RELEASE_APP == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Release Please bumps the package version but cannot carry the hosted plugin
  # artifacts with it. `plugins/hosted/definition.json` pins `source_release`,
  # `hosted_plugins` hard-fails when that diverges from the package release, and
  # the generated descriptors carry sha256 locks over the definition and the
  # compatibility manifest that no `extra-files` updater can recompute. So the
  # release branch runs the real generator and amends its own PR.
  #
  # Without the GitHub App token this push uses GITHUB_TOKEN, which does not
  # retrigger the PR's checks -- the amended branch is correct but shows the
  # pre-amendment run, so re-run checks before merging.
  sync-hosted-artifacts:
    needs: release-please
    if: ${{ github.event_name == 'push' && needs.release-please.outputs.release_branch != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_RELEASE_APP: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID != '' && secrets.RELEASE_PLEASE_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Mint GitHub App installation token
        if: env.HAS_RELEASE_APP == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.release_branch }}
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Order matters: regenerate refuses to run while the definition is stale,
      # so the release guard blocks its own remedy until this resync lands.
      - name: Sync hosted source_release with the release version
        run: python scripts/sync_hosted_release.py

      - name: Regenerate hosted plugin artifacts
        run: uv run --frozen python scripts/hosted-plugin.py regenerate --platform claude

      - name: Verify the regenerated artifacts are current
        run: uv run --frozen python scripts/hosted-plugin.py check --platform claude

      - name: Commit the resync onto the release PR
        run: |
          if git diff --quiet; then
            echo "hosted artifacts already current for this release"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/hosted
          git commit -m "chore(hosted): regenerate plugin artifacts for the release"
          git push

  build-artifacts:
    needs: release-please
    if: ${{ github.event_name == 'push' && needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify package version matches release tag
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          expected = os.environ["TAG"].removeprefix("v")
          with open("pyproject.toml", "rb") as fh:
              actual = tomllib.load(fh)["project"]["version"]
          if actual != expected:
              raise SystemExit(f"pyproject version {actual} does not match release tag {expected}")
          PY

      - name: Validate external connector rollout state
        run: >-
          uv run --frozen pytest
          tests/test_connector_guardrails.py
          tests/test_mcp_schema_fidelity.py
          tests/test_runtime_readiness.py
          tests/test_bootstrap.py
          tests/test_server_transport.py
          -q

      - name: Build package artifacts
        run: uv build

      - name: Smoke packaged connector fingerprint
        run: |
          python - <<'PY'
          import glob
          import sys

          [wheel] = glob.glob("dist/*.whl")
          sys.path.insert(0, wheel)
          from exomem.tool_surface import contract, sha256

          payload = contract()
          assert payload["tool_count"] > 0
          assert payload["sha256"] == sha256()
          print(payload["tool_count"], payload["sha256"])
          PY

      - name: Upload artifacts to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber

  publish-pypi:
    needs: [release-please, build-artifacts]
    if: ${{ github.event_name == 'push' && needs.release-please.outputs.release_created == 'true' && vars.PYPI_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build package artifacts
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  # Lists the server in the official MCP Registry, which is where MCP-aware
  # clients and directories discover servers. Runs after PyPI because the
  # registry entry points at a published package version — publishing first
  # would advertise a version nobody can install yet.
  #
  # Ownership is proven two ways at once: GitHub OIDC for the io.github.Artexis10
  # namespace, and the `mcp-name` marker in README.md, which PyPI renders as the
  # package description. Both must agree with `name` in server.json.
  #
  # Gated on a repo variable and deliberately non-blocking: a registry outage or
  # a CLI change must not fail a release that already shipped to PyPI.
  publish-mcp-registry:
    needs: [release-please, publish-pypi]
    if: ${{ github.event_name == 'push' && needs.release-please.outputs.release_created == 'true' && vars.MCP_REGISTRY_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar -xz mcp-publisher
          chmod +x mcp-publisher

      - name: Authenticate via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish

  publish-image:
    needs: [release-please, build-artifacts]
    if: ${{ github.event_name == 'push' && needs.release-please.outputs.release_created == 'true' && vars.GHCR_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image version from the release tag
        id: meta
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          build_time=$(git show -s --format=%cI "$TAG")
          echo "build_time=$(date -u -d "$build_time" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push lean image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: lean
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/artexis10/exomem:latest
            ghcr.io/artexis10/exomem:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ml image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ml
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/artexis10/exomem:ml
            ghcr.io/artexis10/exomem:${{ steps.meta.outputs.version }}-ml
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push cuda image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: cuda
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/artexis10/exomem:cuda
            ghcr.io/artexis10/exomem:${{ steps.meta.outputs.version }}-cuda
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push hosted image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: hosted
          platforms: linux/amd64
          build-args: |
            EXOMEM_RELEASE_BUILD_TIME=${{ steps.meta.outputs.build_time }}
          push: true
          tags: |
            ghcr.io/artexis10/exomem:hosted
            ghcr.io/artexis10/exomem:${{ steps.meta.outputs.version }}-hosted
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-existing-image:
    if: ${{ github.event_name == 'workflow_dispatch' && vars.GHCR_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image version from the input tag
        id: meta
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          build_time=$(git show -s --format=%cI "$TAG")
          echo "build_time=$(date -u -d "$build_time" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push lean image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: lean
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/artexis10/exomem:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ml image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ml
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/artexis10/exomem:${{ steps.meta.outputs.version }}-ml
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push cuda image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: cuda
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/artexis10/exomem:${{ steps.meta.outputs.version }}-cuda
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push hosted image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: hosted
          platforms: linux/amd64
          build-args: |
            EXOMEM_RELEASE_BUILD_TIME=${{ steps.meta.outputs.build_time }}
          push: true
          tags: |
            ghcr.io/artexis10/exomem:${{ steps.meta.outputs.version }}-hosted
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-existing-pypi:
    if: ${{ github.event_name == 'workflow_dispatch' && vars.PYPI_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify package version matches release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          expected = os.environ["TAG"].removeprefix("v")
          with open("pyproject.toml", "rb") as fh:
              actual = tomllib.load(fh)["project"]["version"]
          if actual != expected:
              raise SystemExit(f"pyproject version {actual} does not match release tag {expected}")
          PY

      - name: Build package artifacts
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
