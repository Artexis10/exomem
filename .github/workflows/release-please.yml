name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.2.1. Publishes only what the release lacks; a dispatch from another ref hands the publish to a run on the tag
        required: true
        type: string
      dry_run:
        description: Build every artifact from the tag and publish nothing (no release upload, PyPI or MCP registry publish, image push or attestation)
        required: false
        default: false
        type: boolean

# Prefer the same GitHub App-token pattern as the Endstate repos. A non-GITHUB_TOKEN
# credential lets Release Please PRs and releases trigger normal CI/release events.
# If the app secrets are not configured on this repo yet, fall back to GITHUB_TOKEN
# so release automation still works, with GitHub's normal recursion protection.
permissions:
  contents: write
  issues: write
  pull-requests: write

# Only a run on a release tag publishes, one run per tag at a time. GitHub
# replaces an older pending run with a newer one, which checks again.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && github.ref == format('refs/tags/{0}', inputs.tag) && format('release-publish-{0}', inputs.tag) || format('release-please-{0}', github.run_id) }}
  cancel-in-progress: false

# Each Dockerfile target owns a cache; the default scope overwrites prior builds.
env:
  IMAGE_CACHE_LEAN: exomem-lean
  IMAGE_CACHE_ML: exomem-ml
  IMAGE_CACHE_CUDA: exomem-cuda
  IMAGE_CACHE_CLOUD: exomem-cloud
  IMAGE_CACHE_CELLCTL: cellctl

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_APP: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID != '' && secrets.RELEASE_PLEASE_APP_PRIVATE_KEY != '' }}
    outputs:
      release_branch: ${{ steps.release.outputs.pr && fromJson(steps.release.outputs.pr).headBranchName }}
    steps:
      - name: Mint GitHub App installation token
        if: env.HAS_RELEASE_APP == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Cloud packages bind the current version, skill contract and corpus digest;
  # rebuild them on every release update. No `extra-files` updater can
  # recompute these archive bytes and hash locks.
  #
  # Without the GitHub App token this push uses GITHUB_TOKEN, which does not
  # retrigger the PR's checks -- the amended branch is correct but shows the
  # pre-amendment run, so re-run checks before merging.
  sync-cloud-artifacts:
    needs: release-please
    if: ${{ github.event_name == 'push' && needs.release-please.outputs.release_branch != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_RELEASE_APP: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID != '' && secrets.RELEASE_PLEASE_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Mint GitHub App installation token
        if: env.HAS_RELEASE_APP == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.release_branch }}
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Regenerate current Cloud packages for the source release
        run: uv run --frozen python scripts/cloud-plugin.py build

      - name: Commit the resync onto the release PR
        run: |
          if git diff --quiet; then
            echo "Cloud packages already current for this release"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/cloud/generated
          git commit -m "chore(cloud): regenerate Cloud packages for the release"
          git push

  # Every run finds the release it serves and checks which of its artifacts are
  # present. Only a run on the release tag publishes, so every attestation
  # names the tag's ref and commit. Any other run hands the publish to a run on
  # the tag: a push heals a release whose own run never published, and a
  # dispatch from main reaches the tag.
  plan:
    needs: release-please
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      source_commit: ${{ steps.plan.outputs.source_commit }}
      publish: ${{ steps.plan.outputs.publish }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      latest: ${{ steps.plan.outputs.latest }}
      pypi: ${{ steps.plan.outputs.pypi }}
      pypi_present: ${{ steps.plan.outputs.pypi_present }}
      mcp: ${{ steps.plan.outputs.mcp }}
      images: ${{ steps.plan.outputs.images }}
      publish_images: ${{ steps.plan.outputs.publish_images }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Install distribution filename parser
        run: python3 -m pip install packaging

      - name: Check which release artifacts are present
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          PYPI_ENABLED: ${{ vars.PYPI_PUBLISH_ENABLED == 'true' }}
          MCP_ENABLED: ${{ vars.MCP_REGISTRY_PUBLISH_ENABLED == 'true' }}
          GHCR_ENABLED: ${{ vars.GHCR_PUBLISH_ENABLED == 'true' }}
          # A push stops handing a tag off after this many of its publish runs
          # failed, so a build the tag's content breaks is not retried forever.
          HANDOFF_FAILURE_LIMIT: 3
        run: |
          set -euo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          # HTTP 200 means present and 404 means missing; any other answer is unknown.
          probe() {
            local code
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$@") || true
            case "$code" in
              200) echo present ;;
              404) echo missing ;;
              *) echo "unknown (HTTP ${code:-000})" ;;
            esac
          }

          if [[ "$EVENT" == push ]]; then
            tag="v$(jq -er '.["."]' .release-please-manifest.json)"
          else
            tag="$INPUT_TAG"
          fi
          # Release tags use the fixed SemVer spelling declared by this workflow.
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$tag' is not a release tag such as v1.2.3"
            exit 1
          fi
          version="${tag#v}"
          {
            echo "tag=$tag"
            echo "dry_run=$DRY_RUN"
          } >> "$GITHUB_OUTPUT"

          tag_state=$(probe -H "Authorization: Bearer $GH_TOKEN" "$api/git/ref/tags/$tag")
          release_state=$(probe -H "Authorization: Bearer $GH_TOKEN" "$api/releases/tags/$tag")
          if [[ "$tag_state" != present || "$release_state" != present ]]; then
            # A push can land before Release Please tags and releases its manifest version.
            if [[ "$EVENT" == push && "$tag_state$release_state" != *unknown* ]]; then
              echo "::notice::$tag has tag $tag_state and GitHub release $release_state; nothing to publish yet"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::$tag needs a tag and a GitHub release: tag $tag_state, release $release_state"
            exit 1
          fi
          git fetch --quiet --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
          source_commit=$(git rev-parse "refs/tags/$tag^{commit}")
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          package=$(git show "$tag:pyproject.toml" | python3 -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["project"]["name"])')
          server=$(git show "$tag:server.json" | jq -er .name)

          rows=()
          missing=()
          unknown=()
          listed() { local joined; printf -v joined '%s, ' "$@"; echo "${joined%, }"; }
          track() {
            rows+=("| $1 | \`$2\` | $3 |")
            case "$3" in
              missing) missing+=("$1") ;;
              unknown*) unknown+=("$1") ;;
            esac
          }

          arguments=()
          [[ "$DRY_RUN" == true ]] && arguments+=(--dry-run)
          asset_state=$(python3 infra/scripts/release_recovery.py assets --tag "$tag" "${arguments[@]}")
          track "release assets" "$tag" "$(jq -r .assets <<<"$asset_state")"
          pypi_state=$(jq -r .pypi <<<"$asset_state")
          pypi_present=$([[ "$pypi_state" == present ]] && echo true || echo false)
          pypi=false
          if [[ "$PYPI_ENABLED" == true ]]; then
            track PyPI "$package==$version" "$pypi_state"
            [[ "$pypi_state" == missing ]] && pypi=true
          else
            track PyPI "$package==$version" "publishing disabled; $pypi_state"
          fi

          # The registry is non-blocking for a release, so an unknown answer only warns.
          mcp=false
          if [[ "$MCP_ENABLED" == true ]]; then
            server_path=$(jq -rn --arg name "$server" '$name | @uri')
            mcp_state=$(probe "https://registry.modelcontextprotocol.io/v0.1/servers/$server_path/versions/$version")
            if [[ "$mcp_state" == unknown* ]]; then
              echo "::warning::MCP registry entry $server $version is $mcp_state; this run leaves it alone"
              mcp_state="registry answer $mcp_state; not published by this run"
            fi
            track "MCP registry" "$server $version" "$mcp_state"
            [[ "$mcp_state" == missing ]] && mcp=true
          else
            track "MCP registry" "$server $version" "publishing disabled"
          fi

          # These targets and tags are the closed Docker release contract.
          image_list=(
            "lean ghcr.io/artexis10/exomem:$version latest"
            "ml ghcr.io/artexis10/exomem:$version-ml ml"
            "cuda ghcr.io/artexis10/exomem:$version-cuda cuda"
            "cloud ghcr.io/artexis10/exomem:$version-cloud cloud"
            "cellctl ghcr.io/artexis10/exomem-cellctl:$version -"
          )
          images='{}'
          for entry in "${image_list[@]}"; do
            read -r name ref floating <<<"$entry"
            repository=${ref%:*}
            commit_tag="$repository:$source_commit-$name"
            [[ "$name" == cellctl ]] && commit_tag="$repository:$source_commit"
            floating_tag="$repository:$floating"
            [[ "$floating" == - ]] && floating_tag=""
            images=$(jq -c --arg name "$name" --arg ref "$ref" --arg commit "$commit_tag" --arg floating "$floating_tag" \
              '.[$name] = {ref: $ref, immutable_tags: [$ref, $commit], floating_tag: $floating, publish: false}' <<<"$images")
          done
          if [[ "$DRY_RUN" == true || "$GHCR_ENABLED" == true ]]; then
            arguments=()
            [[ "$DRY_RUN" == true ]] && arguments+=(--dry-run)
            images=$(IMAGES="$images" python3 infra/scripts/release_recovery.py images --tag "$tag" --directory "$RUNNER_TEMP/image-evidence" "${arguments[@]}")
            for entry in "${image_list[@]}"; do
              read -r name ref _ <<<"$entry"
              state=$(jq -r --arg name "$name" '.[$name].state' <<<"$images")
              track "$name image" "$ref" "$state"
              if [[ "$state" == incomplete:* ]]; then
                echo "::warning::$name: $state"
                missing+=("$name evidence")
              fi
            done
          fi

          # Only the latest release moves the floating image tags.
          latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          latest=$([[ "$latest_tag" == "$tag" ]] && echo true || echo false)
          workflow=${GITHUB_WORKFLOW_REF%@*}
          workflow=${workflow##*/}
          publish=false
          status=0
          if [[ "$DRY_RUN" == true ]]; then
            action="dry run: build every artifact from $tag and publish nothing"
            publish=true
            pypi=true
            mcp=true
          elif (( ${#unknown[@]} )); then
            # Unknown immutable-file state can hide a conflicting upload. Maintainers retry;
            # an outage delays publication, but never blocks a no-publication build.
            action="stopped: cannot tell whether $(listed "${unknown[@]}") are present"
            echo "::error::$action"
            status=1
          elif (( ${#missing[@]} == 0 )); then
            action="nothing to publish: every enabled artifact of $tag is present"
          elif [[ "$GITHUB_REF" == "refs/tags/$tag" ]]; then
            if [[ "$GITHUB_SHA" != "$source_commit" ]]; then
              action="stopped: $tag now points at $source_commit, not at this run's commit $GITHUB_SHA"
              echo "::error::$action"
              status=1
            else
              action="publish here: $(listed "${missing[@]}")"
              publish=true
            fi
          else
            failed=0
            if [[ "$EVENT" == push ]]; then
              failed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?event=workflow_dispatch&branch=$tag&status=failure&per_page=1" --jq .total_count)
            fi
            if (( failed >= HANDOFF_FAILURE_LIMIT )); then
              action="held: $failed publish runs on $tag failed; fix the cause, then dispatch this workflow with tag=$tag"
              echo "::warning::$action"
            else
              body=$(jq -cn --arg tag "$tag" \
                '{ref: $tag, inputs: {tag: $tag, dry_run: "false"}}')
              code=$(curl -sS -o "$RUNNER_TEMP/dispatch.json" -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "$api/actions/workflows/$workflow/dispatches" -d "$body") || true
              case "$code" in
                204)
                  action="handed off to a run on $tag: $(listed "${missing[@]}")"
                  ;;
                # A tag whose workflow predates this hand-off declares no dry_run
                # input, so GitHub refuses it rather than run that tag's old,
                # non-idempotent publish jobs.
                422)
                  action="not handed off: the workflow at $tag refused it ($(jq -r '.message // empty' "$RUNNER_TEMP/dispatch.json")); publish $(listed "${missing[@]}") by hand or release a new version"
                  echo "::warning::$action"
                  ;;
                *)
                  action="stopped: the hand-off to $tag failed with HTTP ${code:-000}"
                  echo "::error::$action"
                  status=1
                  ;;
              esac
            fi
          fi

          publish_images=$(jq -r '[.[] | .publish or (.state != null and .state != "present")] | any' <<<"$images")
          # Only a run that publishes hands the publish jobs anything to do.
          if [[ "$publish" != true ]]; then
            pypi=false
            mcp=false
            publish_images=false
          fi
          {
            echo "publish=$publish"
            echo "latest=$latest"
            echo "pypi=$pypi"
            echo "pypi_present=$pypi_present"
            echo "mcp=$mcp"
            echo "images=$images"
            echo "publish_images=$publish_images"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Release artifacts of $tag"
            echo
            echo "| Artifact | Reference | State |"
            echo "| --- | --- | --- |"
            printf '%s\n' "${rows[@]}"
            echo
            echo "This run: $action"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  build-artifacts:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      producer_attempt: ${{ steps.producer.outputs.attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag }}

      - name: Check out publication tools from the workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: infra/scripts

      - name: Install distribution filename parser
        run: python3 -m pip install packaging

      - name: Verify the checkout is the planned tag commit
        env:
          SOURCE_COMMIT: ${{ needs.plan.outputs.source_commit }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify package version matches release tag
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          expected = os.environ["TAG"].removeprefix("v")
          with open("pyproject.toml", "rb") as fh:
              actual = tomllib.load(fh)["project"]["version"]
          if actual != expected:
              raise SystemExit(f"pyproject version {actual} does not match release tag {expected}")
          PY

      - name: Validate external connector rollout state
        run: >-
          uv run --frozen pytest
          tests/test_connector_guardrails.py
          tests/test_mcp_schema_fidelity.py
          tests/test_runtime_readiness.py
          tests/test_bootstrap.py
          tests/test_server_transport.py
          -q

      - name: Recover or build package artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
        run: |
          arguments=()
          [[ "$DRY_RUN" == true ]] && arguments+=(--dry-run)
          python3 .release-tools/infra/scripts/release_recovery.py distributions --tag "$TAG" "${arguments[@]}"

      - name: Keep the wheel and sdist for the PyPI upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ needs.plan.outputs.dry_run == 'true' && format('python-distributions-dry-run-{0}', github.run_id) || 'python-distributions' }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Verify and stage current Cloud distribution archives
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          uv run --frozen python scripts/cloud-plugin.py check
          python3 .release-tools/infra/scripts/release_recovery.py cloud --tag "$TAG"

      - name: Smoke packaged connector fingerprint
        run: |
          python - <<'PY'
          import glob
          import sys

          [wheel] = glob.glob("dist/*.whl")
          sys.path.insert(0, wheel)
          from exomem.tool_surface import contract, sha256

          payload = contract()
          assert payload["tool_count"] > 0
          assert payload["sha256"] == sha256()
          print(payload["tool_count"], payload["sha256"])
          PY

      - name: Upload missing artifacts to the GitHub release
        if: ${{ needs.plan.outputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          python3 .release-tools/infra/scripts/release_recovery.py upload --tag "$TAG"

      - name: Record the original Python producer attempt
        id: producer
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  # A dry run skips this job, because entering the pypi environment records a deployment.
  publish-pypi:
    needs: [plan, build-artifacts]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.build-artifacts.result == 'success' && needs.plan.outputs.pypi == 'true' && needs.plan.outputs.dry_run != 'true' && vars.PYPI_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag }}

      - name: Check out publication tools from the workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: infra/scripts

      - name: Install distribution filename parser
        run: python3 -m pip install packaging

      - name: Fetch the wheel and sdist built from the tag
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist

      - name: Select only missing matching distributions
        id: missing
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: python3 .release-tools/infra/scripts/release_recovery.py pypi --tag "$TAG"

      - name: Publish to PyPI
        if: steps.missing.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/missing

  # Qualify Python while independent image jobs continue. A skipped PyPI job
  # qualifies only when the plan found existing complete published distributions.
  qualify-python:
    needs: [plan, build-artifacts, publish-pypi]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.build-artifacts.result == 'success' && needs.plan.outputs.dry_run != 'true' && (needs.publish-pypi.result == 'success' || (needs.publish-pypi.result == 'skipped' && needs.plan.outputs.pypi_present == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag }}
      - name: Check out qualification tools from the workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: infra/scripts
      - name: Install distribution filename parser
        run: python3 -m pip install packaging
      - name: Qualify official Python bytes from this exact producer
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.plan.outputs.source_commit }}
          PRODUCER_ATTEMPT: ${{ needs.build-artifacts.outputs.producer_attempt }}
        run: >-
          python3 .release-tools/infra/scripts/release_recovery.py qualify-python
          --tag "$TAG" --source "$SOURCE_COMMIT"
          --run-id "$GITHUB_RUN_ID" --attempt "$PRODUCER_ATTEMPT"
          --verification-attempt "$GITHUB_RUN_ATTEMPT"
          --directory "$RUNNER_TEMP/python-qualification"
      - name: Retain the scoped Python qualification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/python-qualification/python-qualification.json
          if-no-files-found: error
          retention-days: 90

  # Lists the server in the official MCP Registry, which is where MCP-aware
  # clients and directories discover servers. Runs after PyPI because the
  # registry entry points at a published package version — publishing first
  # would advertise a version nobody can install yet.
  #
  # Ownership is proven two ways at once: GitHub OIDC for the io.github.Artexis10
  # namespace, and the `mcp-name` marker in README.md, which PyPI renders as the
  # package description. Both must agree with `name` in server.json.
  #
  # Gated on a repo variable and deliberately non-blocking: a registry outage or
  # a CLI change must not fail a release that already shipped to PyPI.
  publish-mcp-registry:
    needs: [plan, publish-pypi]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.mcp == 'true' && vars.MCP_REGISTRY_PUBLISH_ENABLED == 'true' && (needs.publish-pypi.result == 'success' || needs.plan.outputs.pypi_present == 'true' || needs.plan.outputs.dry_run == 'true') }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag }}

      - name: Verify the checkout is the planned tag commit
        env:
          SOURCE_COMMIT: ${{ needs.plan.outputs.source_commit }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar -xz mcp-publisher
          chmod +x mcp-publisher

      - name: Authenticate via GitHub OIDC
        if: ${{ needs.plan.outputs.dry_run != 'true' }}
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        if: ${{ needs.plan.outputs.dry_run != 'true' }}
        run: ./mcp-publisher publish

  # Native builds push only content addresses; the serialized publisher owns aliases.
  build-cloud-images:
    needs: [plan, build-artifacts]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.build-artifacts.result == 'success' && needs.plan.outputs.publish_images == 'true' && (fromJSON(needs.plan.outputs.images).cloud.publish || fromJSON(needs.plan.outputs.images).cellctl.publish) && (vars.GHCR_PUBLISH_ENABLED == 'true' || needs.plan.outputs.dry_run == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      IMAGES: ${{ needs.plan.outputs.images }}
      DRY_RUN: ${{ needs.plan.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag }}

      - name: Check out publication tools from the workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: infra/scripts

      - name: Install distribution filename parser
        run: python3 -m pip install packaging

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: ${{ env.DRY_RUN != 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image version from the release tag
        id: meta
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.plan.outputs.source_commit }}
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          # Each attestation names this run's ref and commit, so only a run on
          # the tag itself may publish.
          if [[ "$DRY_RUN" != true ]]; then
            test "$GITHUB_REF" = "refs/tags/$TAG"
            test "$GITHUB_SHA" = "$SOURCE_COMMIT"
          fi
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "source_ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
          build_time=$(git show -s --format=%cI HEAD)
          echo "build_time=$(date -u -d "$build_time" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Recover original image evidence
        id: recover
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          arguments=()
          [[ "$DRY_RUN" == true ]] && arguments+=(--dry-run)
          images=$(python3 .release-tools/infra/scripts/release_recovery.py images --tag "$TAG" --directory image-evidence "${arguments[@]}")
          echo "IMAGES=$images" >> "$GITHUB_ENV"

      - name: Build and push native cloud image
        id: cloud-build
        if: ${{ !cancelled() && steps.recover.outcome == 'success' && fromJSON(env.IMAGES).cloud.publish }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: cloud
          platforms: linux/${{ matrix.arch }}
          build-args: |
            EXOMEM_RELEASE_BUILD_TIME=${{ steps.meta.outputs.build_time }}
          provenance: mode=min,version=v0.2
          outputs: type=image,name=ghcr.io/artexis10/exomem,push-by-digest=true,push=${{ env.DRY_RUN != 'true' }}
          labels: |
            org.opencontainers.image.revision=${{ steps.meta.outputs.source_commit }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ env.IMAGE_CACHE_CLOUD }}-${{ matrix.arch }}
          cache-to: ${{ env.DRY_RUN != 'true' && format('type=gha,mode=max,scope={0}-{1}', env.IMAGE_CACHE_CLOUD, matrix.arch) || '' }}

      - name: Build and push native cellctl image
        id: cellctl-build
        if: ${{ !cancelled() && steps.recover.outcome == 'success' && fromJSON(env.IMAGES).cellctl.publish }}
        uses: docker/build-push-action@v6
        with:
          context: infra/cellctl
          file: infra/cellctl/Dockerfile
          platforms: linux/${{ matrix.arch }}
          provenance: mode=min,version=v0.2
          outputs: type=image,name=ghcr.io/artexis10/exomem-cellctl,push-by-digest=true,push=${{ env.DRY_RUN != 'true' }}
          labels: |
            org.opencontainers.image.revision=${{ steps.meta.outputs.source_commit }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ env.IMAGE_CACHE_CELLCTL }}-${{ matrix.arch }}
          cache-to: ${{ env.DRY_RUN != 'true' && format('type=gha,mode=max,scope={0}-{1}', env.IMAGE_CACHE_CELLCTL, matrix.arch) || '' }}

      - name: Retain successful native image digests
        id: digests
        if: ${{ !cancelled() && env.DRY_RUN != 'true' && (steps.cloud-build.outcome == 'success' || steps.cellctl-build.outcome == 'success') }}
        env:
          ARCH: ${{ matrix.arch }}
          CLOUD_DIGEST: ${{ steps.cloud-build.outcome == 'success' && steps.cloud-build.outputs.digest || '' }}
          CELLCTL_DIGEST: ${{ steps.cellctl-build.outcome == 'success' && steps.cellctl-build.outputs.digest || '' }}
        run: |
          mkdir -p native-image-digests
          if [[ -n "$CLOUD_DIGEST" ]]; then
            printf '%s\n' "$CLOUD_DIGEST" > "native-image-digests/cloud-$ARCH.digest"
          fi
          if [[ -n "$CELLCTL_DIGEST" ]]; then
            printf '%s\n' "$CELLCTL_DIGEST" > "native-image-digests/cellctl-$ARCH.digest"
          fi

      - name: Keep native image digests for the serialized publisher
        if: ${{ !cancelled() && steps.digests.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-native-image-digests-${{ matrix.arch }}-${{ github.run_id }}
          path: native-image-digests/*.digest
          if-no-files-found: error
          # Rerunning a failed leg replaces only that architecture in this run.
          overwrite: true
          retention-days: 30

  # Builds only the images the plan found missing. A dry run builds every
  # supported image and pushes, attests and records nothing.
  publish-image:
    # Shared floating tags require one publisher across releases. A build can delay
    # the next release; dry runs have separate groups and never occupy this queue.
    concurrency:
      group: ${{ needs.plan.outputs.dry_run == 'true' && format('release-image-dry-run-{0}', github.run_id) || 'release-image-publication' }}
      queue: max
      cancel-in-progress: false
    needs: [plan, build-artifacts, build-cloud-images]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.build-artifacts.result == 'success' && needs.plan.outputs.publish_images == 'true' && (vars.GHCR_PUBLISH_ENABLED == 'true' || needs.plan.outputs.dry_run == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGES: ${{ needs.plan.outputs.images }}
      DRY_RUN: ${{ needs.plan.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag }}

      - name: Check out publication tools from the workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: infra/scripts

      - name: Install distribution filename parser
        run: python3 -m pip install packaging

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: ${{ env.DRY_RUN != 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image version from the release tag
        id: meta
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.plan.outputs.source_commit }}
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          # Each attestation names this run's ref and commit, so only a run on
          # the tag itself may publish.
          if [[ "$DRY_RUN" != true ]]; then
            test "$GITHUB_REF" = "refs/tags/$TAG"
            test "$GITHUB_SHA" = "$SOURCE_COMMIT"
          fi
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "source_ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
          build_time=$(git show -s --format=%cI HEAD)
          echo "build_time=$(date -u -d "$build_time" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Recover original image evidence
        id: recover
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          arguments=()
          [[ "$DRY_RUN" == true ]] && arguments+=(--dry-run)
          images=$(python3 .release-tools/infra/scripts/release_recovery.py images --tag "$TAG" --directory image-evidence "${arguments[@]}")
          echo "IMAGES=$images" >> "$GITHUB_ENV"

      - name: Download this run's native image digests
        if: ${{ !cancelled() && env.DRY_RUN != 'true' && (fromJSON(env.IMAGES).cloud.publish || fromJSON(env.IMAGES).cellctl.publish) }}
        uses: actions/download-artifact@v4
        with:
          pattern: release-native-image-digests-*-${{ github.run_id }}
          path: native-image-digests
          merge-multiple: true

      - name: Build and push lean image (multi-arch)
        id: lean-build
        if: ${{ !cancelled() && steps.recover.outcome == 'success' && fromJSON(env.IMAGES).lean.publish }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: lean
          platforms: linux/amd64,linux/arm64
          provenance: mode=min,version=v0.2
          outputs: type=image,name=ghcr.io/artexis10/exomem,push-by-digest=true,push=${{ env.DRY_RUN != 'true' }}
          cache-from: type=gha,scope=${{ env.IMAGE_CACHE_LEAN }}
          cache-to: ${{ env.DRY_RUN != 'true' && format('type=gha,mode=max,scope={0}', env.IMAGE_CACHE_LEAN) || '' }}

      - name: Attest the exact lean image
        id: lean-attestation
        if: ${{ !cancelled() && steps.recover.outcome == 'success' && fromJSON(env.IMAGES).lean.publish && env.DRY_RUN != 'true' && steps.lean-build.outcome == 'success' }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-name: ghcr.io/artexis10/exomem
          subject-digest: ${{ steps.lean-build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Retain original lean image evidence
        if: ${{ !cancelled() && steps.recover.outcome == 'success' && fromJSON(env.IMAGES).lean.publish && env.DRY_RUN != 'true' && steps.lean-attestation.outcome == 'success' }}
        env:
          BUNDLE: ${{ steps.lean-attestation.outputs.bundle-path }}
          DIGEST: ${{ steps.lean-build.outputs.digest }}
          SOURCE_COMMIT: ${{ steps.meta.outputs.source_commit }}
        run: cp "$BUNDLE" "image-evidence/exomem-image-lean-${SOURCE_COMMIT}-${DIGEST#sha256:}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sigstore.json"

      - name: Keep original lean image evidence for recovery
        if: ${{ !cancelled() && steps.recover.outcome == 'success' && fromJSON(env.IMAGES).lean.publish && env.DRY_RUN != 'true' && steps.lean-attestation.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-image-evidence-lean-${{ github.run_id }}-${{ github.run_attempt }}
          path: image-evidence/exomem-image-lean-*.sigstore.json
          if-no-files-found: error
          retention-days: 30

      - name: Build and push ml image (multi-arch)
        id: ml-build
        if: ${{ !cancelled() && steps.recover.outcome == 'success' && fromJSON(env.IMAGES).ml.publish }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ml
          platforms: linux/amd64,linux/arm64
          provenance: mode=min,version=v0.2
          outputs: type=image,name=ghcr.io/artexis10/exomem,push-by-digest=true,push=${{ env.DRY_RUN != 'true' }}
          cache-from: type=gha,scope=${{ env.IMAGE_CACHE_ML }}
          cache-to: ${{ env.DRY_RUN != 'true' && format('type=gha,mode=max,scope={0}', env.IMAGE_CACHE_ML) || '' }}

      - name: Attest the exact ml image
        id: ml-attestation
        if: ${{ !cancelled() && steps.recover.outcome == 'success' && fromJSON(env.IMAGES).ml.publish && env.DRY_RUN != 'true' && steps.ml-build.outcome == 'success' }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-name: ghcr.io/artexis10/exomem
          subject-digest: ${{ steps.ml-build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Retain original ml image evidence
        if: ${{ !cancelled() && steps.recover.outcome == 'success' && fromJSON(env.IMAGES).ml.publish && env.DRY_RUN != 'true' && steps.ml-attestation.outcome == 'success' }}
        env:
          BUNDLE: ${{ steps.ml-attestation.outputs.bundle-path }}
          DIGEST: ${{ steps.ml-build.outputs.digest }}
          SOURCE_COMMIT: ${{ steps.meta.outputs.source_commit }}
        run: cp "$BUNDLE" "image-evidence/exomem-image-ml-${SOURCE_COMMIT}-${DIGEST#sha256:}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sigstore.json"

      - name: Keep original ml image evidence for recovery
        if: ${{ !cancelled() && steps.recover.outcome == 'success' && fromJSON(env.IMAGES).ml.publish && env.DRY_RUN != 'true' && steps.ml-attestation.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-image-evidence-ml-${{ github.run_id }}-${{ github.run_attempt }}
          path: image-evidence/exomem-image-ml-*.sigstore.json
          if-no-files-found: error
          retention-days: 30

      - name: Build and push cuda image (linux/amd64)
        id: cuda-build
        if: ${{ !cancelled() && steps.recover.outcome == 'success' && fromJSON(env.IMAGES).cuda.publish }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: cuda
          platforms: linux/amd64
          provenance: mode=min,version=v0.2
          outputs: type=image,name=ghcr.io/artexis10/exomem,push-by-digest=true,push=${{ env.DRY_RUN != 'true' }}
          cache-from: type=gha,scope=${{ env.IMAGE_CACHE_CUDA }}
          # Cache export added 27 minutes after the build and push took five minutes.

      - name: Attest the exact cuda image
        id: cuda-attestation
        if: ${{ !cancelled() && steps.recover.outcome == 'success' && fromJSON(env.IMAGES).cuda.publish && env.DRY_RUN != 'true' && steps.cuda-build.outcome == 'success' }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-name: ghcr.io/artexis10/exomem
          subject-digest: ${{ steps.cuda-build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Retain original cuda image evidence
        if: ${{ !cancelled() && steps.recover.outcome == 'success' && fromJSON(env.IMAGES).cuda.publish && env.DRY_RUN != 'true' && steps.cuda-attestation.outcome == 'success' }}
        env:
          BUNDLE: ${{ steps.cuda-attestation.outputs.bundle-path }}
          DIGEST: ${{ steps.cuda-build.outputs.digest }}
          SOURCE_COMMIT: ${{ steps.meta.outputs.source_commit }}
        run: cp "$BUNDLE" "image-evidence/exomem-image-cuda-${SOURCE_COMMIT}-${DIGEST#sha256:}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sigstore.json"

      - name: Keep original cuda image evidence for recovery
        if: ${{ !cancelled() && steps.recover.outcome == 'success' && fromJSON(env.IMAGES).cuda.publish && env.DRY_RUN != 'true' && steps.cuda-attestation.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-image-evidence-cuda-${{ github.run_id }}-${{ github.run_attempt }}
          path: image-evidence/exomem-image-cuda-*.sigstore.json
          if-no-files-found: error
          retention-days: 30

      - name: Join native cloud image digests
        id: cloud-build
        if: ${{ !cancelled() && steps.recover.outcome == 'success' && fromJSON(env.IMAGES).cloud.publish && env.DRY_RUN != 'true' }}
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          digest=$(python3 .release-tools/infra/scripts/release_recovery.py join-image --tag "$TAG" --image cloud --directory native-image-digests)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest the exact Exomem Cloud cell image
        id: cloud-attestation
        if: ${{ !cancelled() && steps.recover.outcome == 'success' && fromJSON(env.IMAGES).cloud.publish && env.DRY_RUN != 'true' && steps.cloud-build.outcome == 'success' }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-name: ghcr.io/artexis10/exomem
          subject-digest: ${{ steps.cloud-build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Retain original cloud image evidence
        if: ${{ !cancelled() && steps.recover.outcome == 'success' && fromJSON(env.IMAGES).cloud.publish && env.DRY_RUN != 'true' && steps.cloud-attestation.outcome == 'success' }}
        env:
          BUNDLE: ${{ steps.cloud-attestation.outputs.bundle-path }}
          DIGEST: ${{ steps.cloud-build.outputs.digest }}
          SOURCE_COMMIT: ${{ steps.meta.outputs.source_commit }}
        run: cp "$BUNDLE" "image-evidence/exomem-image-cloud-${SOURCE_COMMIT}-${DIGEST#sha256:}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sigstore.json"

      - name: Keep original cloud image evidence for recovery
        if: ${{ !cancelled() && steps.recover.outcome == 'success' && fromJSON(env.IMAGES).cloud.publish && env.DRY_RUN != 'true' && steps.cloud-attestation.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-image-evidence-cloud-${{ github.run_id }}-${{ github.run_attempt }}
          path: image-evidence/exomem-image-cloud-*.sigstore.json
          if-no-files-found: error
          retention-days: 30

      # The platform chart consumes cellctl by digest (cellctl.image), so it
      # ships on the same release trigger as the cell image it rolls out.
      - name: Join native cellctl image digests
        id: cellctl-build
        if: ${{ !cancelled() && steps.recover.outcome == 'success' && fromJSON(env.IMAGES).cellctl.publish && env.DRY_RUN != 'true' }}
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          digest=$(python3 .release-tools/infra/scripts/release_recovery.py join-image --tag "$TAG" --image cellctl --directory native-image-digests)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest the exact Exomem Cloud cellctl image
        id: cellctl-attestation
        if: ${{ !cancelled() && steps.recover.outcome == 'success' && fromJSON(env.IMAGES).cellctl.publish && env.DRY_RUN != 'true' && steps.cellctl-build.outcome == 'success' }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-name: ghcr.io/artexis10/exomem-cellctl
          subject-digest: ${{ steps.cellctl-build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Retain original cellctl image evidence
        if: ${{ !cancelled() && steps.recover.outcome == 'success' && fromJSON(env.IMAGES).cellctl.publish && env.DRY_RUN != 'true' && steps.cellctl-attestation.outcome == 'success' }}
        env:
          BUNDLE: ${{ steps.cellctl-attestation.outputs.bundle-path }}
          DIGEST: ${{ steps.cellctl-build.outputs.digest }}
          SOURCE_COMMIT: ${{ steps.meta.outputs.source_commit }}
        run: cp "$BUNDLE" "image-evidence/exomem-image-cellctl-${SOURCE_COMMIT}-${DIGEST#sha256:}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sigstore.json"

      - name: Keep original cellctl image evidence for recovery
        if: ${{ !cancelled() && steps.recover.outcome == 'success' && fromJSON(env.IMAGES).cellctl.publish && env.DRY_RUN != 'true' && steps.cellctl-attestation.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-image-evidence-cellctl-${{ github.run_id }}-${{ github.run_attempt }}
          path: image-evidence/exomem-image-cellctl-*.sigstore.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify retained evidence and finish missing discovery tags
        if: ${{ always() && !cancelled() && env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: python3 .release-tools/infra/scripts/release_recovery.py finish-images --tag "$TAG" --directory image-evidence
