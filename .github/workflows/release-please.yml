name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.2.1. Publishes only what the release lacks; a dispatch from another ref hands the publish to a run on the tag
        required: true
        type: string
      dry_run:
        description: Build every artifact from the tag and publish nothing (no release upload, PyPI or MCP registry publish, image push or attestation)
        required: false
        default: false
        type: boolean
      records_rollback_runtime_target_json:
        description: Optional reviewed six-field runtime target to sign this image as a Records reader-v2 rollback unit
        required: false
        default: ""
        type: string

# Prefer the same GitHub App-token pattern as the Endstate repos. A non-GITHUB_TOKEN
# credential lets Release Please PRs and releases trigger normal CI/release events.
# If the app secrets are not configured on this repo yet, fall back to GITHUB_TOKEN
# so release automation still works, with GitHub's normal recursion protection.
permissions:
  contents: write
  issues: write
  pull-requests: write

# Only a run on a release tag publishes, one run per tag at a time. GitHub
# replaces an older pending run with a newer one, which checks again.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && github.ref == format('refs/tags/{0}', inputs.tag) && format('release-publish-{0}', inputs.tag) || format('release-please-{0}', github.run_id) }}
  cancel-in-progress: false

# Each Dockerfile target owns a cache; the default scope overwrites prior builds.
env:
  IMAGE_CACHE_LEAN: exomem-lean
  IMAGE_CACHE_ML: exomem-ml
  IMAGE_CACHE_CUDA: exomem-cuda
  IMAGE_CACHE_HOSTED: exomem-hosted
  IMAGE_CACHE_CLOUD: exomem-cloud
  IMAGE_CACHE_CELLCTL: cellctl

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_APP: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID != '' && secrets.RELEASE_PLEASE_APP_PRIVATE_KEY != '' }}
    outputs:
      release_branch: ${{ steps.release.outputs.pr && fromJson(steps.release.outputs.pr).headBranchName }}
    steps:
      - name: Mint GitHub App installation token
        if: env.HAS_RELEASE_APP == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Cloud packages bind the current version, skill contract and corpus digest;
  # rebuild them on every release update. Legacy hosted descriptors need a
  # rebuild only when their contract changes. No `extra-files` updater can
  # recompute these archive bytes and hash locks.
  #
  # Without the GitHub App token this push uses GITHUB_TOKEN, which does not
  # retrigger the PR's checks -- the amended branch is correct but shows the
  # pre-amendment run, so re-run checks before merging.
  sync-hosted-artifacts:
    needs: release-please
    if: ${{ github.event_name == 'push' && needs.release-please.outputs.release_branch != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_RELEASE_APP: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID != '' && secrets.RELEASE_PLEASE_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Mint GitHub App installation token
        if: env.HAS_RELEASE_APP == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.release_branch }}
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Regenerate hosted plugin artifacts
        run: |
          uv run --frozen python scripts/hosted-plugin.py regenerate --platform claude
          openai_app_id="$(python - <<'PY'
          import json
          from pathlib import Path

          app = json.loads(
              Path("plugins/hosted/generated/candidates/hosted-alpha-agent-v2/openai/.app.json").read_text(
                  encoding="utf-8"
              )
          )
          print(app["apps"]["exomem"]["id"])
          PY
          )"
          parity_candidate="$(uv run --frozen python - <<'PY'
          from exomem.hosted_plugins import PARITY_CANDIDATE

          print(PARITY_CANDIDATE)
          PY
          )"
          baseline_candidate="$(uv run --frozen python - <<'PY'
          from exomem.hosted_plugins import BASELINE_CANDIDATE

          print(BASELINE_CANDIDATE)
          PY
          )"
          uv run --frozen python scripts/hosted-plugin.py render --candidate hosted-alpha-agent-v2 --platform all --openai-app-id "$openai_app_id"
          uv run --frozen python scripts/hosted-plugin.py render --candidate "$parity_candidate" --platform all --openai-app-id "$openai_app_id"
          uv run --frozen python scripts/hosted-plugin.py render --candidate "$baseline_candidate" --platform all --openai-app-id "$openai_app_id"

      - name: Regenerate current Cloud packages for the source release
        run: uv run --frozen python scripts/cloud-plugin.py build

      - name: Verify the regenerated artifacts are current
        run: |
          uv run --frozen python scripts/hosted-plugin.py check --platform claude
          openai_app_id="$(python - <<'PY'
          import json
          from pathlib import Path

          app = json.loads(
              Path("plugins/hosted/generated/candidates/hosted-alpha-agent-v2/openai/.app.json").read_text(
                  encoding="utf-8"
              )
          )
          print(app["apps"]["exomem"]["id"])
          PY
          )"
          parity_candidate="$(uv run --frozen python - <<'PY'
          from exomem.hosted_plugins import PARITY_CANDIDATE

          print(PARITY_CANDIDATE)
          PY
          )"
          baseline_candidate="$(uv run --frozen python - <<'PY'
          from exomem.hosted_plugins import BASELINE_CANDIDATE

          print(BASELINE_CANDIDATE)
          PY
          )"
          uv run --frozen python scripts/hosted-plugin.py check --candidate hosted-alpha-agent-v2 --platform all --openai-app-id "$openai_app_id"
          uv run --frozen python scripts/hosted-plugin.py check --candidate "$parity_candidate" --platform all --openai-app-id "$openai_app_id"
          uv run --frozen python scripts/hosted-plugin.py check --candidate "$baseline_candidate" --platform all --openai-app-id "$openai_app_id"

      - name: Commit the resync onto the release PR
        run: |
          if git diff --quiet; then
            echo "hosted artifacts already current for this release"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/hosted plugins/cloud/generated
          git commit -m "chore(hosted): regenerate plugin artifacts for the release"
          git push

  # Every run finds the release it serves and checks which of its artifacts are
  # present. Only a run on the release tag publishes, so every attestation
  # names the tag's ref and commit. Any other run hands the publish to a run on
  # the tag: a push heals a release whose own run never published, and a
  # dispatch from main reaches the tag.
  plan:
    needs: release-please
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      source_commit: ${{ steps.plan.outputs.source_commit }}
      publish: ${{ steps.plan.outputs.publish }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      latest: ${{ steps.plan.outputs.latest }}
      pypi: ${{ steps.plan.outputs.pypi }}
      pypi_present: ${{ steps.plan.outputs.pypi_present }}
      mcp: ${{ steps.plan.outputs.mcp }}
      images: ${{ steps.plan.outputs.images }}
      publish_images: ${{ steps.plan.outputs.publish_images }}
    steps:
      - uses: actions/checkout@v4

      - name: Check which release artifacts are present
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          RECORDS_TARGET: ${{ inputs.records_rollback_runtime_target_json }}
          PYPI_ENABLED: ${{ vars.PYPI_PUBLISH_ENABLED == 'true' }}
          MCP_ENABLED: ${{ vars.MCP_REGISTRY_PUBLISH_ENABLED == 'true' }}
          GHCR_ENABLED: ${{ vars.GHCR_PUBLISH_ENABLED == 'true' }}
          # A push stops handing a tag off after this many of its publish runs
          # failed, so a build the tag's content breaks is not retried forever.
          HANDOFF_FAILURE_LIMIT: 3
        run: |
          set -euo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          # HTTP 200 means present and 404 means missing; any other answer is unknown.
          probe() {
            local code
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$@") || true
            case "$code" in
              200) echo present ;;
              404) echo missing ;;
              *) echo "unknown (HTTP ${code:-000})" ;;
            esac
          }

          if [[ "$EVENT" == push ]]; then
            tag="v$(jq -er '.["."]' .release-please-manifest.json)"
          else
            tag="$INPUT_TAG"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$tag' is not a release tag such as v1.2.3"
            exit 1
          fi
          version="${tag#v}"
          {
            echo "tag=$tag"
            echo "dry_run=$DRY_RUN"
          } >> "$GITHUB_OUTPUT"

          tag_state=$(probe -H "Authorization: Bearer $GH_TOKEN" "$api/git/ref/tags/$tag")
          release_state=$(probe -H "Authorization: Bearer $GH_TOKEN" "$api/releases/tags/$tag")
          if [[ "$tag_state" != present || "$release_state" != present ]]; then
            # A push can land before Release Please tags and releases its manifest version.
            if [[ "$EVENT" == push && "$tag_state$release_state" != *unknown* ]]; then
              echo "::notice::$tag has tag $tag_state and GitHub release $release_state; nothing to publish yet"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::$tag needs a tag and a GitHub release: tag $tag_state, release $release_state"
            exit 1
          fi
          git fetch --quiet --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
          source_commit=$(git rev-parse "refs/tags/$tag^{commit}")
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          package=$(git show "$tag:pyproject.toml" | python3 -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["project"]["name"])')
          server=$(git show "$tag:server.json" | jq -er .name)

          rows=()
          missing=()
          unknown=()
          listed() { local joined; printf -v joined '%s, ' "$@"; echo "${joined%, }"; }
          track() {
            rows+=("| $1 | \`$2\` | $3 |")
            case "$3" in
              missing) missing+=("$1") ;;
              unknown*) unknown+=("$1") ;;
            esac
          }

          # The wheel and sdist go up in the same step as the Cloud archives, so
          # their presence stands for that upload.
          dist_kinds=$(gh release view "$tag" --json assets \
            --jq '[.assets[].name | select(endswith(".whl") or endswith(".tar.gz")) | split(".") | last] | unique | length')
          track "release assets" "$tag" "$([[ "$dist_kinds" == 2 ]] && echo present || echo missing)"

          pypi_state=$(probe "https://pypi.org/pypi/$package/$version/json")
          pypi_present=$([[ "$pypi_state" == present ]] && echo true || echo false)
          pypi=false
          if [[ "$PYPI_ENABLED" == true ]]; then
            track PyPI "$package==$version" "$pypi_state"
            [[ "$pypi_state" == missing ]] && pypi=true
          else
            track PyPI "$package==$version" "$pypi_state; publishing disabled"
          fi

          # The registry is non-blocking for a release, so an unknown answer only warns.
          mcp=false
          if [[ "$MCP_ENABLED" == true ]]; then
            server_path=$(jq -rn --arg name "$server" '$name | @uri')
            mcp_state=$(probe "https://registry.modelcontextprotocol.io/v0.1/servers/$server_path/versions/$version")
            if [[ "$mcp_state" == unknown* ]]; then
              echo "::warning::MCP registry entry $server $version is $mcp_state; this run leaves it alone"
              mcp_state="registry answer $mcp_state; not published by this run"
            fi
            track "MCP registry" "$server $version" "$mcp_state"
            [[ "$mcp_state" == missing ]] && mcp=true
          else
            track "MCP registry" "$server $version" "publishing disabled"
          fi

          # The versioned tag of each image publish-image builds. That job pushes
          # these refs, so the publish and this check read one list.
          image_list=(
            "lean ghcr.io/artexis10/exomem:$version"
            "ml ghcr.io/artexis10/exomem:$version-ml"
            "cuda ghcr.io/artexis10/exomem:$version-cuda"
            "hosted ghcr.io/artexis10/exomem:$version-hosted"
            "cloud ghcr.io/artexis10/exomem:$version-cloud"
            "cellctl ghcr.io/artexis10/exomem-cellctl:$version"
          )
          manifest_types="application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json"
          image_state() {
            local repository=${1%:*} reference=${1##*:} token
            repository=${repository#ghcr.io/}
            if ! token=$(curl -fsS -u "$GITHUB_ACTOR:$GH_TOKEN" "https://ghcr.io/token?scope=repository:$repository:pull" | jq -er .token); then
              echo "unknown (no registry token)"
              return
            fi
            probe -I -H "Authorization: Bearer $token" -H "Accept: $manifest_types" "https://ghcr.io/v2/$repository/manifests/$reference"
          }
          images='{}'
          for entry in "${image_list[@]}"; do
            read -r name ref <<<"$entry"
            build=false
            if [[ "$GHCR_ENABLED" == true ]]; then
              state=$(image_state "$ref")
              # A Records rollback request signs a new hosted runtime candidate,
              # which needs a hosted image this run builds and attests.
              if [[ "$name" == hosted && -n "$RECORDS_TARGET" && "$state" == present ]]; then
                state="present; rebuilt for the Records rollback request"
                missing+=("hosted (Records rollback)")
                build=true
              fi
              track "$name image" "$ref" "$state"
              [[ "$state" == missing ]] && build=true
            else
              track "$name image" "$ref" "publishing disabled"
            fi
            [[ "$DRY_RUN" == true ]] && build=true
            images=$(jq -c --arg name "$name" --arg ref "$ref" --argjson build "$build" \
              '.[$name] = {ref: $ref, publish: $build}' <<<"$images")
          done

          # Only the latest release moves the floating image tags.
          latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          latest=$([[ "$latest_tag" == "$tag" ]] && echo true || echo false)
          workflow=${GITHUB_WORKFLOW_REF%@*}
          workflow=${workflow##*/}
          publish=false
          status=0
          if (( ${#unknown[@]} )); then
            action="stopped: cannot tell whether $(listed "${unknown[@]}") are present"
            echo "::error::$action"
            status=1
          elif [[ "$DRY_RUN" == true ]]; then
            action="dry run: build every artifact from $tag and publish nothing"
            publish=true
            pypi=true
            mcp=true
          elif (( ${#missing[@]} == 0 )); then
            action="nothing to publish: every enabled artifact of $tag is present"
          elif [[ "$GITHUB_REF" == "refs/tags/$tag" ]]; then
            if [[ "$GITHUB_SHA" != "$source_commit" ]]; then
              action="stopped: $tag now points at $source_commit, not at this run's commit $GITHUB_SHA"
              echo "::error::$action"
              status=1
            else
              action="publish here: $(listed "${missing[@]}")"
              publish=true
            fi
          else
            failed=0
            if [[ "$EVENT" == push ]]; then
              failed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?event=workflow_dispatch&branch=$tag&status=failure&per_page=1" --jq .total_count)
            fi
            if (( failed >= HANDOFF_FAILURE_LIMIT )); then
              action="held: $failed publish runs on $tag failed; fix the cause, then dispatch this workflow with tag=$tag"
              echo "::warning::$action"
            else
              body=$(jq -cn --arg tag "$tag" --arg records "$RECORDS_TARGET" \
                '{ref: $tag, inputs: {tag: $tag, dry_run: "false", records_rollback_runtime_target_json: $records}}')
              code=$(curl -sS -o "$RUNNER_TEMP/dispatch.json" -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "$api/actions/workflows/$workflow/dispatches" -d "$body") || true
              case "$code" in
                204)
                  action="handed off to a run on $tag: $(listed "${missing[@]}")"
                  ;;
                # A tag whose workflow predates this hand-off declares no dry_run
                # input, so GitHub refuses it rather than run that tag's old,
                # non-idempotent publish jobs.
                422)
                  action="not handed off: the workflow at $tag refused it ($(jq -r '.message // empty' "$RUNNER_TEMP/dispatch.json")); publish $(listed "${missing[@]}") by hand or release a new version"
                  echo "::warning::$action"
                  ;;
                *)
                  action="stopped: the hand-off to $tag failed with HTTP ${code:-000}"
                  echo "::error::$action"
                  status=1
                  ;;
              esac
            fi
          fi

          publish_images=$(jq -r '[.[] | .publish] | any' <<<"$images")
          # Only a run that publishes hands the publish jobs anything to do.
          if [[ "$publish" != true ]]; then
            pypi=false
            mcp=false
            publish_images=false
          fi
          {
            echo "publish=$publish"
            echo "latest=$latest"
            echo "pypi=$pypi"
            echo "pypi_present=$pypi_present"
            echo "mcp=$mcp"
            echo "images=$images"
            echo "publish_images=$publish_images"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Release artifacts of $tag"
            echo
            echo "| Artifact | Reference | State |"
            echo "| --- | --- | --- |"
            printf '%s\n' "${rows[@]}"
            echo
            echo "This run: $action"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  build-artifacts:
    needs: plan
    if: ${{ needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag }}

      - name: Verify the checkout is the planned tag commit
        env:
          SOURCE_COMMIT: ${{ needs.plan.outputs.source_commit }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify package version matches release tag
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          expected = os.environ["TAG"].removeprefix("v")
          with open("pyproject.toml", "rb") as fh:
              actual = tomllib.load(fh)["project"]["version"]
          if actual != expected:
              raise SystemExit(f"pyproject version {actual} does not match release tag {expected}")
          PY

      - name: Validate external connector rollout state
        run: >-
          uv run --frozen pytest
          tests/test_connector_guardrails.py
          tests/test_mcp_schema_fidelity.py
          tests/test_runtime_readiness.py
          tests/test_bootstrap.py
          tests/test_server_transport.py
          -q

      - name: Build package artifacts
        run: uv build

      - name: Keep the wheel and sdist for the PyPI upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Verify and stage current Cloud distribution archives
        run: |
          uv run --frozen python scripts/cloud-plugin.py check
          cp plugins/cloud/generated/claude.zip dist/exomem-cloud-claude.zip
          cp plugins/cloud/generated/openai.zip dist/exomem-cloud-openai.zip
          cp plugins/cloud/generated/release.json dist/exomem-cloud-release.json

      - name: Smoke packaged connector fingerprint
        run: |
          python - <<'PY'
          import glob
          import sys

          [wheel] = glob.glob("dist/*.whl")
          sys.path.insert(0, wheel)
          from exomem.tool_surface import contract, sha256

          payload = contract()
          assert payload["tool_count"] > 0
          assert payload["sha256"] == sha256()
          print(payload["tool_count"], payload["sha256"])
          PY

      - name: Upload missing artifacts to the GitHub release
        if: ${{ needs.plan.outputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          # An asset the release already has stays; a rebuild never replaces it.
          present=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          upload=()
          for file in dist/*; do
            if grep -qxF "${file##*/}" <<<"$present"; then
              echo "kept ${file##*/}: the release already has it"
            else
              upload+=("$file")
            fi
          done
          if (( ${#upload[@]} )); then
            gh release upload "$TAG" "${upload[@]}"
          fi

  # A dry run skips this job, because entering the pypi environment records a deployment.
  publish-pypi:
    needs: [plan, build-artifacts]
    if: ${{ needs.plan.outputs.pypi == 'true' && needs.plan.outputs.dry_run != 'true' && vars.PYPI_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Fetch the wheel and sdist built from the tag
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # A file PyPI already has stays, so a repeat publish uploads only what is missing.
          skip-existing: true

  # Lists the server in the official MCP Registry, which is where MCP-aware
  # clients and directories discover servers. Runs after PyPI because the
  # registry entry points at a published package version — publishing first
  # would advertise a version nobody can install yet.
  #
  # Ownership is proven two ways at once: GitHub OIDC for the io.github.Artexis10
  # namespace, and the `mcp-name` marker in README.md, which PyPI renders as the
  # package description. Both must agree with `name` in server.json.
  #
  # Gated on a repo variable and deliberately non-blocking: a registry outage or
  # a CLI change must not fail a release that already shipped to PyPI.
  publish-mcp-registry:
    needs: [plan, publish-pypi]
    if: ${{ !cancelled() && needs.plan.outputs.mcp == 'true' && vars.MCP_REGISTRY_PUBLISH_ENABLED == 'true' && (needs.publish-pypi.result == 'success' || needs.plan.outputs.pypi_present == 'true' || needs.plan.outputs.dry_run == 'true') }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag }}

      - name: Verify the checkout is the planned tag commit
        env:
          SOURCE_COMMIT: ${{ needs.plan.outputs.source_commit }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar -xz mcp-publisher
          chmod +x mcp-publisher

      - name: Authenticate via GitHub OIDC
        if: ${{ needs.plan.outputs.dry_run != 'true' }}
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        if: ${{ needs.plan.outputs.dry_run != 'true' }}
        run: ./mcp-publisher publish

  # Builds only the images the plan found missing. A dry run builds all six and
  # pushes, attests and records nothing.
  publish-image:
    needs: [plan, build-artifacts]
    if: ${{ needs.plan.outputs.publish_images == 'true' && vars.GHCR_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGES: ${{ needs.plan.outputs.images }}
      DRY_RUN: ${{ needs.plan.outputs.dry_run }}
      LATEST: ${{ needs.plan.outputs.latest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image version from the release tag
        id: meta
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.plan.outputs.source_commit }}
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          # Each attestation names this run's ref and commit, so only a run on
          # the tag itself may publish.
          if [[ "$DRY_RUN" != true ]]; then
            test "$GITHUB_REF" = "refs/tags/$TAG"
            test "$GITHUB_SHA" = "$SOURCE_COMMIT"
          fi
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "source_ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
          build_time=$(git show -s --format=%cI HEAD)
          echo "build_time=$(date -u -d "$build_time" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push lean image (multi-arch)
        if: ${{ fromJSON(env.IMAGES).lean.publish }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: lean
          platforms: linux/amd64,linux/arm64
          push: ${{ env.DRY_RUN != 'true' }}
          tags: |
            ${{ env.LATEST == 'true' && 'ghcr.io/artexis10/exomem:latest' || '' }}
            ${{ fromJSON(env.IMAGES).lean.ref }}
          cache-from: type=gha,scope=${{ env.IMAGE_CACHE_LEAN }}
          cache-to: ${{ env.DRY_RUN != 'true' && format('type=gha,mode=max,scope={0}', env.IMAGE_CACHE_LEAN) || '' }}

      - name: Build and push ml image (multi-arch)
        if: ${{ fromJSON(env.IMAGES).ml.publish }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ml
          platforms: linux/amd64,linux/arm64
          push: ${{ env.DRY_RUN != 'true' }}
          tags: |
            ${{ env.LATEST == 'true' && 'ghcr.io/artexis10/exomem:ml' || '' }}
            ${{ fromJSON(env.IMAGES).ml.ref }}
          cache-from: type=gha,scope=${{ env.IMAGE_CACHE_ML }}
          cache-to: ${{ env.DRY_RUN != 'true' && format('type=gha,mode=max,scope={0}', env.IMAGE_CACHE_ML) || '' }}

      - name: Build and push cuda image (linux/amd64)
        if: ${{ fromJSON(env.IMAGES).cuda.publish }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: cuda
          platforms: linux/amd64
          push: ${{ env.DRY_RUN != 'true' }}
          tags: |
            ${{ env.LATEST == 'true' && 'ghcr.io/artexis10/exomem:cuda' || '' }}
            ${{ fromJSON(env.IMAGES).cuda.ref }}
          cache-from: type=gha,scope=${{ env.IMAGE_CACHE_CUDA }}
          cache-to: ${{ env.DRY_RUN != 'true' && format('type=gha,mode=max,scope={0}', env.IMAGE_CACHE_CUDA) || '' }}

      - name: Build and push hosted image (linux/amd64)
        id: hosted-build
        if: ${{ fromJSON(env.IMAGES).hosted.publish }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: hosted
          platforms: linux/amd64
          build-args: |
            EXOMEM_RELEASE_BUILD_TIME=${{ steps.meta.outputs.build_time }}
          push: ${{ env.DRY_RUN != 'true' }}
          tags: |
            ${{ env.LATEST == 'true' && 'ghcr.io/artexis10/exomem:hosted' || '' }}
            ${{ fromJSON(env.IMAGES).hosted.ref }}
            ghcr.io/artexis10/exomem:${{ steps.meta.outputs.source_commit }}-hosted
          labels: |
            org.opencontainers.image.revision=${{ steps.meta.outputs.source_commit }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ env.IMAGE_CACHE_HOSTED }}
          cache-to: ${{ env.DRY_RUN != 'true' && format('type=gha,mode=max,scope={0}', env.IMAGE_CACHE_HOSTED) || '' }}

      - name: Attest the exact hosted runtime image
        id: hosted-attestation
        if: ${{ fromJSON(env.IMAGES).hosted.publish && env.DRY_RUN != 'true' }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-name: ghcr.io/artexis10/exomem
          subject-digest: ${{ steps.hosted-build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Record the hosted runtime candidate
        id: runtime-candidate
        if: ${{ fromJSON(env.IMAGES).hosted.publish && env.DRY_RUN != 'true' }}
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          SOURCE_COMMIT: ${{ steps.meta.outputs.source_commit }}
          SOURCE_REF: ${{ steps.meta.outputs.source_ref }}
          HOSTED_DIGEST: ${{ steps.hosted-build.outputs.digest }}
          ATTESTATION_BUNDLE: ${{ steps.hosted-attestation.outputs.bundle-path }}
          RECORDS_RUNTIME_TARGET_JSON: ${{ inputs.records_rollback_runtime_target_json }}
        run: |
          set -euo pipefail
          digest_hex=${HOSTED_DIGEST#sha256:}
          evidence_stem="exomem-hosted-runtime-${SOURCE_COMMIT}-${digest_hex}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          candidate="${evidence_stem}.candidate-v1.json"
          bundle="${evidence_stem}.sigstore.json"
          cp "$ATTESTATION_BUNDLE" "$bundle"
          immutable_image="ghcr.io/artexis10/exomem@${HOSTED_DIGEST}"
          discovery_tag="ghcr.io/artexis10/exomem:${SOURCE_COMMIT}-hosted"
          storage_uri="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${bundle}"
          records_compatibility_args=()
          if [[ -n "$RECORDS_RUNTIME_TARGET_JSON" ]]; then
            records_issued_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            records_expires_at="$(date -u -d '+1 hour' +%Y-%m-%dT%H:%M:%SZ)"
            records_compatibility_args=(
              --records-profile hosted-alpha-agent-v1
              --records-reader-version 2
              --lifecycle-actions-enabled false
              --records-issued-at "$records_issued_at"
              --records-expires-at "$records_expires_at"
              --records-runtime-target-json "$RECORDS_RUNTIME_TARGET_JSON"
            )
          fi
          python3 infra/scripts/hosted_image_candidate.py record \
            --component runtime \
            --source-repository "$GITHUB_REPOSITORY" \
            --source-ref "$SOURCE_REF" \
            --source-commit "$SOURCE_COMMIT" \
            --release "$VERSION" \
            --image "$immutable_image" \
            --discovery-tag "$discovery_tag" \
            --producer-repository "$GITHUB_REPOSITORY" \
            --producer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-please.yml" \
            --producer-workflow-commit "$GITHUB_WORKFLOW_SHA" \
            --producer-oidc-source-ref "$GITHUB_REF" \
            --producer-oidc-source-commit "$GITHUB_SHA" \
            --producer-event "$GITHUB_EVENT_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --bundle "$bundle" \
            --storage-kind github-release \
            --storage-uri "$storage_uri" \
            "${records_compatibility_args[@]}" \
            --output "$candidate"
          {
            echo "candidate=$candidate"
            echo "bundle=$bundle"
            echo "immutable_image=$immutable_image"
          } >> "$GITHUB_OUTPUT"

      - name: Attest the exact hosted runtime candidate
        id: runtime-candidate-attestation
        if: ${{ fromJSON(env.IMAGES).hosted.publish && env.DRY_RUN != 'true' }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: ${{ steps.runtime-candidate.outputs.candidate }}
          create-storage-record: false

      - name: Verify the hosted runtime image and signed candidate
        id: runtime-candidate-proof
        if: ${{ fromJSON(env.IMAGES).hosted.publish && env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          SOURCE_COMMIT: ${{ steps.meta.outputs.source_commit }}
          CANDIDATE: ${{ steps.runtime-candidate.outputs.candidate }}
          IMAGE_BUNDLE: ${{ steps.runtime-candidate.outputs.bundle }}
          CANDIDATE_ATTESTATION_BUNDLE: ${{ steps.runtime-candidate-attestation.outputs.bundle-path }}
          IMMUTABLE_IMAGE: ${{ steps.runtime-candidate.outputs.immutable_image }}
        run: |
          set -euo pipefail
          candidate_bundle="${CANDIDATE%.candidate-v1.json}.candidate.sigstore.json"
          cp "$CANDIDATE_ATTESTATION_BUNDLE" "$candidate_bundle"
          python3 infra/scripts/hosted_image_candidate.py verify \
            --candidate "$CANDIDATE" \
            --bundle "$IMAGE_BUNDLE" \
            --candidate-bundle "$candidate_bundle"
          docker pull "$IMMUTABLE_IMAGE"
          observed_version=$(docker run --rm --network=none "$IMMUTABLE_IMAGE" --version)
          test "$observed_version" = "exomem ${VERSION}"
          observed_revision=$(docker image inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            "$IMMUTABLE_IMAGE")
          test "$observed_revision" = "$SOURCE_COMMIT"
          echo "candidate_bundle=$candidate_bundle" >> "$GITHUB_OUTPUT"

      - name: Upload bounded runtime candidate workflow evidence
        if: ${{ fromJSON(env.IMAGES).hosted.publish && env.DRY_RUN != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosted-runtime-candidate-${{ steps.meta.outputs.source_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.runtime-candidate.outputs.candidate }}
            ${{ steps.runtime-candidate.outputs.bundle }}
            ${{ steps.runtime-candidate-proof.outputs.candidate_bundle }}
          if-no-files-found: error
          retention-days: 30

      - name: Retain the runtime candidate with the matching release
        if: ${{ fromJSON(env.IMAGES).hosted.publish && env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
          CANDIDATE: ${{ steps.runtime-candidate.outputs.candidate }}
          BUNDLE: ${{ steps.runtime-candidate.outputs.bundle }}
          CANDIDATE_BUNDLE: ${{ steps.runtime-candidate-proof.outputs.candidate_bundle }}
        run: gh release upload "$TAG" "$CANDIDATE" "$BUNDLE" "$CANDIDATE_BUNDLE"

      - name: Record the runtime candidate inputs
        if: ${{ fromJSON(env.IMAGES).hosted.publish && env.DRY_RUN != 'true' }}
        env:
          IMMUTABLE_IMAGE: ${{ steps.runtime-candidate.outputs.immutable_image }}
          CANDIDATE: ${{ steps.runtime-candidate.outputs.candidate }}
          BUNDLE: ${{ steps.runtime-candidate.outputs.bundle }}
          CANDIDATE_BUNDLE: ${{ steps.runtime-candidate-proof.outputs.candidate_bundle }}
        run: |
          {
            echo "Hosted runtime image: ${IMMUTABLE_IMAGE}"
            echo "Candidate asset: ${CANDIDATE}"
            echo "Image attestation bundle asset: ${BUNDLE}"
            echo "Candidate attestation bundle asset: ${CANDIDATE_BUNDLE}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push Exomem Cloud cell image (linux/amd64)
        id: cloud-build
        if: ${{ fromJSON(env.IMAGES).cloud.publish }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: cloud
          platforms: linux/amd64
          build-args: |
            EXOMEM_RELEASE_BUILD_TIME=${{ steps.meta.outputs.build_time }}
          push: ${{ env.DRY_RUN != 'true' }}
          tags: |
            ${{ env.LATEST == 'true' && 'ghcr.io/artexis10/exomem:cloud' || '' }}
            ${{ fromJSON(env.IMAGES).cloud.ref }}
            ghcr.io/artexis10/exomem:${{ steps.meta.outputs.source_commit }}-cloud
          labels: |
            org.opencontainers.image.revision=${{ steps.meta.outputs.source_commit }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ env.IMAGE_CACHE_CLOUD }}
          cache-to: ${{ env.DRY_RUN != 'true' && format('type=gha,mode=max,scope={0}', env.IMAGE_CACHE_CLOUD) || '' }}

      - name: Attest the exact Exomem Cloud cell image
        if: ${{ fromJSON(env.IMAGES).cloud.publish && env.DRY_RUN != 'true' }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-name: ghcr.io/artexis10/exomem
          subject-digest: ${{ steps.cloud-build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Record the cloud image tag and digest in the release notes
        if: ${{ fromJSON(env.IMAGES).cloud.publish && env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
          CLOUD_TAG: ${{ fromJSON(env.IMAGES).cloud.ref }}
          CLOUD_DIGEST: ${{ steps.cloud-build.outputs.digest }}
        run: |
          set -euo pipefail
          cloud_image="ghcr.io/artexis10/exomem@${CLOUD_DIGEST}"
          existing_body=$(gh release view "$TAG" --json body -q .body)
          {
            printf '%s\n\n' "$existing_body"
            echo "## Exomem Cloud cell image"
            echo "- Tag: \`${CLOUD_TAG}\`"
            echo "- Digest: \`${cloud_image}\`"
          } | gh release edit "$TAG" --notes-file -
          {
            echo "Cloud cell image tag: ${CLOUD_TAG}"
            echo "Cloud cell image digest: ${cloud_image}"
          } >> "$GITHUB_STEP_SUMMARY"

      # The platform chart consumes cellctl by digest (cellctl.image), so it
      # ships on the same release trigger as the cell image it rolls out.
      - name: Build and push Exomem Cloud cellctl image (linux/amd64)
        id: cellctl-build
        if: ${{ fromJSON(env.IMAGES).cellctl.publish }}
        uses: docker/build-push-action@v6
        with:
          context: infra/cellctl
          file: infra/cellctl/Dockerfile
          platforms: linux/amd64
          push: ${{ env.DRY_RUN != 'true' }}
          tags: |
            ${{ fromJSON(env.IMAGES).cellctl.ref }}
            ghcr.io/artexis10/exomem-cellctl:${{ steps.meta.outputs.source_commit }}
          labels: |
            org.opencontainers.image.revision=${{ steps.meta.outputs.source_commit }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ env.IMAGE_CACHE_CELLCTL }}
          cache-to: ${{ env.DRY_RUN != 'true' && format('type=gha,mode=max,scope={0}', env.IMAGE_CACHE_CELLCTL) || '' }}

      - name: Attest the exact Exomem Cloud cellctl image
        if: ${{ fromJSON(env.IMAGES).cellctl.publish && env.DRY_RUN != 'true' }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-name: ghcr.io/artexis10/exomem-cellctl
          subject-digest: ${{ steps.cellctl-build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Record the cellctl image tag and digest in the release notes
        if: ${{ fromJSON(env.IMAGES).cellctl.publish && env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
          CELLCTL_TAG: ${{ fromJSON(env.IMAGES).cellctl.ref }}
          CELLCTL_DIGEST: ${{ steps.cellctl-build.outputs.digest }}
        run: |
          set -euo pipefail
          cellctl_image="ghcr.io/artexis10/exomem-cellctl@${CELLCTL_DIGEST}"
          existing_body=$(gh release view "$TAG" --json body -q .body)
          {
            printf '%s\n\n' "$existing_body"
            echo "## Exomem Cloud cellctl image"
            echo "- Tag: \`${CELLCTL_TAG}\`"
            echo "- Digest: \`${cellctl_image}\`"
          } | gh release edit "$TAG" --notes-file -
          {
            echo "cellctl image tag: ${CELLCTL_TAG}"
            echo "cellctl image digest: ${cellctl_image}"
          } >> "$GITHUB_STEP_SUMMARY"
