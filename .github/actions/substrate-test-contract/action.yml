name: Substrate test contract
description: Check out the pinned canonical SQL used by cellctl integration tests
runs:
  using: composite
  steps:
    - name: Read the canonical SQL revision
      id: contract
      shell: bash
      run: |
        jq -r '"repository=\(.repository)", "ref=\(.ref)", "migration=\(.migration)", "grants=\(.grants)", "exports_migration=\(.exports_migration)", "custody_migration=\(.custody_migration)"' \
          infra/cellctl/tests/fixtures/substrate-contract.json >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        repository: ${{ steps.contract.outputs.repository }}
        ref: ${{ steps.contract.outputs.ref }}
        path: .substrate-test-contract
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          ${{ steps.contract.outputs.migration }}
          ${{ steps.contract.outputs.grants }}
          ${{ steps.contract.outputs.exports_migration }}
          ${{ steps.contract.outputs.custody_migration }}
    - name: Select the test contract checkout
      shell: bash
      run: echo "CELLCTL_SUBSTRATE_CONTRACT_ROOT=$GITHUB_WORKSPACE/.substrate-test-contract" >> "$GITHUB_ENV"
