{{- if or (eq .Values.workloadMode "initialize") (eq .Values.workloadMode "migrate") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.resourceName }}-init
  labels:
    {{- include "exomem-cell.labels" . | nindent 4 }}
    exomem.io/storage-init: "true"
  annotations:
    {{- include "exomem-cell.providerAnnotationsFor" (dict "root" . "key" "initJob") | nindent 4 }}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "exomem-cell.selectorLabels" . | nindent 8 }}
        exomem.io/storage-init: "true"
    spec:
      runtimeClassName: exomem-storage-init
      serviceAccountName: {{ .Values.resourceName }}
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exomem
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          args:
            - hosted
            - init
            - --contract-version
            - "1"
            - --request-file
            - /run/exomem/operator-requests/init.json
          env:
            - name: EXOMEM_LOG_DIR
              value: /dev
            - name: EXOMEM_AUTH_SESSION_KEYRING_FILE
              value: /run/exomem/authorization-session/keyring.json
            - name: EXOMEM_AUTH_SESSION_CONTROL_FILE
              value: /run/exomem/authorization-session/control.json
            - name: EXOMEM_AUTH_SESSION_MEMBERSHIP_FILE
              value: /run/exomem/authorization-session/serving-membership.json
            # Fresh initialization publishes the empty complete state manifest;
            # state-root-v1 moves legacy members. Both are explicit offline Job
            # work after binding initialization. The provisioner has removed
            # the runtime StatefulSet, and execute_hosted_init_v2 holds the
            # hosted lifetime lock while the state migrator holds its own lock.
            {{- if or (eq .Values.workloadMode "initialize") (eq .Values.migrationMode "state-root-v1") }}
            - name: EXOMEM_HOSTED_OFFLINE_STATE_MIGRATION
              value: "1"
            {{- end }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 1Gi
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER]
          volumeMounts:
            - name: data
              mountPath: /var/lib/exomem
            - name: credentials
              mountPath: /run/exomem/credentials
              readOnly: true
            - name: init-request
              mountPath: /run/exomem/operator-requests/init.json
              subPath: init.json
              readOnly: true
            - name: authorization-session-source
              mountPath: /run/exomem/authorization-session-source
              readOnly: true
            - name: authorization-session-custody
              mountPath: /run/exomem/authorization-session
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.resourceName }}-data
        - name: credentials
          secret:
            secretName: {{ .Values.credentialsSecretName }}
            defaultMode: 0444
        - name: init-request
          configMap:
            name: {{ .Values.resourceName }}-init-request
            defaultMode: 0444
        - name: authorization-session-source
          secret:
            secretName: {{ .Values.authorizationSessionSecretName }}
            defaultMode: 0440
        - name: authorization-session-custody
          emptyDir:
            medium: Memory
            sizeLimit: 256Ki
{{- end }}
