{{- if eq .Values.workloadMode "serve" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.resourceName }}
  labels:
    {{- include "exomem-cell.labels" . | nindent 4 }}
  annotations:
    {{- include "exomem-cell.providerAnnotationsFor" (dict "root" . "key" "statefulSet") | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ .Values.resourceName }}
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "exomem-cell.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "exomem-cell.selectorLabels" . | nindent 8 }}
      annotations:
        exomem.io/authorization-session-revision: {{ required "authorizationSessionRevision is required" .Values.authorizationSessionRevision | quote }}
    spec:
      serviceAccountName: {{ .Values.resourceName }}
      automountServiceAccountToken: false
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: authorization-session-custody
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          command: ["python"]
          args:
            - -m
            - exomem.governance.authorization_hosted_mount
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 16Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: {{ .Values.runtimeUid }}
            runAsGroup: {{ .Values.runtimeGid }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: authorization-session-source
              mountPath: /run/exomem/authorization-session-source
              readOnly: true
            - name: authorization-session-custody
              mountPath: /run/exomem/authorization-session
      containers:
        - name: exomem
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          args:
            - --transport
            - http
            - --port
            - "8765"
          ports:
            - name: http
              containerPort: 8765
              protocol: TCP
          env:
            - name: EXOMEM_HOSTED_CELL
              value: "1"
            - name: EXOMEM_HOSTED_CELL_ID
              value: {{ .Values.cellId | quote }}
            - name: EXOMEM_HOSTED_VAULT_ID
              value: {{ .Values.vaultId | quote }}
            - name: EXOMEM_HOSTED_RUNTIME_UID
              value: {{ .Values.runtimeUid | quote }}
            - name: EXOMEM_HOSTED_RUNTIME_GID
              value: {{ .Values.runtimeGid | quote }}
            - name: EXOMEM_VAULT_PATH
              value: /var/lib/exomem/vault
            - name: EXOMEM_HOSTED_STATE_ROOT
              value: /var/lib/exomem/state
            - name: EXOMEM_LOG_DIR
              value: /var/lib/exomem/logs
            - name: TMPDIR
              value: /var/lib/exomem/state/tmp/runtime
            - name: HOME
              value: /var/lib/exomem/state/home
            - name: EXOMEM_HOSTED_PROTOCOL_VERSION
              value: {{ .Values.expectedProtocol | quote }}
            - name: EXOMEM_HOSTED_EXPECTED_RELEASE
              value: {{ .Values.expectedRelease | quote }}
            - name: EXOMEM_HOSTED_WORKER_POLICY_DIGEST
              value: {{ .Values.workerPolicyDigest | quote }}
            - name: EXOMEM_HOSTED_RECORDS_READER_VERSION
              value: {{ printf "%.0f" .Values.recordsReaderVersion | quote }}
            - name: EXOMEM_HOSTED_LIFECYCLE_ACTIONS_ENABLED
              value: {{ .Values.lifecycleActionsEnabled | quote }}
            - name: EXOMEM_AUTH_SESSION_KEYRING_FILE
              value: /run/exomem/authorization-session/private/keyring.json
            - name: EXOMEM_AUTH_SESSION_CONTROL_FILE
              value: /run/exomem/authorization-session/private/control.json
            - name: EXOMEM_AUTH_SESSION_MEMBERSHIP_FILE
              value: /run/exomem/authorization-session/private/serving-membership.json
            - name: EXOMEM_AUTH_SESSION_REPLICA_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: EXOMEM_HOSTED_STORAGE_LIMIT_BYTES
              value: {{ printf "%.0f" .Values.storageLimitBytes | quote }}
            - name: EXOMEM_HOSTED_UPLOAD_LIMIT_BYTES
              value: {{ printf "%.0f" .Values.uploadLimitBytes | quote }}
            - name: EXOMEM_HOSTED_WORKER_LIMIT
              value: {{ printf "%.0f" .Values.workerLimit | quote }}
            - name: EXOMEM_HOSTED_FEATURE_GRANTS
              value: {{ .Values.featureGrants | quote }}
            # torch sizes its thread pool from the host's core count, not the
            # cgroup's CPU limit, so every cell on a four-core node would spawn
            # four compute threads and the fleet would spend its budget on
            # context switching. One thread per cell matches the cap to the
            # cores: four cells, four embedding threads, no oversubscription.
            # It is also the more CPU-efficient point — measured 0.56 CPU-s per
            # chunk at one thread against 0.64 at two — which is what matters
            # when cells contend. The CPU limit stays above this so non-embedding
            # work can still burst.
            - name: OMP_NUM_THREADS
              value: {{ .Values.embeddingThreads | quote }}
            - name: MKL_NUM_THREADS
              value: {{ .Values.embeddingThreads | quote }}
            - name: TOKENIZERS_PARALLELISM
              value: "false"
            - name: EXOMEM_HOSTED_TRANSFER_BROWSER_ORIGIN
              value: {{ .Values.browserOrigin | quote }}
            - name: EXOMEM_HOSTED_TRANSFER_HOST
              value: {{ .Values.transferHostname | quote }}
          # Measured on CPU torch 2.13 with BAAI/bge-base-en-v1.5 at the encode
          # batch this runtime actually uses (8 on CPU): 531 MiB resident once
          # the idle reaper has unloaded the model, 791 MiB warm, 918 MiB peak
          # mid-encode. The old 1Gi limit predates embeddings and would OOM-kill
          # a cell inside its first batch.
          #
          # Peak per cell is what decides how many tenants a node carries, so it
          # is measured rather than guessed. Requests reserve the warm figure so
          # the fleet schedules; the limit leaves headroom over peak for the
          # server, sqlite, and index caches without reserving memory that a
          # mostly-idle cell never touches.
          resources:
            requests:
              cpu: {{ .Values.cpuRequest | quote }}
              memory: {{ .Values.memoryRequest | quote }}
            limits:
              cpu: {{ .Values.cpuLimit | quote }}
              memory: {{ .Values.memoryLimit | quote }}
              ephemeral-storage: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: {{ .Values.runtimeUid }}
            runAsGroup: {{ .Values.runtimeGid }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 0
            periodSeconds: 2
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 2
          volumeMounts:
            - name: data
              mountPath: /var/lib/exomem/vault
              subPath: vault
            - name: data
              mountPath: /var/lib/exomem/state
              subPath: state
            - name: data
              mountPath: /var/lib/exomem/logs
              subPath: logs
            - name: credentials
              mountPath: /run/exomem/credentials
              readOnly: true
            - name: authorization-session-custody
              mountPath: /run/exomem/authorization-session
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.resourceName }}-data
        - name: credentials
          secret:
            secretName: {{ .Values.credentialsSecretName }}
            defaultMode: 0444
        - name: authorization-session-source
          secret:
            secretName: {{ .Values.authorizationSessionSecretName }}
            defaultMode: 0444
        - name: authorization-session-custody
          emptyDir:
            medium: Memory
            sizeLimit: 256Ki
{{- end }}
