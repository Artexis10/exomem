apiVersion: v1
kind: Namespace
metadata:
  name: exomem-platform
  annotations:
    helm.sh/resource-policy: keep
    meta.helm.sh/release-name: exomem-platform
    meta.helm.sh/release-namespace: exomem-platform
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: exomem-hosted
    # The pinned CSI node plugin requires hostPath/device access. Tenant workloads
    # never run here; platform admission and exact Helm values own this namespace.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.35
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.35
---
apiVersion: v1
kind: Namespace
metadata:
  name: exomem-system
  annotations:
    helm.sh/resource-policy: keep
    meta.helm.sh/release-name: exomem-platform
    meta.helm.sh/release-namespace: exomem-platform
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: exomem-hosted
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.35
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.35
---
# harden-exomem-cloud-operator-access D1: Traefik and the public Cloud route
# run here, so the internet-facing edge's Role grants Secrets in this
# namespace alone, and the only Secret here is the certificate it serves.
# Enforce stays privileged because Traefik binds hostPort 443, which Baseline
# (and therefore restricted) refuses with no allow-list; restricted still
# audits and warns. Only the deploy identity creates pods here.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ required "traefik.namespaceOverride names the edge namespace" .Values.traefik.namespaceOverride }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: exomem-cloud
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.35
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.35
