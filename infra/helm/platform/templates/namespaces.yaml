apiVersion: v1
kind: Namespace
metadata:
  name: exomem-platform
  annotations:
    helm.sh/resource-policy: keep
    meta.helm.sh/release-name: exomem-platform
    meta.helm.sh/release-namespace: exomem-platform
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: exomem-hosted
    # The pinned CSI node plugin requires hostPath/device access. Tenant workloads
    # never run here; platform admission and exact Helm values own this namespace.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.35
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.35
---
apiVersion: v1
kind: Namespace
metadata:
  name: exomem-system
  annotations:
    helm.sh/resource-policy: keep
    meta.helm.sh/release-name: exomem-platform
    meta.helm.sh/release-namespace: exomem-platform
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: exomem-hosted
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.35
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.35
---
# harden-exomem-cloud-operator-access D1: Traefik and the public Cloud route
# run here, so the internet-facing edge's Role grants Secrets in this
# namespace alone, and the only Secret here is the certificate it serves.
# Enforce stays privileged because Traefik binds hostPort 443, which Baseline
# (and therefore restricted) refuses with no allow-list; restricted still
# audits and warns. Only the deploy identity creates pods here.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ required "traefik.namespaceOverride names the edge namespace" .Values.traefik.namespaceOverride }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: exomem-cloud
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.35
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.35
---
# harden-exomem-cloud-operator-access D1 (task 1.6): the edge namespace is
# default-deny. A compromised edge process reaches no other in-cluster
# service, node port or the cloud metadata endpoint.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Values.traefik.namespaceOverride }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
{{- $apiServerCidrs := .Values.edge.apiServerCidrs }}
{{- if not $apiServerCidrs }}
{{- fail "edge.apiServerCidrs must name the K3s server's address as /32: Traefik watches its routes through the API server" }}
{{- end }}
{{- range $apiServerCidrs }}
{{- if not (regexMatch "^([0-9]{1,3}\\.){3}[0-9]{1,3}/32$" .) }}
{{- fail (printf "edge.apiServerCidrs entries must be single IPv4 hosts (/32), not %q" .) }}
{{- end }}
{{- end }}
# Traefik: ingress only on websecure, the container port behind hostPort 443,
# from anywhere; kubelet probes come from the node, which kube-router always
# admits. Egress only to the gateway pods, cluster DNS and the API server.
# kube-router evaluates egress after kube-proxy's DNAT, so the API server is
# the server node's own address on 6443 (`kubectl get endpoints kubernetes`),
# never the kubernetes Service IP; a rule naming the Service IP was proven
# not to match on K3s.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik
  namespace: {{ .Values.traefik.namespaceOverride }}
spec:
  podSelector:
    matchLabels:
      exomem.io/ingress: traefik
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: websecure
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.cellctl.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: exomem-cloud-gateway
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        {{- range $apiServerCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - port: 6443
          protocol: TCP
