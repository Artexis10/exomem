{{- if not .Values.mediaEdge.enabled }}
{{- /*
add-cloud-media-store D12: with the edge off, cellctl signs no credential, so a
cell the edge still serves or drains keeps its store identity alone and every
evicted original becomes unreadable. Draining cells stay in cellctl's active
set until their record shows no evicted original, so an upgrade that turns the
edge off reads the live set and refuses while it lists any cell. A set that
exists but cannot be read refuses too: it proves nothing drained.

collect-released-media D3: the set also lists the collectors, the cells on
mediaEdge.collectCells whose backup Jobs condemn their released media through
the edge, a retained cell included. With the edge off that collection would
stop without a word, so the check refuses while any collector is listed, or
while the list cannot be read. Emptying mediaEdge.collectCells first stops it.

`lookup` returns nothing in `helm template`, in a client-side dry run and in
`helm rollback`, so those three skip this check.
*/ -}}
{{- $published := lookup "v1" "ConfigMap" .Values.cellctl.namespace "exomem-media-edge-active-set" }}
{{- if $published }}
{{- $set := fromJson (index (default dict $published.data) "active-set.json" | default "") }}
{{- if not (kindIs "map" $set.cells) }}
{{- fail "mediaEdge.enabled=false: the media edge active set cannot be read, so no cell is known to have drained. Turn the edge on until cellctl publishes it again (runbook: Turn the edge off)" }}
{{- else if $set.cells }}
{{- fail (printf "mediaEdge.enabled=false: the media edge active set still lists %s. Take each cell off mediaEdge.cellIds with the edge on, and turn the edge off once the set lists no cell (runbook: Turn the edge off)" (keys $set.cells | sortAlpha | join ", ")) }}
{{- else if and (hasKey $set "collectors") (not (kindIs "map" $set.collectors)) }}
{{- fail "mediaEdge.enabled=false: the collectors of the media edge active set cannot be read, so no backup is known to have stopped collecting. Turn the edge on until cellctl publishes it again (runbook: Turn the edge off)" }}
{{- else if $set.collectors }}
{{- fail (printf "mediaEdge.enabled=false: the media edge active set still lists the collectors %s, whose backups condemn released media through the edge. Take each cell off mediaEdge.collectCells with the edge on, and turn the edge off once the set lists no collector (runbook: Turn the edge off)" (keys $set.collectors | sortAlpha | join ", ")) }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.mediaEdge.enabled }}
{{- include "exomem.requirePrivateRangesDenied" (dict "root" . "feature" "mediaEdge") }}
{{- if not (regexMatch "^[^\\s]+@sha256:[a-f0-9]{64}$" .Values.artifactBroker.image) }}
{{- fail "mediaEdge runs the broker's image: artifactBroker.image must be a digest-pinned reference" }}
{{- end }}
{{- $edge := .Values.mediaEdge }}
{{- /* The Service address is the endpoint's host; the schema fixes the form and the port. */ -}}
{{- $edgeIp := $edge.endpoint | trimPrefix "http://" | trimSuffix "/" | splitList ":" | first }}
{{- /* A mounted file path the edge reads, and the one state directory it writes. */ -}}
{{- $keyDir := "/run/exomem/media-edge/key" }}
{{- $setDir := "/run/exomem/media-edge/active-set" }}
{{- $stateDir := "/var/lib/exomem-media-edge" }}
{{- /* automate-cell-storage-deletion D3: the relayed grants, and the chart-owned grant keys and hold list. */ -}}
{{- $grantsDir := "/run/exomem/media-edge/deletions" }}
{{- $policyDir := "/run/exomem/cell-deletion" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exomem-media-edge
  namespace: {{ .Values.cellctl.namespace }}
  labels:
    app.kubernetes.io/name: exomem-media-edge
    app.kubernetes.io/part-of: exomem-cloud
spec:
  replicas: 1
  strategy:
    # One writer on a ReadWriteOnce state volume: the old pod is gone before the new one starts.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: exomem-media-edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: exomem-media-edge
        app.kubernetes.io/part-of: exomem-cloud
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: media-edge
          image: {{ .Values.artifactBroker.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "exomem.media_edge"]
          ports:
            - name: http
              containerPort: 8769
              protocol: TCP
          env:
            - name: EXOMEM_MEDIA_EDGE_PORT
              value: "8769"
            - name: EXOMEM_MEDIA_EDGE_PUBLIC_KEY_FILE
              value: {{ printf "%s/%s" $keyDir $edge.publicKeySecretKey | quote }}
            - name: EXOMEM_MEDIA_EDGE_ACTIVE_SET_FILE
              value: {{ printf "%s/active-set.json" $setDir | quote }}
            - name: EXOMEM_MEDIA_EDGE_STATE_DIR
              value: {{ $stateDir | quote }}
            - name: EXOMEM_MEDIA_EDGE_BUCKET
              value: {{ $edge.bucket | quote }}
            - name: EXOMEM_MEDIA_EDGE_MAX_OBJECT_BYTES
              value: {{ int64 $edge.maxObjectBytes | quote }}
            - name: EXOMEM_MEDIA_EDGE_B2_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $edge.b2SecretName }}
                  key: keyId
            - name: EXOMEM_MEDIA_EDGE_B2_APPLICATION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $edge.b2SecretName }}
                  key: applicationKey
            # The purge pass lists a deleted cell's prefix with this list-only key. The edge purges only
            # when the key and all three files are present, so a missing Secret leaves the edge serving
            # and the cell purge undone, which the key watcher reports per cell.
            - name: EXOMEM_MEDIA_EDGE_LIST_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $edge.purgeListSecretName }}
                  key: keyId
                  optional: true
            - name: EXOMEM_MEDIA_EDGE_LIST_APPLICATION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $edge.purgeListSecretName }}
                  key: applicationKey
                  optional: true
            - name: EXOMEM_MEDIA_EDGE_GRANTS_FILE
              value: {{ printf "%s/grants.json" $grantsDir | quote }}
            - name: EXOMEM_MEDIA_EDGE_GRANT_PUBLIC_KEYS_FILE
              value: {{ printf "%s/grant-public-keys.json" $policyDir | quote }}
            - name: EXOMEM_MEDIA_EDGE_HOLD_LIST_FILE
              value: {{ printf "%s/hold-cells.json" $policyDir | quote }}
            - name: TMPDIR
              value: /tmp
          resources:
            {{- $edge.resources | toYaml | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: public-key
              mountPath: {{ $keyDir }}
              readOnly: true
            - name: active-set
              mountPath: {{ $setDir }}
              readOnly: true
            - name: state
              mountPath: {{ $stateDir }}
            - name: cell-deletions
              mountPath: {{ $grantsDir }}
              readOnly: true
            - name: cell-deletion-policy
              mountPath: {{ $policyDir }}
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        # The verifying key only. The signing key stays with cellctl.
        - name: public-key
          secret:
            secretName: {{ $edge.publicKeySecretName }}
            items:
              - key: {{ $edge.publicKeySecretKey }}
                path: {{ $edge.publicKeySecretKey }}
        # The one ConfigMap key the edge reads; cellctl's own bookkeeping key stays out of the pod.
        - name: active-set
          configMap:
            name: exomem-media-edge-active-set
            items:
              - key: active-set.json
                path: active-set.json
        - name: state
          persistentVolumeClaim:
            claimName: exomem-media-edge-state
        # cellctl creates this ConfigMap with its first grant; until then the edge reads no grant.
        - name: cell-deletions
          configMap:
            name: exomem-cell-deletions
            optional: true
            items:
              - key: grants.json
                path: grants.json
        - name: cell-deletion-policy
          configMap:
            name: exomem-cell-deletion-policy
---
# The edge's recovery state outlives its pod and its release: losing it orphans provider writes.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: exomem-media-edge-state
  namespace: {{ .Values.cellctl.namespace }}
  labels:
    app.kubernetes.io/name: exomem-media-edge
    app.kubernetes.io/part-of: exomem-cloud
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- if $edge.state.storageClassName }}
  storageClassName: {{ $edge.state.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $edge.state.size | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: exomem-media-edge
  namespace: {{ .Values.cellctl.namespace }}
spec:
  type: ClusterIP
  clusterIP: {{ $edgeIp | quote }}
  selector:
    app.kubernetes.io/name: exomem-media-edge
  ports:
    - name: http
      port: 8769
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: exomem-media-edge
  namespace: {{ .Values.cellctl.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: exomem-media-edge
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        # cellctl reads the generation the edge reports, to learn when a revocation has taken effect.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cellctl
        # D12, decided by the operator on 2026-10-31: the runtime of every cell namespace that cellctl
        # labels while the cell's store is served or draining. mediaEdge.cellIds only chooses the served
        # cells, so a cell taken off that list keeps its access until it drains.
        - namespaceSelector:
            matchLabels:
              exomem.io/media-edge-access: "true"
            matchExpressions:
              - key: exomem.io/cloud-cell
                operator: Exists
          podSelector:
            matchLabels:
              app.kubernetes.io/name: exomem-cell
            matchExpressions:
              - key: exomem.io/cell-job
                operator: DoesNotExist
        # add-cloud-media-store D8: the export pack of a cell namespace with the same label. It reads the
        # cell's evicted originals with the runtime's edge credential; job-egress gives it no public egress.
        - namespaceSelector:
            matchLabels:
              exomem.io/media-edge-access: "true"
            matchExpressions:
              - key: exomem.io/cloud-cell
                operator: Exists
          podSelector:
            matchLabels:
              app.kubernetes.io/name: exomem-cell
              exomem.io/cell-job: export-pack
        # collect-released-media D3: the backup Job of every cell namespace. A retained cell's namespace has no
        # access label, and its backups still condemn its released names. The edge admits a collector
        # credential only for a cell that its active set lists, and only to condemn.
        - namespaceSelector:
            matchExpressions:
              - key: exomem.io/cloud-cell
                operator: Exists
          podSelector:
            matchLabels:
              app.kubernetes.io/name: exomem-cell
              exomem.io/cell-job: backup
      ports:
        - protocol: TCP
          port: 8769
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- .Values.cells.jobEgressExcept | toYaml | nindent 14 }}
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
