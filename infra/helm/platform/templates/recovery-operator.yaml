apiVersion: v1
kind: ServiceAccount
metadata:
  name: exomem-init-retry-recovery
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: exomem-hosted
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: exomem-init-retry-recovery
rules:
  - apiGroups: [""]
    resources: ["namespaces", "persistentvolumeclaims", "persistentvolumes", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: exomem-init-retry-recovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: exomem-init-retry-recovery
subjects:
  - kind: ServiceAccount
    name: exomem-init-retry-recovery
    namespace: {{ .Release.Namespace }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: exomem-init-retry-recovery-no-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: exomem-init-retry-recovery
  policyTypes: ["Ingress"]
  ingress: []
