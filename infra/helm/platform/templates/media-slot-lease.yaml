{{- if .Values.mediaSlotLease.enabled }}
# cloud-multimodal-processing D10: the node media-slot lease. It keeps in-memory
# state only, mounts no Secret or service-account token, and has no egress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exomem-media-slot-lease
  namespace: {{ .Values.cellctl.namespace }}
  labels:
    app.kubernetes.io/name: exomem-media-slot-lease
    app.kubernetes.io/part-of: exomem-cloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: exomem-media-slot-lease
  template:
    metadata:
      labels:
        app.kubernetes.io/name: exomem-media-slot-lease
        app.kubernetes.io/part-of: exomem-cloud
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: media-slot-lease
          image: {{ .Values.mediaSlotLease.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "exomem.media_slot_lease"]
          ports:
            - name: http
              containerPort: 8768
              protocol: TCP
          env:
            - name: EXOMEM_MEDIA_SLOT_POOL_MIB
              value: {{ .Values.mediaSlotLease.poolMiB | quote }}
            - name: EXOMEM_MEDIA_SLOT_QUEUE_SECONDS
              value: {{ .Values.mediaSlotLease.queueSeconds | quote }}
            - name: EXOMEM_MEDIA_SLOT_MAX_JOB_SECONDS
              value: {{ .Values.mediaSlotLease.maxJobSeconds | quote }}
            - name: EXOMEM_MEDIA_SLOT_MARGIN_SECONDS
              value: {{ .Values.mediaSlotLease.leaseMarginSeconds | quote }}
            - name: TMPDIR
              value: /tmp
          resources:
            {{- .Values.mediaSlotLease.resources | toYaml | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: exomem-media-slot-lease
  namespace: {{ .Values.cellctl.namespace }}
spec:
  type: ClusterIP
  {{- if .Values.mediaSlotLease.endpoint }}
  clusterIP: {{ .Values.mediaSlotLease.endpoint | trimPrefix "http://" | trimSuffix "/" | splitList ":" | first | quote }}
  {{- end }}
  selector:
    app.kubernetes.io/name: exomem-media-slot-lease
  ports:
    - name: http
      port: 8768
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: exomem-media-slot-lease
  namespace: {{ .Values.cellctl.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: exomem-media-slot-lease
  # Egress is listed with no rule: the service reaches nothing, not even DNS.
  policyTypes: [Ingress, Egress]
  {{- if .Values.mediaSlotLease.allCells }}
  ingress:
    - from:
        # Every cell runtime, including cells created later; never a backup
        # or restore Job. The listed cells are a subset and add no peer here.
        - namespaceSelector:
            matchExpressions:
              - key: exomem.io/cloud-cell
                operator: Exists
          podSelector:
            matchLabels:
              app.kubernetes.io/name: exomem-cell
            matchExpressions:
              - key: exomem.io/cell-job
                operator: DoesNotExist
      ports:
        - protocol: TCP
          port: 8768
  {{- else if .Values.mediaSlotLease.cellIds }}
  ingress:
    - from:
        {{- range .Values.mediaSlotLease.cellIds }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ printf "exo-cell-%s" . }}
              exomem.io/cloud-cell: {{ . }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: exomem-cell
              exomem.io/cell: {{ . }}
            matchExpressions:
              - key: exomem.io/cell-job
                operator: DoesNotExist
        {{- end }}
      ports:
        - protocol: TCP
          port: 8768
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
