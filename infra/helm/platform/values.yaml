gateway:
  enabled: false
  # Supplied by the reviewed Substrate image release; never a mutable tag.
  image: ""
  originHostname: ""
  replicas: 1
  maxInflight: 16
  databaseSecretName: exomem-gateway-database
  databaseSecretKey: url
  controlPlaneKeySecretName: exomem-gateway-control-plane-key
  controlPlaneKeySecretKey: key
  # Explicit database endpoint addresses, resolved during deployment preflight.
  # Refresh these deliberately when the database provider changes its addresses.
  databaseEgressCidrs: []

cloudflared:
  image: docker.io/cloudflare/cloudflared:2026.7.0@sha256:5e49861633763e8933475477c20bae6039ed47f32c1d267a34babc347f28f0df
  replicas: 1
  tokenSecretName: exomem-cloudflared-token
  tokenSecretKey: token

provisioner:
  deploymentLockJson: ""
  deploymentLockSha256: ""
  runtimeSelection: ""
  replicas: 1
  databaseSchema: exomem_provisioner
  databaseRole: exomem_provisioner_runtime
  trustedProxyIps: 10.0.0.0/8
  cellChartPath: /opt/exomem/charts/cell
  cellChartVersion: 0.1.0
  helmBinary: /opt/exomem/bin/helm
  helmVersion: 3.19.4
  controlHostname: ""
  transferHostname: ""
  browserOrigin: https://substratesystems.io
  location: fsn1
  internalOrigin: http://{resource}.{namespace}.svc.cluster.local:8765
  pollSeconds: "1"
  # Ceiling for the routine worker's idle backoff. It must stay above the database's
  # autosuspend timeout, or an idle fleet keeps a serverless endpoint awake for nothing.
  idlePollSeconds: "300"
  providerRecoveryPublicKeySecret:
    name: exomem-provider-recovery-verifier
    key: public-key
  providerRecoverySigningKeySecret:
    name: exomem-provider-recovery-signer
    key: private-key
  capacityReceiptPublicKeySecret:
    name: exomem-capacity-receipt-verifier
    key: public-key

admission:
  namespaceContractOperatorUsernames:
    - system:admin

scheduler:
  contractVersion: 1
  contractSha256: 03ec8f7ae6f1a221ef8ac73e390be029b180df08e0b55806812496ea9fca7733
  secretName: exomem-hosted-scheduler
  secretKey: secret

observability:
  contractSha256: 30671acff9bfc15fa825fbc72292f6435cf3ce994c0de04f4649ee46ee343f63
  alertDeliverySecretName: exomem-hosted-alert-delivery
  alertDeliverySecretKey: url

capacityCollector:
  schedule: "*/5 * * * *"
  contractSha256: 9339f62fd322c1d82361ec90506d45e840a38d7abd3f7948507d03adcc572e76
  hcloudServerId: 0
  stateConfigMap: exomem-capacity-receipt
  privateKeySecret:
    name: exomem-capacity-receipt-signer
    key: private-key
  hcloudTokenSecret:
    name: exomem-hcloud-capacity-reader
    key: token

durability:
  contractSha256: 8381b6b85f9afa45eb25323a4b4aedba3ecc1234aa632b38a852f86c14fb48c6
  storageContractSha256: 68e26665af9a48c831c975bc96afb03fbf47e229f89a3c13bc852809787de0f5
  b2Endpoint: ""
  b2Region: ""
  recoveryBucket: ""
  userExportBucket: ""
  databaseBackupBucket: ""
  databaseBackup:
    proofTenantId: ""
    proofCellId: ""
    sourceService: substrate-production
    maintenanceService: postgres-maintenance
    scratchService: exomem-restore-verification
    scratchDatabase: exomem_restore_verification
    expectedRestoreOwner: substrate
