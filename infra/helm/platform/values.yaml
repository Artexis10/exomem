  controller:
    hcloudToken:
      value: ""
      existingSecret:
        name: exomem-hcloud-csi-token
        key: token
    hcloudVolumeDefaultLocation: fsn1
    image:
      hcloudCSIDriver:
        name: docker.io/hetznercloud/hcloud-csi-driver
        tag: v2.21.1@sha256:79b979d2fc7b46fdddab19e619c65faa201d0d76080765f0ec4b1969e0abe33f
        pullPolicy: IfNotPresent
  node:
    image:
      hcloudCSIDriver:
        name: docker.io/hetznercloud/hcloud-csi-driver
        tag: v2.21.1@sha256:79b979d2fc7b46fdddab19e619c65faa201d0d76080765f0ec4b1969e0abe33f
        pullPolicy: IfNotPresent

traefik:
  image:
    registry: docker.io
    repository: traefik
    digest: sha256:21a3d83696379bac6434bb32e1dde0aff0e84ef2abd053ed3db87d3f45e749b2
  versionOverride: v3.7.6
  deployment:
    replicas: 1
    labels:
      exomem.io/ingress: traefik
    podLabels:
      exomem.io/ingress: traefik
  service:
    # Traefik 41.x takes the service type at service.spec.type; a bare
    # `service.type` is not a key in this chart and was silently ignored, so the
    # subchart default of LoadBalancer applied. The node runs k3s with servicelb
    # disabled, so a LoadBalancer Service never gets an address and
    # `helm --wait` can never return. Ingress arrives through the Cloudflare
    # Tunnel, which dials traefik from inside the cluster.
    spec:
      type: ClusterIP
  ports:
    web:
      port: 8000
      exposedPort: 80
      # The tunnel terminates TLS at Cloudflare and dials this entrypoint over
      # plain HTTP, so traefik must be told the hop in front of it is trusted or
      # it rewrites X-Forwarded-Proto to http. The provisioner refuses any
      # /cells/* request whose scheme is not https, so without this every
      # control-plane call fails closed. Narrower than the 10.0.0.0/8 the
      # provisioner already trusts for the same header.
      forwardedHeaders:
        trustedIPs:
          - 10.42.0.0/16
    websecure:
      expose:
        default: false
  providers:
    kubernetesCRD:
      enabled: true
      allowCrossNamespace: false
    kubernetesIngress:
      enabled: false
  accessLog:
    enabled: false
