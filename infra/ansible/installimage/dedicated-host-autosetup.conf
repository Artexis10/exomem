# Hetzner installimage autosetup for an Exomem dedicated K3s agent
# (docs/runbooks/hosted/dedicated-host.md). Copy it to /autosetup in the
# rescue system, replace the REPLACE_ values, and run `installimage`.
#
# The OS gets a small RAID1 on the first partitions of both disks. The rest of
# each disk stays unallocated: the runbook adds one unformatted partition per
# disk in the free space, and the dedicated_host role builds the encrypted
# cell storage there. On a server with separate data disks, list only the two
# OS disks here and leave the data disks out entirely.
#
# No swap partition: K3s nodes run without swap, as the Cloud nodes do.

DRIVE1 REPLACE_WITH_FIRST_DISK
DRIVE2 REPLACE_WITH_SECOND_DISK

SWRAID 1
SWRAIDLEVEL 1

HOSTNAME REPLACE_WITH_INVENTORY_NAME

BOOTLOADER grub

PART /boot/efi esp  256M
PART /boot     ext4 1G
PART /         ext4 100G

IMAGE /root/.oldroot/nfs/install/../images/Ubuntu-2404-noble-amd64-base.tar.gz
