---
- name: Apply K3s kernel settings
  ansible.builtin.command: /usr/sbin/sysctl --system
  changed_when: true

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart K3s
  ansible.builtin.systemd_service:
    name: "{{ k3s_service_name }}"
    state: restarted

- name: Restart WireGuard
  ansible.builtin.systemd_service:
    name: wg-quick@{{ k3s_wireguard_interface }}
    state: restarted

- name: Apply netplan
  ansible.builtin.command:
    argv: [/usr/sbin/netplan, apply]
  changed_when: true
