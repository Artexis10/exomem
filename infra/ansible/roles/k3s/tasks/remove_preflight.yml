---
# add-cloud-node-provisioning N6: refuse a removal that would leave cellctl's
# admission over-committed. Uses cellctl's own formula (D9):
#   cell_slots(node) = allocatable - headroom - non-cell attachments
# over the remaining Ready, schedulable nodes with a known CSI limit, and
# counts cell PVCs rather than attachments, because stopped cells still own
# their volumes. The target's own non-cell volumes must also move.
#
# Inputs (parsed `kubectl get -o json` documents): k3s_remove_nodes_doc,
# k3s_remove_csinodes_doc, k3s_remove_attachments_doc, k3s_remove_pvs_doc,
# k3s_remove_pvcs_doc, k3s_remove_statefulsets_doc; and k3s_remove_node.
- name: Find the cells whose volume is on the target
  ansible.builtin.set_fact:
    # A cell's local volume is pinned to one node, and only its pods and Jobs
    # run there; a Hetzner volume is on the node it is attached to.
    k3s_remove_local_cells: >-
      {%- set cells = [] -%}
      {%- for pv in k3s_remove_pvs_doc['items'] if pv.spec.claimRef is defined
          and (pv.spec.claimRef.namespace | default('')).startswith(k3s_cell_namespace_prefix)
          and (pv.spec.csi | default({})).driver | default('') == k3s_local_storage_driver -%}
        {%- for term in ((pv.spec.nodeAffinity | default({})).required | default({})).nodeSelectorTerms | default([]) -%}
          {%- for expression in term.matchExpressions | default([])
              if expression.key == k3s_local_storage_topology_key and expression.operator == 'In'
              and k3s_remove_node in expression['values'] | default([]) -%}
            {%- set _ = cells.append({'namespace': pv.spec.claimRef.namespace,
                                      'retained': (pv.status | default({})).phase | default('') == 'Released'}) -%}
          {%- endfor -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ cells }}
    k3s_remove_attached_cells: >-
      {%- set claims = {} -%}
      {%- for pv in k3s_remove_pvs_doc['items'] if pv.spec.claimRef is defined -%}
        {%- set _ = claims.update({pv.metadata.name: pv.spec.claimRef.namespace | default('')}) -%}
      {%- endfor -%}
      {%- set cells = [] -%}
      {%- for attachment in k3s_remove_attachments_doc['items']
          if attachment.spec.attacher == k3s_csi_driver and attachment.spec.nodeName == k3s_remove_node
          and (attachment.status.attached | default(false)) -%}
        {%- set namespace = claims.get(attachment.spec.source.persistentVolumeName | default(''), '') -%}
        {%- if namespace.startswith(k3s_cell_namespace_prefix) -%}
          {%- set _ = cells.append(namespace) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ cells }}

- name: Find cell maintenance holds in flight on the target
  ansible.builtin.set_fact:
    k3s_remove_holds: >-
      {{ k3s_remove_statefulsets_doc['items']
         | selectattr('metadata.namespace', 'in',
                      k3s_remove_local_cells | map(attribute='namespace') | list + k3s_remove_attached_cells)
         | selectattr('metadata.annotations', 'defined')
         | selectattr('metadata.annotations', 'contains', 'exomem.io/hold')
         | map(attribute='metadata.namespace') | list }}

- name: Refuse a removal while a cell backup, restore or upgrade holds a cell on the target
  ansible.builtin.assert:
    that:
      - k3s_remove_holds | length == 0
    fail_msg: >-
      Cell maintenance is in flight ({{ k3s_remove_holds | join(', ') }}); a drain
      would evict its Job. Retry once no exomem.io/hold annotation remains.

# move-cloud-cells-to-local-storage D4. Prevents: deleting the Node of an agent
# that still holds a cell's live local volume, which makes cellctl relocate that
# cell from its last backup and lose up to an hour of its writes, from a node
# that may be healthy. When it fires wrongly, the removal waits until the
# operator relocates those cells first; the operator pays, and no tenant does.
# A volume a relocation retained (Released) holds no live cell.
- name: Refuse a removal while a cell still lives on the target's local storage
  ansible.builtin.assert:
    that:
      - k3s_remove_live_local | length == 0
    fail_msg: >-
      {{ k3s_remove_node }} still holds the live local volume of {{ k3s_remove_live_local | join(', ') }}.
      Relocate those cells first (docs/runbooks/cloud-node-loss.md).
  vars:
    k3s_remove_live_local: >-
      {{ k3s_remove_local_cells | rejectattr('retained') | map(attribute='namespace') | unique | list }}

- name: Find desired cell templates selecting the target reservation
  ansible.builtin.set_fact:
    k3s_remove_selected_cells: >-
      {%- set target = k3s_remove_nodes_doc['items']
            | selectattr('metadata.name', 'equalto', k3s_remove_node) | first | default({}) -%}
      {%- set labels = (target.metadata | default({})).labels | default({}) -%}
      {%- set reservations = [labels.get('exomem.io/dedicated-cell')]
            + ((target.spec | default({})).taints | default([])
               | selectattr('key', 'equalto', 'exomem.io/dedicated-cell')
               | map(attribute='value', default='') | list) -%}
      {%- set shared_profiles = [labels.get('exomem.io/shared-profile')]
            + ((target.spec | default({})).taints | default([])
               | selectattr('key', 'equalto', 'exomem.io/shared-profile')
               | map(attribute='value', default='') | list) -%}
      {%- set cells = [] -%}
      {%- for workload in k3s_remove_statefulsets_doc['items']
          if workload.metadata.namespace.startswith(k3s_cell_namespace_prefix) -%}
        {%- set selector = workload.spec.template.spec.nodeSelector | default({}) -%}
        {%- if ('exomem.io/dedicated-cell' in selector
            and selector['exomem.io/dedicated-cell'] in reservations)
            or ('exomem.io/shared-profile' in selector
            and selector['exomem.io/shared-profile'] in shared_profiles) -%}
          {%- set _ = cells.append(workload.metadata.namespace) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ cells }}

- name: Refuse removal until selected cells relocate
  ansible.builtin.assert:
    that:
      - k3s_remove_selected_cells | length == 0
    fail_msg: >-
      A desired cell template still selects {{ k3s_remove_node }}'s reservation
      ({{ k3s_remove_selected_cells | join(', ') }}); stop, clear placement and verify relocation first.

- name: Classify attached volumes as cell or non-cell by their claim namespace
  ansible.builtin.set_fact:
    k3s_remove_attached: >-
      {%- set claimed = {} -%}
      {%- for pv in k3s_remove_pvs_doc['items'] -%}
        {%- set _ = claimed.update({pv.metadata.name: pv.spec.claimRef.namespace | default('')
                                    if pv.spec.claimRef is defined else ''}) -%}
      {%- endfor -%}
      {%- set attached = [] -%}
      {%- for attachment in k3s_remove_attachments_doc['items']
          if attachment.spec.attacher == k3s_csi_driver
          and (attachment.status.attached | default(false)) -%}
        {%- set namespace = claimed.get(attachment.spec.source.persistentVolumeName | default(''), '') -%}
        {%- set _ = attached.append({'node': attachment.spec.nodeName,
                                     'cell': namespace.startswith(k3s_cell_namespace_prefix)}) -%}
      {%- endfor -%}
      {{ attached }}

- name: Measure the slots the remaining nodes would publish
  ansible.builtin.set_fact:
    k3s_remove_cell_volumes: >-
      {{ k3s_remove_pvcs_doc['items']
         | selectattr('metadata.namespace', 'match', k3s_cell_namespace_prefix) | list | length }}
    k3s_remove_target_non_cell: >-
      {{ k3s_remove_attached | selectattr('node', 'equalto', k3s_remove_node)
         | rejectattr('cell') | list | length }}
    k3s_remove_remaining_slots: >-
      {%- set total = namespace(slots=0) -%}
      {%- for node in k3s_remove_nodes_doc['items'] if node.metadata.name != k3s_remove_node
          and 'exomem.io/dedicated-cell' not in (node.metadata.labels | default({}))
          and 'exomem.io/shared-profile' not in (node.metadata.labels | default({}))
          and not (node.spec.taints | default([])
                   | selectattr('key', 'equalto', 'exomem.io/dedicated-cell') | list)
          and not (node.spec.taints | default([])
                   | selectattr('key', 'equalto', 'exomem.io/shared-profile') | list)
          and not (node.spec.unschedulable | default(false))
          and (node.status.conditions | default([]) | selectattr('type', 'equalto', 'Ready')
               | map(attribute='status') | first | default('False')) == 'True' -%}
        {%- set csinode = k3s_remove_csinodes_doc['items']
              | selectattr('metadata.name', 'equalto', node.metadata.name) | first | default({}) -%}
        {%- set drivers = (csinode.spec | default({})).drivers | default([], true)
              | selectattr('name', 'equalto', k3s_csi_driver) | list -%}
        {%- if drivers and (drivers[0].allocatable | default({})).count is defined -%}
          {%- set non_cell = k3s_remove_attached | selectattr('node', 'equalto', node.metadata.name)
                | rejectattr('cell') | list | length -%}
          {#- No per-node clamp: cellctl's compute_node_capacity lets a node's
              slots go negative, and the sum must match what it publishes. -#}
          {%- set total.slots = total.slots
                + drivers[0].allocatable.count | int - k3s_remove_headroom | int - non_cell -%}
        {%- endif -%}
      {%- endfor -%}
      {{ total.slots }}

- name: Refuse a removal whose cells would not fit the remaining nodes
  ansible.builtin.assert:
    that:
      - k3s_remove_cell_volumes | int <= k3s_remove_remaining_slots | int - k3s_remove_target_non_cell | int
    fail_msg: >-
      Removing {{ k3s_remove_node }} leaves {{ k3s_remove_remaining_slots }} cell slots
      (net of {{ k3s_remove_target_non_cell }} non-cell volumes that must move) for
      {{ k3s_remove_cell_volumes }} cell volumes. Add a node first.
    success_msg: >-
      {{ k3s_remove_cell_volumes }} cell volumes fit {{ k3s_remove_remaining_slots }}
      remaining slots.
