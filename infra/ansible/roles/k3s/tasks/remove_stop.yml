---
# add-cloud-node-provisioning N6 step 5. The unit's KillMode=process leaves
# pod containers running after `systemctl stop`, so this does what K3s's
# k3s-killall.sh does before the stop may count as confirmed: nothing may
# still hold a cell volume when the node is later tainted out of service.
- name: Mark this host as removed so the join playbook refuses it
  ansible.builtin.copy:
    content: "Removed from the cluster by remove-agent.yml; destroy this server.\n"
    dest: /etc/rancher/k3s/removed
    owner: root
    group: root
    mode: "0600"

- name: Stop and disable the K3s agent
  ansible.builtin.systemd_service:
    name: k3s-agent
    state: stopped
    enabled: false
  register: k3s_remove_unit
  failed_when:
    - k3s_remove_unit is failed
    - "'Could not find the requested service' not in (k3s_remove_unit.msg | default(''))"

- name: Kill every remaining pod container shim
  ansible.builtin.command:
    argv:
      - /usr/bin/pkill
      - -KILL
      - -f
      - containerd-shim
  register: k3s_remove_shims
  changed_when: k3s_remove_shims.rc == 0
  failed_when: k3s_remove_shims.rc not in [0, 1]

- name: List pod volume mounts left on the host
  ansible.builtin.command:
    argv:
      - /usr/bin/findmnt
      - --raw
      - --noheadings
      - --output
      - TARGET
  register: k3s_remove_mounts
  changed_when: false

- name: Unmount every pod volume, then every CSI global mount, innermost first
  ansible.builtin.command:
    argv:
      - /usr/bin/umount
      - "{{ item }}"
  loop: >-
    {{ (k3s_remove_mounts.stdout_lines | select('match', k3s_remove_pod_mount_pattern) | sort | reverse | list)
       + (k3s_remove_mounts.stdout_lines | select('match', k3s_remove_csi_mount_pattern) | sort | reverse | list) }}
  register: k3s_remove_umount
  changed_when: true
  failed_when:
    - k3s_remove_umount.rc != 0
    - "'not mounted' not in k3s_remove_umount.stderr"

- name: List the dm-crypt mappings still open
  ansible.builtin.command:
    argv:
      - /usr/sbin/dmsetup
      - ls
      - --target
      - crypt
  register: k3s_remove_crypt
  changed_when: false

# The encrypted storage class opens one mapping per volume; a mapping that
# still backs a mount (such as an encrypted root) reports busy and stays.
- name: Close the volumes' dm-crypt mappings
  ansible.builtin.command:
    argv:
      - /usr/sbin/cryptsetup
      - close
      - "{{ item }}"
  loop: >-
    {{ k3s_remove_crypt.stdout_lines | reject('match', '^No devices found')
       | map('split') | map('first') | list }}
  register: k3s_remove_crypt_close
  changed_when: k3s_remove_crypt_close.rc == 0
  failed_when:
    - k3s_remove_crypt_close.rc != 0
    - "'busy' not in k3s_remove_crypt_close.stderr"

- name: Look for container processes that survived
  ansible.builtin.command:
    argv:
      - /usr/bin/pgrep
      - -f
      - containerd-shim
  register: k3s_remove_survivors
  changed_when: false
  failed_when: k3s_remove_survivors.rc not in [0, 1]

- name: Look for volume mounts that survived
  ansible.builtin.command:
    argv:
      - /usr/bin/findmnt
      - --raw
      - --noheadings
      - --output
      - SOURCE,TARGET
  register: k3s_remove_mounts_after
  changed_when: false

- name: Look for dm-crypt mappings that survived
  ansible.builtin.command:
    argv:
      - /usr/sbin/dmsetup
      - ls
      - --target
      - crypt
  register: k3s_remove_crypt_after
  changed_when: false

- name: Confirm nothing on the host still runs, mounts or maps a volume
  ansible.builtin.set_fact:
    k3s_remove_stop_confirmed: >-
      {%- set targets = k3s_remove_mounts_after.stdout_lines | map('split') | map('last') | list -%}
      {%- set kept_sources = k3s_remove_mounts_after.stdout_lines | map('split')
            | rejectattr('1', 'match', '^/var/lib/kubelet/') | map('first') | list -%}
      {%- set open_maps = k3s_remove_crypt_after.stdout_lines | reject('match', '^No devices found')
            | map('split') | map('first') | list -%}
      {{ k3s_remove_survivors.rc == 1
         and (targets | select('match', k3s_remove_pod_mount_pattern) | list | length) == 0
         and (targets | select('match', k3s_remove_csi_mount_pattern) | list | length) == 0
         and (open_maps | reject('in', kept_sources | map('regex_replace', '^/dev/mapper/', '') | list)
              | list | length) == 0 }}
