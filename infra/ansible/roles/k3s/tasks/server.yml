---
- name: Create the K3s server audit log directory
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/logs
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install the Kubernetes audit policy
  ansible.builtin.copy:
    src: audit-policy.yaml
    dest: /etc/rancher/k3s/audit-policy.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Restart K3s

- name: Install the Pod Security admission configuration
  ansible.builtin.copy:
    src: admission-config.yaml
    dest: /etc/rancher/k3s/admission-config.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Restart K3s

- name: Install the K3s server configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart K3s

- name: Install the K3s systemd unit
  ansible.builtin.template:
    src: k3s.service.j2
    dest: /etc/systemd/system/k3s.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart K3s

- name: Apply configuration handlers before first K3s start
  ansible.builtin.meta: flush_handlers

- name: Enable and start K3s
  ansible.builtin.systemd_service:
    name: k3s
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for the local Kubernetes API readiness endpoint
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - get
      - --raw=/readyz
  register: k3s_ready
  changed_when: false
  retries: 30
  delay: 2
  until: k3s_ready.rc == 0 and k3s_ready.stdout == "ok"

# harden-exomem-cloud-operator-access D4: the admin kubeconfig is root-only.
# K3s rewrites k3s.yaml in place and keeps an existing file's group, so a node
# that once wrote it to the operators group needs its ownership reset here.
- name: Keep the admin kubeconfig root-only
  ansible.builtin.file:
    path: /etc/rancher/k3s/k3s.yaml
    owner: root
    group: root
    mode: "0600"

# The agent-token rotation and first selection run this after their server
# restart (docs/runbooks/cloud-dedicated-host.md, task 5.7).
- name: Install the bootstrap re-save helper
  ansible.builtin.copy:
    src: exomem-k3s-resave-bootstrap.sh
    dest: /usr/local/sbin/exomem-k3s-resave-bootstrap
    owner: root
    group: root
    mode: "0750"

# The client-CA rotation after a lost agent disk runs this, then restarts K3s
# on every node (docs/runbooks/cloud-dedicated-host.md, task 5.8).
- name: Install the client CA rotation helper
  ansible.builtin.copy:
    src: exomem-k3s-rotate-client-ca.sh
    dest: /usr/local/sbin/exomem-k3s-rotate-client-ca
    owner: root
    group: root
    mode: "0750"

# K3s cannot list the write-only etcd bucket, so it never prunes its records of
# the snapshots it uploaded; the bucket's lifecycle deletes the snapshots.
- name: Install the expired etcd snapshot record pruner
  ansible.builtin.copy:
    src: exomem-prune-etcd-snapshot-records.py
    dest: /usr/local/sbin/exomem-prune-etcd-snapshot-records
    owner: root
    group: root
    mode: "0750"

- name: Install the etcd snapshot record pruner units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - exomem-prune-etcd-snapshot-records.service
    - exomem-prune-etcd-snapshot-records.timer
  notify: Reload systemd

- name: Apply the pruner unit handlers before enabling its timer
  ansible.builtin.meta: flush_handlers

- name: Enable the etcd snapshot record pruner
  ansible.builtin.systemd_service:
    name: exomem-prune-etcd-snapshot-records.timer
    enabled: true
    state: started
