---
- name: Validate the K3s node role
  ansible.builtin.assert:
    that:
      - k3s_node_role in ['server', 'agent']
    fail_msg: k3s_node_role must be server or agent.

- name: Resolve the K3s private network interface
  ansible.builtin.import_tasks: interface.yml

- name: Validate the K3s inputs for this node role
  ansible.builtin.import_tasks: validate.yml

# 0700, as K3s creates its own agent directories.
- name: Create the kubelet drop-in directory
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install the kubelet image age limit
  ansible.builtin.copy:
    src: 10-exomem-image-gc.conf
    dest: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/10-exomem-image-gc.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart K3s

- name: Configure the independently adopted node memory policy
  ansible.builtin.import_tasks: memory_qos.yml

- name: Create the K3s configuration directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: exomem-operators
    mode: "0750"

# Flannel reads this only when K3s starts, and keeps an existing flannel.1
# whatever its MTU, so a change recreates the device (handlers/main.yml).
- name: Install the flannel network configuration
  ansible.builtin.template:
    src: flannel-net-conf.json.j2
    dest: "{{ k3s_flannel_conf_path }}"
    owner: root
    group: root
    mode: "0644"
  register: k3s_flannel_conf
  notify: Recreate the flannel device
  when: k3s_flannel_mtu is not none

# Read on every run, so a run that failed after the configuration changed, or
# lost its notification, still recreates the device. Absent before K3s first
# starts flannel; K3s then creates it from the configuration.
- name: Read the running flannel device and subnet MTU
  ansible.builtin.command:
    argv: [/usr/bin/cat, /sys/class/net/flannel.1/mtu, /run/flannel/subnet.env]
  register: k3s_flannel_running
  changed_when: false
  failed_when: false
  when: k3s_flannel_mtu is not none

- name: Recreate a flannel device that runs at another MTU
  ansible.builtin.debug:
    msg: >-
      flannel on {{ inventory_hostname }} reads {{ k3s_flannel_running.stdout_lines | join(', ') }};
      recreating it at {{ k3s_flannel_pod_mtu }}.
  register: k3s_flannel_drift
  changed_when: true
  notify: Recreate the flannel device
  when:
    - k3s_flannel_mtu is not none
    - k3s_flannel_running.rc == 0
    - >-
      k3s_flannel_running.stdout_lines[0] != k3s_flannel_pod_mtu | string
      or ('FLANNEL_MTU=' ~ k3s_flannel_pod_mtu) not in k3s_flannel_running.stdout_lines

- name: Install required K3s kernel settings
  ansible.builtin.copy:
    src: 99-exomem-k3s.conf
    dest: /etc/sysctl.d/99-exomem-k3s.conf
    owner: root
    group: root
    mode: "0644"
  notify: Apply K3s kernel settings

- name: Download the pinned K3s binary with checksum verification
  ansible.builtin.get_url:
    url: "{{ k3s_binaries[ansible_facts['architecture']].url }}"
    dest: /usr/local/bin/k3s
    owner: root
    group: root
    mode: "0755"
    checksum: "sha256:{{ k3s_binaries[ansible_facts['architecture']].sha256 }}"
    force: false
  notify: Restart K3s

- name: Admit K3s traffic from the other cluster nodes
  ansible.builtin.import_tasks: firewall.yml

- name: Configure and start the K3s server
  ansible.builtin.import_tasks: server.yml
  when: k3s_node_role == 'server'

- name: Configure and join the K3s agent
  ansible.builtin.import_tasks: agent.yml
  when: k3s_node_role == 'agent'
