---
- name: Validate the K3s node role
  ansible.builtin.assert:
    that:
      - k3s_node_role in ['server', 'agent']
    fail_msg: k3s_node_role must be server or agent.

- name: Resolve the K3s private network interface
  ansible.builtin.import_tasks: interface.yml

- name: Validate the K3s inputs for this node role
  ansible.builtin.import_tasks: validate.yml

- name: Create the K3s configuration directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: exomem-operators
    mode: "0750"

- name: Install required K3s kernel settings
  ansible.builtin.copy:
    src: 99-exomem-k3s.conf
    dest: /etc/sysctl.d/99-exomem-k3s.conf
    owner: root
    group: root
    mode: "0644"
  notify: Apply K3s kernel settings

- name: Download the pinned K3s binary with checksum verification
  ansible.builtin.get_url:
    url: "{{ k3s_release_url_amd64 }}"
    dest: /usr/local/bin/k3s
    owner: root
    group: root
    mode: "0755"
    checksum: "sha256:{{ k3s_sha256_amd64 }}"
    force: false
  notify: Restart K3s

- name: Admit K3s traffic from the other cluster nodes
  ansible.builtin.import_tasks: firewall.yml

- name: Configure and start the K3s server
  ansible.builtin.import_tasks: server.yml
  when: k3s_node_role == 'server'

- name: Configure and join the K3s agent
  ansible.builtin.import_tasks: agent.yml
  when: k3s_node_role == 'agent'
