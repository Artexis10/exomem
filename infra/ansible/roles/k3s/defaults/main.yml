---
k3s_version: "v1.35.6+k3s1"
k3s_sha256_amd64: 2b52a2c1ca6eb502e2a0ffa1a4cf79eef94875926577c1e43347ed292cc92432
k3s_release_url_amd64: https://github.com/k3s-io/k3s/releases/download/v1.35.6%2Bk3s1/k3s
# Node-wide opt-in, independently adopted from any cell image rollout.
k3s_memory_qos_enabled: false
k3s_private_interface: ""
k3s_server_token: ""
k3s_etcd_s3_endpoint: ""
k3s_etcd_s3_region: ""
k3s_etcd_s3_bucket: ""
k3s_etcd_s3_access_key: ""
k3s_etcd_s3_secret_key: ""

# server: the one cluster-init server (hosted_nodes outside k3s_agents).
# agent: a node in k3s_agents. Derived from group membership, so no play can
# render the server configuration on an agent by forgetting to set it.
k3s_node_role: "{{ 'agent' if inventory_hostname in (groups['k3s_agents'] | default([])) else 'server' }}"
k3s_service_name: "{{ 'k3s-agent' if k3s_node_role == 'agent' else 'k3s' }}"

# Agents join with this token only, never the server token, which is also
# the passphrase for the cluster's bootstrap data. Mandatory once any agent
# is inventoried; see tasks/validate.yml.
k3s_agent_token: ""
k3s_agent_node_label: exomem.io/node-pool=agent
k3s_agent_dedicated_cell: ""
k3s_agent_shared_profile: ""

# A join completes only once the node's CSINode publishes an attachment
# limit for this driver: that count is what cellctl turns into cell_slots.
# Switch off only for a cluster without the Hetzner CSI driver.
k3s_agent_require_csi_capacity: true
k3s_csi_driver: csi.hetzner.cloud
k3s_join_retries: 60
k3s_join_delay: 5
# An agent Terraform does not create keeps its cells on node-local storage
# (move-cloud-cells-to-local-storage D1): its join completes once TopoLVM
# publishes the node's pool for this device class, not an attachment limit.
k3s_agent_local_storage: "{{ inventory_hostname in (groups['dedicated_hosts'] | default([])) }}"
k3s_topolvm_driver: topolvm.io
k3s_topolvm_device_class: thin
# TopoLVM's privileged node plugin runs only on nodes with this label. The
# server applies it: NodeRestriction stops a kubelet from setting labels under
# node-restriction.kubernetes.io/ on its own Node, so a compromised agent cannot
# draw the plugin and its service-account token onto itself. Never put it in
# node-label, where the kubelet's registration would be refused.
k3s_topolvm_node_label: node-restriction.kubernetes.io/exomem-local-storage=true

# Every K3s node in the inventory; the host firewall admits inter-node
# traffic only from their declared private addresses.
k3s_cluster_hosts: "{{ groups['hosted_nodes'] | default([]) }}"
k3s_firewall_peer_ips: >-
  {{ k3s_cluster_hosts | difference([inventory_hostname])
     | map('extract', hostvars, 'private_node_ip') | select('defined') | list }}
k3s_firewall_comment: Exomem K3s inter-node

# A node outside the Hetzner network joins over WireGuard (D8): it peers with
# every other node, and every other node peers with it. No dash: Ansible's
# per-interface facts rewrite dashes, which the private-interface lookup
# would then miss.
k3s_wireguard_interface: wgexomem
k3s_wireguard_port: 51820
k3s_wireguard_hosts: >-
  {{ groups['hosted_nodes'] | default([]) | map('extract', hostvars)
     | selectattr('k3s_private_link', 'defined') | selectattr('k3s_private_link', 'equalto', 'wireguard')
     | map(attribute='inventory_hostname') | list }}
k3s_wireguard_peers: >-
  {{ ((groups['hosted_nodes'] | default([])) if inventory_hostname in k3s_wireguard_hosts
      else k3s_wireguard_hosts) | difference([inventory_hostname]) }}
# The interface each peer's private address arrives on: WireGuard for a peer
# that joined over it, this node's private interface otherwise (on a WireGuard
# node that is the WireGuard interface too). Firewall rules name it.
k3s_peer_interfaces: >-
  {%- set mapping = {} -%}
  {%- for peer in k3s_cluster_hosts | difference([inventory_hostname])
      if hostvars[peer].private_node_ip is defined -%}
    {%- set _ = mapping.update({hostvars[peer].private_node_ip:
          k3s_wireguard_interface if peer in k3s_wireguard_hosts else k3s_resolved_private_interface}) -%}
  {%- endfor -%}
  {{ mapping }}
# A dedicated Hetzner server's vSwitch VLAN hangs off its default-route NIC
# unless this names another.
k3s_vswitch_parent_interface: ""

# Removal (remove-agent.yml). The headroom mirrors the platform chart's
# capacity.headroom, so the preflight counts slots exactly as cellctl does.
k3s_cell_namespace_prefix: exo-cell-
k3s_remove_headroom: 5
k3s_remove_pod_procs_argv:
  - /usr/bin/find
  - /sys/fs/cgroup
  - -path
  - "*kubepods*"
  - -name
  - cgroup.procs
  - -exec
  - /usr/bin/cat
  - "{}"
  - +
k3s_remove_pod_mount_pattern: ^/var/lib/kubelet/pods/
k3s_remove_csi_mount_pattern: ^/var/lib/kubelet/plugins/kubernetes.io/csi/
