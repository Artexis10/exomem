# Remove an image no container has used for a week. Without this, GC waited for
# 75% disk while superseded 785 MB Exomem images piled up (41 GB on the server
# node, 2026-10-05). A rollback to an older image pulls it again.
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
imageMaximumGCAge: 168h
