---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  tags: services
  when: postgres_manage_services | bool

- name: Restart PostgreSQL
  ansible.builtin.systemd_service:
    name: "postgresql@{{ postgres_major_version }}-main"
    state: restarted
  tags: services
  when: postgres_manage_services | bool

- name: Reload PostgreSQL
  ansible.builtin.systemd_service:
    name: "postgresql@{{ postgres_major_version }}-main"
    state: reloaded
  tags: services
  when: postgres_manage_services | bool

- name: Restart PgBouncer
  ansible.builtin.systemd_service:
    name: pgbouncer
    state: restarted
  tags: services
  when: postgres_manage_services | bool

- name: Restart the PgBouncer connection-limit table
  ansible.builtin.systemd_service:
    name: exomem-postgres-nftables
    state: restarted
  tags: services
  when: postgres_manage_services | bool
