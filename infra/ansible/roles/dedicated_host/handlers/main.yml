---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Update the initramfs
  ansible.builtin.command:
    argv: [/usr/sbin/update-initramfs, -u]
  changed_when: true

- name: Restart the Tang socket
  ansible.builtin.systemd_service:
    name: tangd.socket
    state: restarted
    daemon_reload: true
