---
- name: Probe the open mapping for a volume group
  ansible.builtin.command:
    argv: [/usr/sbin/blkid, --probe, --output, export, "/dev/mapper/{{ dedicated_host_luks_name }}"]
  register: dedicated_host_mapping_blkid
  changed_when: false
  failed_when: dedicated_host_mapping_blkid.rc not in [0, 2]

- name: Read the volume group on the open mapping
  ansible.builtin.command:
    argv: [/usr/sbin/pvs, --noheadings, --options, vg_name, "/dev/mapper/{{ dedicated_host_luks_name }}"]
  register: dedicated_host_mapping_pvs
  changed_when: false
  failed_when: false

- name: Refuse a mapping that holds anything but the cell volume group
  ansible.builtin.assert:
    that: >-
      dedicated_host_mapping_blkid.stdout_lines | select('match', '^(PT)?TYPE=') | list | length == 0
      or (dedicated_host_mapping_pvs.rc == 0
          and dedicated_host_mapping_pvs.stdout | trim == dedicated_host_volume_group)
    fail_msg: "/dev/mapper/{{ dedicated_host_luks_name }} holds something other than {{ dedicated_host_volume_group }}; nothing was changed."

- name: Create the cell volume group
  ansible.builtin.command:
    argv: [/usr/sbin/vgcreate, "{{ dedicated_host_volume_group }}", "/dev/mapper/{{ dedicated_host_luks_name }}"]
  when: dedicated_host_mapping_pvs.rc != 0 or dedicated_host_mapping_pvs.stdout | trim | length == 0
  changed_when: true

- name: Look for the thin pool
  ansible.builtin.command:
    argv: [/usr/sbin/lvs, --noheadings, --options, lv_attr, "{{ dedicated_host_volume_group }}/{{ dedicated_host_thin_pool }}"]
  register: dedicated_host_pool
  changed_when: false
  failed_when: false

# Design D1: the pool takes the whole group, with metadata and its spare at
# LVM's defaults for the pool and chunk size. TopoLVM overprovisions it at
# ratio 1.0, so no volume, snapshot or clone can outgrow it.
- name: Create the thin pool
  ansible.builtin.command:
    argv:
      - /usr/sbin/lvcreate
      - --yes
      - --type=thin-pool
      - --extents=100%FREE
      - --name={{ dedicated_host_thin_pool }}
      - "{{ dedicated_host_volume_group }}"
  when: dedicated_host_pool.rc != 0
  changed_when: true

- name: Read the thin pool
  ansible.builtin.command:
    argv: [/usr/sbin/lvs, --noheadings, --options, lv_attr, "{{ dedicated_host_volume_group }}/{{ dedicated_host_thin_pool }}"]
  register: dedicated_host_pool_after
  changed_when: false

- name: Require the pool to be a thin pool
  ansible.builtin.assert:
    that: dedicated_host_pool_after.stdout | trim is match('t')
    fail_msg: "{{ dedicated_host_volume_group }}/{{ dedicated_host_thin_pool }} exists but is not a thin pool."
