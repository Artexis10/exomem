[defaults]
inventory = inventory.yml
roles_path = roles
host_key_checking = True
interpreter_python = auto_silent
retry_files_enabled = False
nocows = True
# A module result's ansible_facts stay under ansible_facts and never shadow
# inventory variables such as private_node_ip, which templates render into
# root-executed configuration on other hosts.
inject_facts_as_vars = False

[privilege_escalation]
become = True
become_method = sudo
