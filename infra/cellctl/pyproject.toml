[project]
name = "exomem-cellctl"
version = "0.1.0"
description = "Stateless controller that converges Exomem Cloud cell rows onto Kubernetes"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30,<1",
    "cryptography>=48.0.1,<51",
    "httpx>=0.28,<1",
    "kubernetes>=35.0,<36",
]

[project.scripts]
exomem-cellctl = "cellctl.main:run"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cellctl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]
ignore = ["E501"]
