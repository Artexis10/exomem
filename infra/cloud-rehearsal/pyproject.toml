[project]
name = "exomem-cloud-rehearsal"
version = "0.1.0"
description = "P3: the Exomem Cloud local end-to-end rehearsal on disposable K3s"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30,<1",
    "boto3>=1.35,<2",
    "exomem-cellctl",
    "httpx>=0.28,<1",
    "kubernetes>=35.0,<36",
    "mcp>=1.20,<2",
    "pyyaml>=6,<7",
]

[project.scripts]
exomem-cloud-rehearsal = "cloud_rehearsal.__main__:main"

[tool.uv.sources]
exomem-cellctl = { path = "../cellctl" }

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_rehearsal"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]
ignore = ["E501"]
