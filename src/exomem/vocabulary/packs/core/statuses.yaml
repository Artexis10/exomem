schema_version: 1
registry: statuses
entries:
  active:
    attributes: {class: live}
  draft:
    attributes: {class: pending}
  planned:
    attributes: {class: pending}
  superseded:
    attributes: {class: superseded}
  archived:
    attributes: {class: retired}
  dropped:
    attributes: {class: abandoned}
  # Labels the product itself writes on experiment and production-log pages.
  recorded:
    attributes: {class: live}
  edited:
    attributes: {class: live}
  published:
    attributes: {class: live}
  reflected:
    attributes: {class: live}
  concluded:
    attributes: {class: live}
