schema_version: 1
registry: source-formats
# App exports that filing recognises and files one Source per item. Each entry is the facts of one
# vendor format. A file is that format when its name matches `file_glob` and its content is what its
# `parser` reads: a JSON array whose first item carries every key of `item_keys`, an XML document whose
# root element is `root`, or an mbox. A ChatGPT export since February 2026 is several numbered files.
# `parser` names the reader that code implements, `item_kind` the Source kind that each item files as,
# and `roles` the vendor's author roles that a transcript shows, each with its display label. `untitled`
# titles an item that has no title and `attachment` heads a quoted attachment; `words` gives the other
# display words of an XML or mbox parser, so a format brings the words of its own language. A mailbox
# reads its messages' labels from `label_header` and leaves out those labelled with any of `skip_labels`.
# A vault may retire an entry or change its words (`roles`, `untitled`, `attachment`, `words`) and
# `skip_labels`; what recognises a vendor's export stays shipped data.
entries:
  chatgpt-conversations:
    label: ChatGPT conversations
    description: The conversations.json of a ChatGPT data export, or each numbered conversations-000.json shard of it.
    attributes:
      file_glob: conversations*.json
      item_keys: [mapping, current_node]
      parser: chatgpt-conversations
      item_kind: session
      roles: {user: You, assistant: ChatGPT}
      untitled: Untitled conversation
      attachment: Attachment
  claude-conversations:
    label: Claude conversations
    description: The conversations.json of a Claude data export.
    attributes:
      file_glob: conversations.json
      item_keys: [chat_messages, uuid]
      parser: claude-conversations
      item_kind: session
      roles: {human: You, assistant: Claude}
      untitled: Untitled conversation
      attachment: Attachment
  evernote-notes:
    label: Evernote notes
    description: A notebook exported from Evernote as a .enex file; each note files as its own Source.
    attributes:
      file_glob: "*.enex"
      root: en-export
      parser: evernote-notes
      item_kind: app-note
      untitled: Untitled note
      words:
        created: Created
        updated: Updated
        tags: Tags
        source: Source
        attachments: Attachments
        extracted: filed as its own Source
        kept: kept in the export
        cut_short: "[text cut short]"
  gmail-mbox:
    label: Gmail mailbox
    description: A mailbox exported from Gmail by Google Takeout as a .mbox file; each message files as its own Source.
    attributes:
      file_glob: "*.mbox"
      label_header: X-Gmail-Labels
      skip_labels: [Spam, Trash]
      parser: gmail-mbox
      item_kind: correspondence
      untitled: No subject
      words:
        attachments: Attachments
        extracted: filed as its own Source
        kept: kept in the export
        cut_short: "[text cut short]"
