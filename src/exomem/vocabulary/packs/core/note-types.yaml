# The note types Exomem ships: every `type:` value the product writes or reads.
# A vault adds its own types in `_Schema/note-types.yaml`; it never edits this
# pack, and an overlay never changes a type defined here.
#
# `role` is the note-type role: compiled, entity, source or evidence. A type
# without a role matches no role predicate. `folder` names the type's area: a single
# folder name whose parent the vault's layout supplies. A compiled type declares its
# area, and a source, evidence or entity type may declare one. A vault's overlay may
# spell a compiled area `Notes/<Name>` too; both spellings read as the same area.
# `time_bounded` marks a compiled type whose pages
# record one bounded period; `sources: required` marks a type whose pages
# must cite their sources. `partition` names what splits the type's folder into
# sub-folders (project, domain, medium or none) and `stem` how the typed writer
# builds a file name from the slug (slug, dated or started); `index_row` is the token of
# the type's top-index Counts row when it differs from the key. Only this pack sets them.
schema_version: 1
registry: note-types
entries:
  research-note:
    label: Research note
    description: Findings from a research thread in one project.
    attributes: {role: compiled, folder: Research, sources: required, partition: project, index_row: research}
  insight:
    label: Insight
    description: One durable conclusion and why it holds.
    attributes: {role: compiled, folder: Insights, sources: required}
  failure:
    label: Failure
    description: Something that went wrong, its cause and the lesson.
    attributes: {role: compiled, folder: Failures, sources: required}
  pattern:
    label: Pattern
    description: A recurring structure seen across several cases.
    attributes: {role: compiled, folder: Patterns, sources: required}
  experiment:
    label: Experiment
    description: A bounded trial with a hypothesis and an outcome.
    attributes: {role: compiled, folder: Experiments, time_bounded: true, partition: domain, stem: started}
  production-log:
    label: Production log
    description: The record of one produced artifact and its reception.
    attributes: {role: compiled, folder: Productions, time_bounded: true, partition: medium, stem: dated}
  procedure:
    label: Procedure
    description: A reusable way of working, with when to use it and when not to.
    attributes: {role: compiled, folder: Procedures, sources: optional}
    guidance: >-
      Write a `summary` that says when to use the procedure. Add a "Not for"
      section that says when it does not apply, and one `## Procedure` block
      for each distinct way of working. Keep each step in the procedure block
      so that the block reads on its own.
  entity:
    label: Entity
    description: A stable identity whose type lives in the entity-type registry.
    attributes: {role: entity, folder: Entities, stem: slug}
  source:
    label: Source
    description: A raw capture that compiled pages cite.
    attributes: {role: source, folder: Sources, stem: dated}
  evidence:
    label: Evidence
    description: A preserved artifact that supports a claim.
    attributes: {role: evidence, folder: Evidence}
  collection:
    label: Collection
    description: A structured collection's manifest page.
  collection-summary:
    label: Collection summary
    description: The generated summary page of a structured collection.
  collection-saved-view:
    label: Collection saved view
    description: The generated page that names how to run one saved view of a structured collection.
  record:
    label: Record
    description: One item of a Records collection.
  plan:
    label: Plan
    description: One item of a Planning collection.
  held-record:
    label: Held record
    description: A collection candidate refused for its content and kept for review.
  dataset:
    label: Dataset card
    description: The searchable card that points at one data file.
  adoption-manifest:
    label: Adoption manifest
    description: The saved report of an existing-vault adoption scan.
  adoption-run-manifest:
    label: Adoption run manifest
    description: The saved record of one adoption run.
