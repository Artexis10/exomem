schema_version: 1
registry: page-fields
# Frontmatter fields with a governed role. A `pointer` field names where a page belongs
# or which file it describes, so a governed pointer write may change it on a page in an
# append-only tree. Every other field there keeps its captured bytes. A field with a
# `writer` changes on such a page only through that operation: `reclassify` relocates the
# source and records its classification history, `custody` checks the raw file's identity,
# and `closure` writes the back-reference when a compiled page cites the source. A field
# that `carries: project-key` holds project keys, so a value it gains registers that key and
# a relocation rewrites it. A field with `shape: list` holds a list of values; any other
# field holds one. A `provenance` field records where an imported file came from: filing
# writes it onto each Source of a stage that states an origin. Its `source` is `envelope`
# (the value is the named `envelope` key of the stage's series file) or `member-time` (the
# staged member's modification time). This pack is the only source of a role: a vault
# overlay may retire an entry and nothing else.
entries:
  project:
    label: Project
    attributes: {field: project, role: pointer, carries: project-key}
  projects:
    label: Projects
    attributes: {field: projects, role: pointer, carries: project-key, shape: list}
  domain:
    label: Domain
    attributes: {field: domain, role: pointer, writer: reclassify}
  source-type:
    label: Source type
    attributes: {field: source_type, role: pointer, writer: reclassify}
  ingested-into:
    label: Ingested into
    attributes: {field: ingested_into, role: pointer, writer: closure}
  evidence-file:
    label: Evidence file
    attributes: {field: evidence_file, role: pointer, writer: custody}
  data-file:
    label: Data file
    attributes: {field: data_file, role: pointer, writer: custody}
  artifact-path:
    label: Artifact path
    attributes: {field: artifact_path, role: pointer, writer: custody}
  origin-label:
    label: Origin label
    attributes: {field: origin_label, role: provenance, source: envelope, envelope: label}
  upload-device:
    label: Upload device
    attributes: {field: upload_device, role: provenance, source: envelope, envelope: device_family}
  upload-browser:
    label: Upload browser
    attributes: {field: upload_browser, role: provenance, source: envelope, envelope: browser_family}
  file-modified:
    label: File modified
    attributes: {field: file_modified, role: provenance, source: member-time}
