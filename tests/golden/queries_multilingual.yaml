# Multilingual recall golden set (recall-multilingual-v1).
#
# The pages live in benchmarks/epistemic/corpora/recall_multilingual.py and are
# rendered beside the English golden fixture (tests/fixtures). Golds and
# poisons name LOGICAL KEYS: `<lang>:<name>` for a multilingual page, or
# `fixture:<vault path>` for an English golden-fixture page.
#
# kind:
#   same_language       shares words with a native page
#   cross_language      the gold is an English page (dense recall; lexical is reported only)
#   morphology          an inflected form other than the page's (ru stems; et relies on dense)
#   without_diacritics  typed without accents (de, et; ru ё/е is reported, not required)
#   language_bias       about an English topic; a same-language unrelated page is the poison
#
# Every name and place is invented.

