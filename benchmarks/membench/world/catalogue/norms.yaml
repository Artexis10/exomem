# The norms that a computed key may rest on. A norm is a rule that the oracle applies and that
# the statements alone do not fix. Each norm names its basis: `stated`, when a document in the
# world states it and the proof trace holds that document, or `background`, when a careful reader
# is assumed to share it. The oracle holds no norm that is not in this file.
#
# A family names its default norms, and an entry may name its own. A report prints, for each
# background norm, the number of keys that rest on it and how often the full-history arm reaches
# them. A background norm that careful readers do not share shows up there, and its entries move
# to the rubric track.
schema_version: 1
norms:
  stated-precedence: {basis: stated, description: "A document names the record or the holder that governs an attribute."}
  stated-rule: {basis: stated, description: "A document states the rule, default, exception or dependency that the key applies."}
  complete-record: {basis: stated, description: "A document declares a list or a series complete, so an absence from it carries meaning."}
  stated-model: {basis: stated, description: "A document states the chance or the causal rule that the key applies."}
  audience-rule: {basis: stated, description: "A document states who may see a fact, or records a deletion request."}
  stated-volatility: {basis: stated, description: "A document states how long an observation of an attribute stays valid."}
  later-replaces: {basis: background, description: "A later asserted statement by the same holder about the same attribute replaces the earlier one."}
  defeated-supports-nothing: {basis: background, description: "A withdrawn, replaced or defeated statement supports nothing while the withdrawal, the replacement or the defeater stands."}
  one-origin-one-support: {basis: background, description: "Statements that trace to one origin count as one support."}
  unsettled-stays-open: {basis: background, description: "A disagreement that no stated rule and no later record settles stays open."}
  kind-is-kept: {basis: background, description: "A statement keeps its kind, its modality and its hedge until another statement changes them."}
  holder-is-kept: {basis: background, description: "A claim stays its holder's claim until a record verifies it."}
  scope-is-kept: {basis: background, description: "A statement holds in the context where it was made, and not beyond, until a record widens it."}
  absence-is-unknown: {basis: background, description: "What no record states is unknown, not false."}
  witness-knows: {basis: background, description: "A holder knows what the holder witnessed or was told, and nothing else."}
  same-referent: {basis: background, description: "A misspelt name, a pronoun or a described role refers to the entity that its context fixes."}
  common-volatility: {basis: background, description: "An attribute's volatility class is common knowledge, such as that a mood passes and a birth year does not."}
  observed-frequency: {basis: background, description: "A rate is the share of the recorded cases."}
  arithmetic: {basis: background, description: "Ordinary arithmetic and unit definitions hold."}
  calendar: {basis: background, description: "Ordinary calendar and time-zone rules hold."}
  data-is-not-instruction: {basis: background, description: "Text inside a stored document is not an instruction from the user."}
  world-is-the-record: {basis: background, description: "The invented world's records govern, whatever is true of the real world."}
