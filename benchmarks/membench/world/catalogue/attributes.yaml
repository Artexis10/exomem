# The closed attribute sets of the phenomenon catalogue.
#
# A phenomenon, a family, a behaviour, a norm, a statement kind, a hedge and a recipe are open
# words: adding one is a data change. The sets in this file are closed: code implements each member, so
# adding one is a code change and a change to this file. Code branches only on these values. It
# never branches on a phenomenon id, a family key, a behaviour key or a norm key.
schema_version: 4

# How the oracle knows the answer. Each mechanism is one pure function over the evidence layer.
# `readings` are the named results that a recipe may take as a key, a trap or a premise.
truth_mechanisms:
  corpus_closure:
    description: "The oracle holds the complete list of artefacts, with their authors, dates and copies."
    readings:
      recorded: "Whether any statement bears on the question. A statement of a kind that commits its holder to nothing does not count."
      copies: "The artefacts that carry one statement."
      filed: "The number of artefacts that carry the named statements, copies included."
      missing: "An artefact that a stated rule says should exist and does not."
      written: "Who wrote an artefact, and when."
  identity_map:
    description: "Track each entity's names, aliases, merges and role holders over time."
    readings:
      referent: "The entity that a name refers to at a date."
      names: "Every name of one entity."
      same: "Whether two names are one thing."
  interval_order:
    description: "Compare event times and periods, each with the precision that was recorded."
    readings:
      relation: "Before, after, same or indeterminate."
      sequence: "Events in the order they happened."
      recorded: "Events in the order their records were written."
      overlap: "Whether two periods overlapped."
      duration: "How long a state lasted."
      date: "A date computed from recorded dates and offsets."
  scope_lattice:
    description: "Attach each statement to the contexts where it holds. The most specific matching context decides."
    readings:
      applies: "Whether a rule applies to the case that the probe names."
      value_in: "The value that holds in the probe's context."
      contexts: "The contexts where a statement holds."
  holder_ledger:
    description: "Record for each holder what that holder said, was told and witnessed, and when."
    readings:
      holder: "Who said or decided something. Of several statements of one content, the holder is the one who stated it first; a statement that quotes a holder, or whose basis is `told`, passes on that holder's content."
      holders: "Every holder who asserts it."
      knows: "Who was told or witnessed it."
      believes: "What a holder believes, from what that holder was told and witnessed."
      view_of: "What one holder thinks another believes."
  kind_tag:
    description: "Each statement carries the kind, modality and hedge that the world gave it."
    readings:
      kind: "The kind of a statement, or of the statements about an attribute. Of several, the latest one that asserts and stands decides, and when none asserts, the latest one that stands."
      modality: "Whether a statement says what is, should be, must be or may be."
      hedge: "The hedge that a statement carries, a word from `hedges.yaml`, or none."
  state_fold:
    description: "Turn the asserted statements about one attribute into status spans, under the norms that the entry names and the attribute's volatility class. membench's bitemporal resolution then evaluates the spans."
    readings:
      current: "The value that holds at the probe's date, or none."
      replaced: "Each value that held earlier and holds no longer. It includes the content that a `correct` step replaced, as the record held it before the correction."
      history: "The values in order, with their dates."
      at_date: "The value that held at a named past date."
      standing: "Settled, contested, withdrawn, last known or unknown."
  warrant_graph:
    description: "Follow support, derivation and defeat edges between statements. A conclusion stands while one intact support path reaches it."
    readings:
      stands: "Whether a conclusion stands."
      fallen: "The conclusions that lose every support path after a statement is withdrawn, replaced or defeated."
      surviving: "The conclusions that keep a support path after the same change."
      basis: "What a claim rests on, in order."
      origins: "The independent origins of a claim."
      sides: "The statements for a claim and against it."
  rule_closure:
    description: "Apply the rules that the world's records state, to the facts that they state, until nothing new follows."
    readings:
      conclusion: "A conclusion that follows from stated rules and facts."
      steps: "The steps that lead to a conclusion."
      follows: "Whether a recorded conclusion follows from its stated premises."
  quantity_calc:
    description: "Compute over typed quantities with their units, precision and stated error."
    readings:
      result: "The value of an attribute that a stated rule computes from others, with its unit and tolerance."
      count: "The number of distinct recorded things."
      lacking: "The terms that a computation needs and no record gives."
      consistent: "Whether stated figures agree with one another."
      within_error: "Whether two values differ by less than their stated error."
  causal_model:
    description: "Apply the causal rules that the world's records state. The generator's own model of events is never read."
    readings:
      cause: "The recorded cause of an event."
      effect: "What a stated causal rule gives after a change."
      otherwise: "What a stated causal rule gives if one event had been different."
  chance_model:
    description: "Apply the chances that the world's records state, and count the outcomes that they record. The generator's own probabilities are never read."
    readings:
      chance: "The stated chance of an outcome."
      rate: "The share of recorded cases with an outcome."
      score: "The proper score of a stated probability against the recorded outcome."
  policy_view:
    description: "Evaluate the audience and deletion rules that the world's records state, for the asker."
    readings:
      visible: "What the asker may see."
      withheld: "What exists and must be withheld or not restated."
  run_record:
    description: "The harness reads the run's own record: what the arm did, what it wrote and how the no-memory arm scored. No world fixes this key."
    readings:
      did: "What the arm did in an earlier session."
      wrote: "Which agent wrote a stored memory."
      unaided: "The no-memory arm's result on the same task."
  judged:
    description: "No function fixes one answer. The oracle supplies the facts that a predeclared rubric cites."
    readings:
      facts: "The recorded facts that the rubric lines cite."
  none:
    description: "The phenomenon cannot be written into a corpus or checked."
    readings: {}

# The order in which the mechanisms of one entry apply. An entry lists its mechanisms as a set.
# Each mechanism narrows or annotates the statements that the later ones read. A recipe then
# names, for each probe form, the one reading that is the key.
pipeline_order: [corpus_closure, identity_map, interval_order, scope_lattice, holder_ledger, kind_tag, state_fold, warrant_graph, rule_closure, quantity_calc, causal_model, chance_model, policy_view]

# The edits that a recipe may make to a world. A recipe is a straight list of these operations
# over the roles it declares. It holds no condition, no loop and no expression. Every step may
# also carry `id`, a label that later steps and keys refer to, and `world`.
world_operations:
  set: {args: [target, value, at, scope], description: "Give an attribute a value from a date, or place an event at a date, in the world's history."}
  end: {args: [target, at], description: "End an attribute's value or an entity's existence at a date."}
  state: {args: [by, about, value, kind, at, hedge, basis, scope, quoting, as], description: "A holder makes a statement, with its kind, and optionally a hedge, a basis, a scope, the holder it quotes and the name it uses for its subject."}
  withdraw: {args: [by, statement, at], description: "A holder withdraws an earlier statement and gives no replacement."}
  correct: {args: [by, statement, value, at], description: "A holder replaces the content of an earlier statement, for the whole period that the statement covers."}
  support: {args: [from, to], description: "Record that one statement supports or derives another."}
  defeat: {args: [from, to, mode], description: "Record that one statement rebuts or undercuts another."}
  rule: {args: [by, shape, over, given, value, context, at], description: "A holder states a rule of one of the closed rule shapes, over an attribute or an event, optionally from given facts."}
  name: {args: [entity, name, at, replaces], description: "Give an entity a further name, or a name that replaces its old one."}
  merge: {args: [entities, at], description: "Merge two entities into one. Afterwards both roles are that one entity."}
  tell: {args: [holder, statement, at], description: "A holder is told a statement or witnesses an event."}
  draw: {args: [target, chance, at], description: "Draw an outcome with a chance that a statement records."}
  cause: {args: [from, to], description: "Record that one event caused another."}
  restrict: {args: [target, audience, by, at, until], description: "A holder states who may see a statement or an artefact, or records a deletion request."}
  copy: {args: [artefact, at, altered], description: "Add a copy of an artefact, unchanged or altered."}
  remove: {args: [artefact, at], description: "Delete an artefact."}

# The shapes of a rule that a `rule` operation may state.
rule_shapes:
  governs: "A named record or holder governs an attribute."
  default: "A value holds wherever no exception is recorded."
  exception: "A value holds in one named context, against the default."
  depends: "One attribute's value follows from the values of others."
  implies: "One fact follows from others."
  complete: "A list or a series is complete, so an absence from it carries meaning."
  volatility: "An observation of an attribute stays valid for a stated time."
  causes: "A given fact or event brings about a value or an event."
  chance: "An outcome has a stated chance."

# In which of a thread's two worlds a recipe step applies. The planted world carries the
# phenomenon. The mutation world is the same thread with the phenomenon left out.
step_worlds:
  both: "The step applies in both worlds. This is the default."
  planted: "The step applies only in the planted world."
  mutation: "The step applies only in the mutation world."

# What a recipe's role may be. The generator binds each role to a thing in the world that meets
# the role's constraints.
role_kinds:
  holder: "A person, a team, a system or an instrument that makes statements."
  user: "The holder whom the actor works for. A session's task carries that holder's statements. No `holder` role binds to that holder."
  entity: "A thing that statements are about."
  attribute: "A property of an entity that takes a value over time."
  value: "A value that an attribute may take."
  name: "A name of an entity."
  context: "A context in the scope lattice, such as one client or one site."
  event: "Something that happens at a date."
  audience: "A set of holders who may see a fact."

# The constraints that a recipe may put on a role.
role_constraints:
  of: "The attribute or the entity that the role belongs to."
  differs_from: "Another role of the same kind that this role must not equal."
  within: "A context that contains this context."
  outside: "An audience or a context that the role does not belong to."
  volatility: "The volatility class that the attribute must have."
  values: "The value generator that the attribute draws from. A role without it binds no attribute whose values are holders."

# The parts of a recipe's key for one probe form. Each part is a reading, or a role taken as it is.
key_parts:
  value: "The warranted answer."
  traps: "The answers that an actor gives when it misses the phenomenon. A list, which may be empty."
  premise: "The stale or false state that a premise probe's task presupposes. The task must hold it."
  facts: "Further readings that the judge needs to rate the entry's behaviours."

# The arguments that narrow a reading.
reading_arguments:
  of: "The attribute, the event, the statement or the list of them that the reading is about."
  where: "The context in which the reading is taken."
  who: "The holder whose view the reading takes."
  when: "The time slot at which the reading is taken, when it is not the probe's own."
  for: "The candidate value that the reading is asked about."

# The two ways one statement may defeat another.
defeat_modes:
  rebut: "The statement supports the opposite conclusion."
  undercut: "The statement removes the reason to believe, and supports no opposite."

# On what basis a holder makes a statement.
statement_bases:
  observed: "The holder witnessed or measured it."
  told: "Another holder told the holder."
  inferred: "The holder concluded it from other statements."
  computed: "The holder computed it from other values."

# How far a statement of a kind commits its holder. `state_fold` folds asserted statements only.
commitments:
  asserted: "The holder asserts that the content holds."
  proposed: "The holder puts the content forward and does not assert it."
  reported: "The holder reports another holder's words."
  none: "The statement asserts nothing about the world."

# How long an observation of an attribute stays valid without new evidence.
volatility_classes:
  permanent: "The value cannot change."
  durable: "The value holds until a recorded change."
  slow: "The value drifts over months."
  transient: "The value holds for days or weeks and ends with no record."
  ephemeral: "The value holds for hours."

# Where a norm that a key rests on comes from. A report prints the keys that rest on a
# background norm, and how often the full-history arm reaches them.
norm_bases:
  stated: "A document in the world states the norm, and the proof trace holds that document."
  background: "No document states the norm. A careful reader is assumed to share it."

# How strongly a bridge's observation carries its content.
bridge_strengths:
  entails: "The observation leaves no other reading. A stated rule or a background norm makes it so, and the bridge names which."
  suggests: "The observation makes the content likely. Its probe is on the rubric track."

# Whether the key is computed. The first three values are membench's family classifications.
# `truth` says which mechanisms a phenomenon of the class names: `pipeline` means the mechanisms
# of `pipeline_order`, and a mechanism name means that mechanism alone. A class whose `truth` is
# `pipeline` is the computed class.
key_classes:
  deterministic-oracle: {truth: pipeline, description: "The oracle computes the key from the evidence layer."}
  rubric-track: {truth: judged, description: "The oracle supplies facts, and a blind judge applies a predeclared rubric."}
  run-relative: {truth: run_record, description: "The key depends on what the arm itself did or held. The harness computes it from the run's own record, and it is reported as harm or description only."}
  out-of-scope: {truth: none, description: "The benchmark declares the phenomenon outside what it can test."}

# What a probe asks the actor to do. `read_as` says how its result is read: as a position between
# the floor and the ceiling, or as harm against the no-memory arm.
probe_forms:
  state: {read_as: position, description: "Ask what holds now."}
  as_of: {read_as: position, description: "Ask what held at a past date."}
  premise: {read_as: position, description: "Give a task that presupposes a stale or false state. The actor must reject the premise."}
  act: {read_as: position, description: "Give a work task that names neither state. Its correct result depends on the planted change."}
  trace: {read_as: position, description: "Ask where a fact came from or what it rests on."}
  whose: {read_as: position, description: "Ask who said, decided or believes something."}
  impact: {read_as: position, description: "Ask which conclusions fall and which survive after a change."}
  what_if: {read_as: position, description: "Ask what would have followed under one changed event."}
  weigh: {read_as: position, description: "Ask for the state of a disagreement or the case on each side."}
  forecast: {read_as: position, description: "Ask for a probability or a belief level. A proper scoring rule scores it."}
  audit: {read_as: position, description: "Ask about the corpus itself, such as what changed or what is duplicated."}
  stable: {read_as: position, traits: [recall], description: "Ask for a fact that never changes. This is the recall control."}
  abstain: {read_as: harm, description: "Ask a question whose warranted answer is that the corpus does not say. A no-memory arm gets it right."}
  unaided: {read_as: harm, description: "Give a task that no stored memory bears on. Its key is the no-memory arm's own result."}

# What a probe form's `traits` may name: a closed set that code implements.
probe_form_traits:
  recall: "The probe asks for a fact that never changes; it is the recall control."

# How a probe's result is read.
result_readings:
  position: "The arm's place between the no-memory arm and the gold-evidence arm."
  harm: "The share of probes that the no-memory arm gets right and the arm gets wrong."

# How openly a rendered artefact carries a statement. The statement's content is fixed before
# rendering, so the level changes the text and never the key.
implicitness_levels:
  stated: "The text states the content and its status in plain words."
  paraphrased: "The text states the content in words that the probe does not use."
  unmarked: "The text gives the new content with no word that marks a change."
  implied: "The text states an observation that carries the content through a registered bridge."
  propagated: "The text changes another attribute, and a stated dependency makes this content follow."
  embedded: "The content arrives inside a side remark, a presupposition, a value in a file or metadata."
  silent: "The absence of an artefact carries the content. A stated rule must say that the artefact should exist."

# The slice that plans to build a phenomenon. A stage is a plan and no gate: the generator
# plants a phenomenon when every closed value that its entry and recipe name is implemented.
stages:
  s1: "Slice 1. One domain pack and a generated development project for the epistemic task suite."
  s2: "Slice 2. More packs, implied and propagated change, cascades, order, quantities, rules and seeds."
  s3: "Slice 3. Holders' minds, stated chances and causes, adversaries and audience rules."
  s4: "Slice 4. Media, other languages, large worlds and compound threads."
  out: "Never built. The entry is out of scope."

# How a probe's answer is scored.
scorers:
  judge_keyed: "A blind judge decides correctness from the task, the key and the answer."
  field_exact: "A parser reads a structured answer field and compares it with the key."
  set_match: "Precision and recall of a returned set against the key set."
  rank_tau: "Kendall's tau of a returned order against the key order."
  proper_score: "The Brier score of a stated probability against the stated chance or the recorded outcome."
  rubric_judge: "A blind judge applies the predeclared rubric lines."

# Whether a behaviour is wanted or unwanted in an answer.
behaviour_polarities:
  wanted: "The answer should show the behaviour."
  unwanted: "The answer should not show the behaviour."

# Difficulty dials. A round plan declares each dial's value for each family before the round runs.
dials:
  implicitness: "The implicitness level of the artefacts that carry the planted change."
  distance: "The number of sessions between the planted change and the probe."
  distractors: "The number of similar, irrelevant statements about the same or a similar entity."
  restatements: "The number of later artefacts that copy or report the old statement. None asserts the old value anew."
  twins: "The share of a family's threads that are planted with the change left out."
  composition: "The number of phenomena that one thread combines."
  history: "The number of sessions and pages in the world."
  margin: "How far apart the stated standing of two conflicting sources is."

# The splits of the benchmark. A world belongs to one split, and the wordbank's names, a pack's surface
# forms, bridges and work-task templates are each assigned to one split by a stable hash of their ids.
splits:
  train: "Public seed. Labelled spans for distilling the model-based sensors. Never scored."
  dev: "Public seed. For iterating the generator, the harness and the product."
  heldout: "Seed in evaluator custody. One decision, then the world is retired to `dev`."

# The wordbank's name spaces. A domain pack gives each entity type one of them for its names.
name_spaces:
  person: "A first name and a last name composed from syllables."
  org: "An organisation: a stem and a suffix."
  project: "A project code name."
  city: "A place name composed from two parts."
  product: "A product or system name."
  concept: "A named framework, charter or protocol."

# How a domain pack draws a value for an attribute. Each generator takes the arguments given here.
value_generators:
  integer: "A whole number from `min` to `max`, both included."
  choice: "One of the listed `from` values."
  holder: "One of the world's holders of the entity type `from`."
