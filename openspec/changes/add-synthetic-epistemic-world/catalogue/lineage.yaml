# Where the catalogue's phenomena and the generator's methods come from. A phenomenon names its
# lineage keys in `from`. An entry with no `from` was defined in this project.
#
# `checked` says how the entry was read for this change: `fetched` on 2026-11-10 from the address
# given, `in-repo` for code and specs in this repository, or `cited` for a published work that was
# not fetched again. `adopt` and `leave` say what this benchmark takes and what it does not.
schema_version: 1
lineage:
  recon:
    work: "RECON: Benchmarking Agent Memory for Compositional Reasoning over Long Contexts (2026)"
    address: https://arxiv.org/abs/2607.16716
    checked: fetched
    adopt: "A seeded production engine whose rules fire on recorded attributes; a provenance graph that the generation contract induces; invalidation that cuts edges and recomputes reach; counterfactuals by running the model again; a minimal proof trace per question; a check that each answer is unique; a filter that drops questions answerable without the corpus; a ceiling arm that reads the structured truth; models that write surface text only."
    leave: "Its generator code, because the paper states no code licence and its cases are single long case files, not work sessions in which an agent builds its own memory. Its multiple-choice format."
  stale:
    work: "STALE: Can LLM Agents Know When Their Memories Are No Longer Valid? (2026)"
    address: https://arxiv.org/abs/2605.06527
    checked: fetched
    adopt: "The definition of an implicit conflict by two conditions, incompatibility and no explicit negation; its two types, same attribute and propagated; its three probes, which are the probe forms state, premise and act here."
    leave: "Scenarios that a model writes and a judge validates, because the truth is then not known by construction. Distractor sessions taken from another dataset. One conflict pair per case."
  memconflict:
    work: "MemConflict: Evaluating Long-Term Memory Systems Under Memory Conflicts (2026)"
    address: https://arxiv.org/abs/2605.20926
    checked: fetched
    adopt: "Three conflict types by what is in doubt, validity in time, correctness and applicability; validity as fitness for the question asked; distance, distractors and implicit questions as difficulty dials; a retrieval view beside the answer view."
    leave: "Its dialogue-only histories built from user profiles."
  memoryagentbench:
    work: "MemoryAgentBench: Evaluating Memory in LLM Agents via Incremental Multi-Turn Interactions (2025)"
    address: https://arxiv.org/abs/2507.05257
    checked: fetched
    adopt: "Its four competencies as a coverage check on probe forms; conflict cases at one hop and at several hops."
    leave: "Its datasets, which edit facts about the real world and so collide with what a model already believes. It stays an outside calibration run."
  longmemeval:
    work: "LongMemEval: Benchmarking Chat Assistants on Long-Term Interactive Memory (2024)"
    address: https://arxiv.org/abs/2410.10813
    checked: cited
    adopt: "Its five abilities as a floor on coverage, and abstention as a scored outcome."
    leave: "Replay of a fixed bank of 500 questions as the development loop. It stays the public number, run by the existing public-suite lane."
  veracium:
    work: "Ground Truth First: A Longitudinal Evaluation Instrument for Agent Memory (Veracium, 2026)"
    address: https://arxiv.org/abs/2607.21962
    checked: fetched
    adopt: "Facts before text; volatility classes for how long a fact stays valid; sent against received channels; an open-book answerability check; a no-memory control and a full-history baseline; a second judge from another model family."
    leave: "Its generator as a dependency. It emits a personal chat and email script with 15 question types, it needs a newer Python than this repository, and a memory product's own team maintains it. Its fidelity check finds a missing fact and not an added one."
  frontiermemory:
    work: "FrontierMemory 1.0 (Letta Research, 2026)"
    address: https://www.letta.com
    checked: cited
    adopt: "Memory judged by success on later work, not by recall; separate scores for holding a fact and for using it."
    leave: "Its 15 fixed tasks. It stays an outside canary."
  membench:
    work: "membench, the memory-proof benchmark in this repository"
    address: benchmarks/membench
    checked: in-repo
    adopt: "Its record schema, bitemporal oracle, family classifications, wordbank, native renderers with parity reports, runner and scoring. The world emits membench records."
    leave: "Scenario templates as the unit of authoring. Each template is an island with its own entities and hand-written status spans."
  esb:
    work: "The Epistemic State Bench in this repository"
    address: benchmarks/epistemic
    checked: in-repo
    adopt: "Its families f01 to f31 as named phenomena; control twins; the amendment protocol for registering a family."
    leave: "Hand-written scenario fixtures as the only source of cases."
  f38:
    work: "The epistemic task suite in this repository (family f38)"
    address: openspec/changes/add-epistemic-task-bench
    checked: in-repo
    adopt: "Its project format, arms, lockstep runner, blind judge, case check, development gates and statistics. A generated project is a valid input to it."
    leave: "Nothing. The hand-written projects stay the independent anchor."
  utility:
    work: "The downstream utility instrument in this repository (family f32)"
    address: benchmarks/membench/utility
    checked: in-repo
    adopt: "Paired action episodes, harm accounting and the pinned low-cost actor."
    leave: "Its single configuration world."
  tms:
    work: "Truth maintenance systems (Doyle, 1979; de Kleer, 1986)"
    checked: cited
    adopt: "Belief status as reach from intact justifications. The warrant graph is a justification-based truth maintenance system."
    leave: "Assumption sets and labels, which the benchmark does not need."
  agm:
    work: "The AGM postulates of belief revision (Alchourrón, Gärdenfors and Makinson, 1985)"
