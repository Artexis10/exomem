# Realm: reference and scope. What is it about, and where does it hold?
schema_version: 2
phenomena:
  # --- identity ---
  - {id: identity.rename, stage: s1, says: "A system or an organisation is renamed, and both names are one thing.", from: [f38]}
  - {id: identity.alias, stage: s1, says: "A nickname or an abbreviation refers to a known entity.", from: [membench]}
  - {id: identity.homonym, stage: s2, twin_of: identity.alias, expect: [over_flags], says: "Two different entities share a name, and merging them is the error."}
  - {id: identity.merge, stage: s2, says: "Two entities merge into one, and the history of both belongs to it.", from: [membench]}
  - {id: identity.split, stage: s2, says: "One entity splits into two, and each later fact belongs to one of them.", from: [membench]}
  - {id: identity.role-or-holder, stage: s2, truth: [identity_map, state_fold], says: "A role title refers to whoever held the role at that time."}
  - {id: identity.back-reference, stage: s2, says: "A pronoun or a phrase such as the client refers back to an entity named in another document."}
  - {id: identity.misspelling, stage: s2, says: "A misspelt name is the same entity."}
  - {id: identity.person-renamed, stage: s2, says: "A person changes their name."}
  - {id: identity.unlinked-records, stage: s2, probes: [audit, state], says: "Two records describe one entity, and nothing links them.", from: [record-linkage]}
  - {id: identity.misfiled-fact, stage: s2, says: "A fact was filed under the wrong one of two similar entities."}
  - {id: identity.code-name, stage: s2, says: "People discuss a project under a code name."}
  - {id: identity.name-reused, stage: s3, truth: [identity_map, interval_order], says: "A retired name is reused for a new thing."}
  - {id: identity.version, stage: s3, says: "The second version of a product is the same product and a different artefact."}
  - {id: identity.never-named, stage: s3, says: "The record describes an entity and never names it."}
  - {id: identity.named-by-part, stage: s3, says: "People refer to a team by its location or by its lead."}
  # --- entities ---
  - {id: entities.owner-change, stage: s1, says: "An owner or a supplier changes.", from: [f38]}
  - {id: entities.role-change, stage: s1, says: "A person changes role, and the question asks who holds the role now."}
  - {id: entities.who-to-ask, stage: s2, probes: [act], says: "A task needs the person who is now responsible for a subject."}
  - {id: entities.reporting-line, stage: s2, says: "A reorganisation changes who reports to whom."}
  - {id: entities.membership, stage: s2, says: "People join and leave a group, and the question asks who is in it now."}
  - {id: entities.parts, stage: s2, says: "The question asks what a system consists of after parts were added and removed."}
  - {id: entities.location, stage: s2, says: "A thing moves, and the question asks where it is now."}
  - {id: entities.joint-owners, stage: s2, says: "A thing has two owners at once."}
  - {id: entities.acting-holder, stage: s2, truth: [identity_map, state_fold, interval_order], says: "An acting holder covers a role until a named date."}
  - {id: entities.inverse, stage: s2, truth: [rule_closure], says: "If one party supplies another, the other is supplied by the first."}
  - {id: entities.two-hop, stage: s2, truth: [rule_closure, state_fold], says: "The question asks for the owner of the system that a service depends on.", from: [membench, memoryagentbench]}
  - {id: entities.dissolved, stage: s2, says: "An entity ceased to exist, and the facts about it are history."}
  - {id: entities.succession, stage: s2, truth: [identity_map, interval_order], expect: [keeps_order], says: "The question asks who took over from whom, in order."}
  - {id: entities.kind-of-relation, stage: s3, says: "The kind of relation matters: a person who advises a team does not manage it.", from: [rippleedits]}
  - {id: entities.recurring-referent, stage: s3, truth: [identity_map, corpus_closure], probes: [state, audit], says: "Many records mention one thing, and a question about it gets what all of them say.", from: [esb, home-design]}
  - {id: entities.passing-mention, stage: s3, twin_of: entities.recurring-referent, truth: [identity_map, corpus_closure], probes: [state, audit], expect: [over_flags, invents_detail], says: "One record mentions a thing in passing, and a question about it gets that one mention and no more.", from: [esb, home-design]}
  # --- scope ---
  - {id: scope.one-client, stage: s1, norms: [scope-is-kept], says: "A rule holds for one client only.", from: [f38]}
  - {id: scope.environment, stage: s2, says: "A setting holds in one environment and not in another."}
  - {id: scope.exception, stage: s1, says: "A general rule has a stated exception."}
  - {id: scope.general-rule-applies, stage: s1, twin_of: scope.exception, expect: [over_flags], says: "The case falls under the general rule, and applying the exception is the error."}
  - {id: scope.override, stage: s2, says: "A specific rule overrides a general one."}
  - {id: scope.region, stage: s2, says: "A rule holds in one region."}
  - {id: scope.version, stage: s2, says: "A fact holds for one version of a product."}
  - {id: scope.period, stage: s2, truth: [scope_lattice, interval_order], says: "A rule holds during a stated period only."}
  - {id: scope.overgeneralised, stage: s2, says: "A later note restates a narrow fact as general, and the answer keeps the narrow scope."}
  - {id: scope.similar-project, stage: s2, says: "A fact from one project must not be applied to a similar project.", from: [utility]}
  - {id: scope.person-or-team, stage: s2, truth: [scope_lattice, holder_ledger], expect: [keeps_scope, keeps_attribution], says: "One person's preference is not the team's rule."}
  - {id: scope.widened-or-narrowed, stage: s2, truth: [scope_lattice, state_fold], expect: [keeps_scope, uses_current], says: "The scope of a rule widens or narrows on a date."}
  - {id: scope.conditional-rule, stage: s2, says: "A rule applies only when a recorded condition holds.", from: [memconflict]}
  - {id: scope.default, stage: s2, says: "A default applies wherever no override is recorded."}
  - {id: scope.population, stage: s3, says: "A finding holds for the group that was studied and not beyond it."}
  - {id: scope.nested, stage: s3, says: "A rule holds for a region, with an exception for one site inside the region."}
  - {id: scope.unstated, stage: s3, truth: [corpus_closure], expect: [asks_when_ambiguous], says: "Nobody recorded the scope of a rule, and the right act is to ask."}
  # --- quantity ---
  - {id: quantity.sum, stage: s2, says: "The answer is a total across several records.", from: [membench]}
  - {id: quantity.difference, stage: s2, says: "The answer is the change between two dated values.", from: [membench]}
  - {id: quantity.count, stage: s2, says: "The answer is the number of items that meet a condition across records."}
  - {id: quantity.table-cell, stage: s2, says: "The value sits in one cell of a table.", from: [membench]}
  - {id: quantity.threshold, stage: s2, says: "The question asks whether a value crossed a stated limit."}
  - {id: quantity.running-total, stage: s2, says: "The answer is a balance after a sequence of changes."}
  - {id: quantity.missing-term, stage: s2, truth: [quantity_calc, corpus_closure], norms: [arithmetic, stated-rule], probes: [state, audit], expect: [abstains_when_unknown, invents_detail], says: "One of the values that the sum needs is not recorded, and the answer says which."}
  - {id: quantity.unit-conversion, stage: s3, says: "Values in different units are combined."}
  - {id: quantity.rounding, stage: s3, says: "A rounded figure and an exact figure are the same value."}
  - {id: quantity.precision, stage: s3, expect: [states_uncertainty], says: "The answer keeps the precision that the source gave."}
  - {id: quantity.rate, stage: s3, says: "The answer is a rate, from an amount and a period."}
  - {id: quantity.percentage-base, stage: s3, says: "A percentage is taken of the right base."}
  - {id: quantity.total-or-parts, stage: s3, probes: [audit, weigh], expect: [flags_conflict], says: "A stated total disagrees with the sum of its listed parts."}
  - {id: quantity.double-count, stage: s3, truth: [quantity_calc, identity_map], says: "One item appears in two records and must be counted once."}
  - {id: quantity.wrong-magnitude, stage: s3, probes: [audit, weigh], expect: [flags_conflict], says: "A figure is wrong by a factor of one thousand."}
  - {id: quantity.mean-or-total, stage: s3, says: "A later note confuses a mean with a total."}
  - {id: quantity.measurement-error, stage: s3, expect: [states_uncertainty], says: "A measured value carries a stated error."}
  - {id: quantity.amount-at-date, stage: s4, truth: [quantity_calc, interval_order], says: "An amount in one currency is valued at a date."}
  # --- statistics ---
  - {id: statistics.small-sample, stage: s3, truth: [judged], key: rubric-track, norms: [], says: "A rate comes from very few cases."}
  - {id: statistics.survivors-only, stage: s3, truth: [judged], key: rubric-track, norms: [], says: "The records exist only for the cases that passed a filter."}
  - {id: statistics.reversal-on-pooling, stage: s3, truth: [judged], key: rubric-track, norms: [], says: "A trend reverses when groups are combined.", from: [causal]}
  - {id: statistics.rare-condition, stage: s3, truth: [quantity_calc, chance_model], norms: [stated-model, arithmetic], probes: [forecast, state], says: "A positive test for a rare condition leaves the condition unlikely."}
  - {id: statistics.no-denominator, stage: s3, probes: [abstain, weigh], expect: [abstains_when_unknown], says: "A count is given without the number it is a share of."}
  - {id: statistics.best-of-many, stage: s3, truth: [quantity_calc, corpus_closure], says: "A report cites the best of many trials, and the world holds all the trials."}
  - {id: statistics.not-comparable, stage: s3, truth: [judged], key: rubric-track, norms: [], expect: [keeps_scope], says: "Two figures that were measured differently are compared."}
  - {id: statistics.replication, stage: s3, truth: [quantity_calc, state_fold], says: "A finding is repeated, and it holds or it does not."}
  - {id: statistics.outlier, stage: s3, truth: [judged], key: rubric-track, norms: [], says: "One reading lies far from the rest."}
  - {id: statistics.points-or-percent, stage: s3, says: "A change in percentage points is reported as a percent change."}
  - {id: statistics.return-to-average, stage: s4, truth: [judged], key: rubric-track, norms: [], says: "An extreme value is followed by an ordinary one, and no cause is recorded."}
  - {id: statistics.noise-as-trend, stage: s4, truth: [quantity_calc], norms: [stated-model, arithmetic], says: "A change inside the stated normal variation is reported as a trend."}
  # --- meaning ---
  - {id: meaning.team-jargon, stage: s2, says: "A word has a special meaning inside one team."}
  - {id: meaning.acronym-clash, stage: s2, truth: [identity_map, scope_lattice], expect: [resolves_identity, keeps_scope], says: "One acronym stands for two things in two contexts."}
  - {id: meaning.term-redefined, stage: s3, truth: [state_fold, interval_order], expect: [uses_current, keeps_scope], says: "The definition of a term changes on a date, and older figures use the old definition."}
  - {id: meaning.two-senses, stage: s3, expect: [asks_when_ambiguous, keeps_scope], says: "A word has two senses in the corpus, and the task does not say which."}
  - {id: meaning.category-boundary, stage: s3, truth: [rule_closure], says: "The world's stated rule decides whether an item falls under a category."}
  - {id: meaning.category-renamed, stage: s3, truth: [identity_map], expect: [resolves_identity], says: "A category is renamed, and its counts carry over."}
  - {id: meaning.what-counts-as-one, stage: s3, truth: [scope_lattice, quantity_calc], says: "Two records count different units, such as tickets and users."}
  - {id: meaning.scale-changed, stage: s3, truth: [state_fold, quantity_calc], says: "A rating scale changes from five points to ten."}
  - {id: meaning.no-fixed-threshold, stage: s3, truth: [judged], key: rubric-track, norms: [], says: "A word such as large has no recorded threshold, and the answer says so."}
  - {id: meaning.mild-wording, stage: s3, truth: [judged], key: rubric-track, norms: [], says: "A report words a failure mildly."}
  - {id: meaning.translated-term, stage: s4, says: "A term and its translation cover different things."}
  - {id: meaning.sense-drift, stage: s4, truth: [judged], key: rubric-track, norms: [], says: "A word's use shifts gradually, and no record marks a date."}
