# Realm: conflict and revision. What follows when statements disagree or change?
schema_version: 2
phenomena:
  # --- correction ---
  - {id: correction.refuted-claim, stage: s1, says: "A source refutes an earlier claim, and later work must not reuse the claim.", from: [f38]}
  - {id: correction.retraction, stage: s2, probes: [state, premise, abstain], says: "An author withdraws a statement and gives no replacement.", from: [membench]}
  - {id: correction.erratum, stage: s2, says: "A publisher corrects a figure that it published."}
  - {id: correction.user-correction, stage: s1, says: "The user says that the record has something wrong, and gives the right value.", from: [esb]}
  - {id: correction.self-correction, stage: s2, implicit: [unmarked, embedded], says: "A person corrects their own earlier statement in passing."}
  - {id: correction.clarification, stage: s2, truth: [state_fold, scope_lattice], expect: [uses_current, keeps_scope], says: "A later note narrows what an earlier statement meant and does not withdraw it."}
  - {id: correction.corrected-twice, stage: s2, says: "A correction is itself corrected."}
  - {id: correction.wrong-correction, stage: s2, says: "A correction is shown to be wrong, and the first statement stands again."}
  - {id: correction.partial, stage: s2, expect: [uses_current, keeps_unaffected], says: "A correction changes one detail of a statement and leaves the rest."}
  - {id: correction.continued-influence, stage: s2, truth: [state_fold, warrant_graph], probes: [impact, act], expect: [propagates_change, trusts_stale], says: "A conclusion built on a withdrawn statement is still in use.", from: [continued-influence, tms]}
  - {id: correction.silent-edit, stage: s2, implicit: [embedded], truth: [state_fold, corpus_closure], says: "Someone edits a document in place and leaves no notice of the change.", from: [esb]}
  - {id: correction.refuted-kept, stage: s2, probes: [state, audit], expect: [keeps_kind], says: "A later task asks what was tried and ruled out, and the answer names the refuted idea as refuted.", from: [esb, home-design]}
  - {id: correction.late, stage: s2, says: "A correction arrives long after many records repeated the error."}
  - {id: correction.covers-one-claim, stage: s2, expect: [uses_current, keeps_unaffected], says: "A retraction covers one claim of a document and not the others."}
  - {id: correction.spelling-only, stage: s2, twin_of: correction.erratum, expect: [over_flags], says: "A correction changes spelling only and changes no fact."}
  - {id: correction.rejected-by-author, stage: s3, probes: [weigh], expect: [flags_conflict, keeps_attribution], says: "The original author rejects a correction."}
  # --- conflict ---
  - {id: conflict.equal-standing, stage: s2, says: "Two sources of equal standing disagree, and nothing settles it.", from: [membench, memoryagentbench]}
  - {id: conflict.value-mismatch, stage: s2, says: "Two records give different numbers for the same quantity."}
  - {id: conflict.apparent-only, stage: s2, truth: [state_fold, scope_lattice], expect: [over_flags, keeps_scope], says: "Two statements look contradictory and differ only in their time or their scope.", from: [memconflict]}
  - {id: conflict.settled-later, stage: s2, norms: [later-replaces], expect: [uses_current, cites_source], says: "A third record later settles a disagreement."}
  - {id: conflict.inside-one-document, stage: s2, says: "One document contradicts itself."}
  - {id: conflict.unnoticed, stage: s2, probes: [audit, act], says: "Two notes conflict, no record says so, and the conflict must be raised without a prompt.", from: [esb]}
  - {id: conflict.many-against-authority, stage: s2, norms: [stated-precedence], expect: [uses_current, cites_source], says: "Several notes of low standing outnumber one record that a stated rule makes authoritative."}
  - {id: conflict.same-person-two-times, stage: s2, truth: [state_fold, holder_ledger], says: "One person says opposite things at two times and acknowledges no change."}
  - {id: conflict.concordant, stage: s2, twin_of: conflict.equal-standing, expect: [over_flags], says: "Two similar statements agree, and reporting a conflict is the error.", from: [esb]}
  - {id: conflict.three-way, stage: s3, says: "Three sources each give a different value."}
  - {id: conflict.unit-mismatch, stage: s3, truth: [quantity_calc], expect: [over_flags], says: "Two records agree once their units are converted."}
  - {id: conflict.different-definitions, stage: s3, truth: [scope_lattice], expect: [over_flags, keeps_scope], says: "Two records count different things under one name."}
  - {id: conflict.coarse-and-fine, stage: s3, truth: [identity_map], expect: [over_flags], says: "A coarse statement and a fine one are compatible, such as a region and a town inside it."}
  - {id: conflict.against-common-knowledge, stage: s3, norms: [world-is-the-record], expect: [uses_current], says: "The invented world's record differs from what is true of the real world, and the answer follows the world's record.", from: [knowledge-conflict, memoryagentbench]}
  - {id: conflict.awaiting-ruling, stage: s3, says: "A disagreement awaits the ruling of a named authority."}
  # --- argument ---
  - {id: argument.both-sides, stage: s1, says: "A claim has recorded evidence for it and against it.", from: [f38]}
  - {id: argument.rebuttal, stage: s1, says: "New evidence supports the opposite conclusion.", from: [pollock]}
  - {id: argument.undercut, stage: s2, says: "New evidence removes the reason to believe a claim and does not support the opposite.", from: [pollock]}
  - {id: argument.support-chain, stage: s2, probes: [trace], expect: [cites_source], says: "Evidence supports a claim through an intermediate claim.", from: [tms]}
  - {id: argument.counterexample, stage: s2, truth: [warrant_graph, rule_closure], says: "One recorded counterexample defeats a general claim.", from: [defeasible-nli]}
  - {id: argument.decided-against-evidence, stage: s2, truth: [warrant_graph, kind_tag], expect: [keeps_kind, cites_source], says: "A decision went against the stated evidence, for a recorded reason."}
  - {id: argument.reopened, stage: s2, says: "New evidence reopens a question that was settled.", from: [esb]}
  - {id: argument.irrelevant-evidence, stage: s2, twin_of: argument.reopened, expect: [over_flags], says: "New evidence looks related and does not bear on the claim.", from: [esb]}
  - {id: argument.reinstatement, stage: s3, says: "A defeater is itself defeated, so the first argument stands again.", from: [dung, pollock]}
  - {id: argument.which-stand, stage: s3, says: "Given which arguments attack which, the answer names the arguments that stand.", from: [dung]}
  - {id: argument.unproven-side, stage: s3, truth: [warrant_graph, kind_tag], norms: [stated-rule], says: "A stated rule says which side must prove its case, and that side has not."}
  - {id: argument.unstated-premise, stage: s3, truth: [judged], key: rubric-track, norms: [], says: "A conclusion rests on a premise that nobody stated."}
  - {id: argument.strong-against-many-weak, stage: s3, truth: [judged], key: rubric-track, norms: [], says: "One strong piece of evidence stands against several weak ones."}
  - {id: argument.same-evidence-both-sides, stage: s3, truth: [judged], key: rubric-track, norms: [], says: "Both sides cite the same observation."}
  - {id: argument.trade-off, stage: s3, truth: [judged], key: rubric-track, norms: [], says: "Options are compared on several criteria, and no option wins on all of them."}
  # --- propagation ---
  - {id: propagation.dependent-update, stage: s1, probes: [act, state], says: "One fact depends on another, the other changes, and the first must be updated.", from: [f38, stale]}
  - {id: propagation.plan-invalidated, stage: s1, probes: [act, state], says: "A plan rests on a fact that changed."}
  - {id: propagation.cascade, stage: s2, says: "A change runs through several levels of dependent conclusions.", from: [recon, tms]}
  - {id: propagation.independent-support, stage: s2, says: "A conclusion loses one support and survives on another.", from: [recon, agm]}
  - {id: propagation.support-collapse, stage: s2, says: "A conclusion's only support is withdrawn.", from: [esb, tms]}
  - {id: propagation.derived-figure, stage: s2, truth: [warrant_graph, quantity_calc], says: "A total must be computed again when one input changes."}
  - {id: propagation.neighbour-unchanged, stage: s2, twin_of: propagation.dependent-update, expect: [keeps_unaffected, over_flags], says: "A related fact does not depend on the changed fact and must stay as it is.", from: [rippleedits, agm]}
  - {id: propagation.earlier-conclusion-kept, stage: s2, probes: [as_of, state], expect: [uses_current, keeps_unaffected], says: "After a dependent conclusion is updated, a later task asks for the earlier conclusion, and the answer gives it as history.", from: [esb, home-design]}
  - {id: propagation.rename-reaches-dependents, stage: s2, truth: [warrant_graph, identity_map], expect: [propagates_change, resolves_identity], says: "A rename reaches every record that depends on the old name.", from: [rippleedits]}
  - {id: propagation.group-to-member, stage: s2, truth: [warrant_graph, rule_closure], says: "A change to a group applies to each of its members.", from: [rippleedits]}
  - {id: propagation.composed-fact, stage: s2, truth: [warrant_graph, rule_closure], says: "A fact composed of two relations changes when one of the relations changes.", from: [rippleedits, memoryagentbench]}
  - {id: propagation.stale-computed-answer, stage: s2, says: "A stored computed answer was built before its inputs changed."}
  - {id: propagation.partial-dependency, stage: s3, says: "Only part of a dependent conclusion rests on the changed fact."}
  - {id: propagation.mutual-dependency, stage: s3, says: "Two facts depend on each other, and the change is applied once."}
  - {id: propagation.past-decision, stage: s3, truth: [warrant_graph, kind_tag], expect: [propagates_change, keeps_kind], says: "A past decision rested on a value that later changed, and the answer reports the decision as made and says that its basis changed.", from: [home-design]}
