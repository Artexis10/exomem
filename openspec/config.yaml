schema: spec-driven

context: |
  exomem — a Model Context Protocol server over an Obsidian/markdown vault. It turns the
  vault you already own into a multimodal, hybrid-search knowledge base for Claude.

  Tech stack: Python 3.11+, FastMCP, sqlite (embeddings sidecar). Hybrid retrieval =
  BM25 + bge-base-en-v1.5 (768d, GPU) + wikilink graph + bge-reranker, fused via RRF.
  Multimodal extraction is server-side: Tesseract OCR, faster-whisper ASR, CLIP visual
  search, MarkItDown for office docs. Optional extras: embeddings, media, diarization,
  vision. NSSM-managed Windows service; GitHub OAuth proxy; cloudflared tunnel.

  THE CORE CONSTRAINT — "pure substrate", restated as the authority-and-effects
  matrix (ratified 2026-08-30, per the 2026-08 no-nudge architecture review): the
  server MEASURES, the brain (Claude/Max) REASONS. What a server-side model may do
  is bounded by what its output is allowed to touch, in addition to the class bans
  below, which stand unchanged. Retrieval scorers (embeddings, rerankers) may RANK.
  Frozen, deterministic content transducers (ASR, OCR, CLIP, pinned-weight frozen
  captioners, voice-embedding speaker-ID) may TRANSCRIBE across modalities —
  default-off wherever they emit prose, and an unpinned or instruction-following
  generative model is out of bounds in EVERY modality pairing except as an
  instrument under the next rule. Instruments (frozen verifiers such as the NLI
  stance classifier, and admitted generative models) may LABEL: each answers one
  closed repository question with probabilities over a closed label set plus
  abstain, never sampled text — pinned identity (an opt-in API placement is
  identified by provider/model/snapshot and flagged unpinned_weights), a versioned
  template with vault text only in delimited data slots, a versioned label map,
  inference only in a disposable supervised worker, off the synchronous write
  path — into an append-only readings ledger. The deterministic dreamer models
  over readings and the graph; readings may originate sensed families surfaced
  pull-first for review, never suppress or reorder structural families, and never
  enter canon, decisions, retrieval, ranking, or policy except through a governed
  write the agent authors citing the reading (owner rulings R1-R7, 2026-09-28;
  change add-sensed-epistemic-model). A model serving two roles is bound by each
  role's rule for that output.
  The agent alone judges conversation and authors proposals; mutation happens only
  through governed leaves. Same-modal text-to-text generation server-side stays
  banned: a server-side reasoning LLM is NEVER added (an LLM instrument emitting
  closed-label probabilities measures; it does not reason or write). No confidence/authority
  floats on notes. Epistemic surfaces (conflict, staleness) MEASURE and SURFACE
  for review; they never auto-decay notes or rank their authority.

  Surface consistency (engraph/Endstate-style): every core operation should be reachable
  consistently across the MCP tools, the CLI (`python -m exomem <cmd>`), and the personal
  REST facade (`/api/<tool>`), all over the SAME leaf functions — one documented contract,
  zero logic duplication.

  Test: `PYTHONPATH=src EXOMEM_DISABLE_EMBEDDINGS=1 python -m pytest -q` (run via `uv run`).
  Lint: `ruff check`. Keep the suite green; torch-backed semantic tests run desk-side.

  The skill scaffold under `src/exomem/_scaffold/` is hand-authored + leak-guarded
  (tests/test_scaffold_no_leak.py) — keep it generic; no personal/brand tokens anywhere
  under `src/exomem/`.

rules:
  proposal:
    - State default-off + soft-fail behavior explicitly for any optional/heavy capability.
    - Name the pure-substrate justification when a capability runs a model.
  tasks:
    - "TDD order: pure-logic unit tests before wiring; torch/model paths behind soft-fail seams."
